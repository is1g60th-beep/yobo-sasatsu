<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予防査察アプリ（揖斐郡 条例・規程対応）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 点検票：JIS安全色（防火の赤・安全の緑・注意の黄）を意味のある色としてだけ使う */
:root{
  --paper:#EEF1EF; --sheet:#FFFFFF; --rule:#C5CCC9; --rule2:#E1E6E3; --ink:#1F2328; --sub:#59615E;
  --red:#C8102E; --red-t:#FBE6E9; --green:#00805A; --green-t:#E2F2EB; --yellow:#E8A800; --yellow-t:#FFF4D1; --blue:#1F5AA6;
  --gothic:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif; --mincho:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#171B1A; --sheet:#202624; --rule:#3A4340; --rule2:#2C3331; --ink:#E9EEEC; --sub:#A4AEAA;
  --red:#FF5C6E; --red-t:#3A1C21; --green:#3CC48F; --green-t:#15302A; --yellow:#FFC93C; --yellow-t:#3A3016; --blue:#8DB6F2;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--gothic);-webkit-text-size-adjust:100%;font-feature-settings:"palt" 0}
#view{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:var(--gothic)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:700}

/* 見出し */
.bar{display:flex;align-items:center;gap:8px;margin:4px 0 14px;min-height:48px}
h1{font-size:22px;line-height:1.3;margin:0;flex:1;min-width:0;font-weight:700;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .s{font-size:12px}
h2{font-size:15px;margin:0 0 10px;padding-top:10px;border-top:3px solid var(--ink);font-weight:700;letter-spacing:.04em}
h3{font-size:13.5px;margin:18px 0 4px;color:var(--sub);font-weight:700}

/* 様式の欄（白い用紙）。影なし、角は小さく */
.card{display:block;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:0 14px 14px;margin:0 0 12px;text-align:left;color:inherit;font:inherit}
.card>h2:first-child{margin:0 -14px 10px;padding:10px 14px 0}
button.card{cursor:pointer;padding:12px 14px}
.s{color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:12.5px;margin:6px 0;line-height:1.6}
.empty{color:var(--sub);padding:36px 6px;line-height:1.9;border-top:3px solid var(--ink);margin-top:6px}

/* 一覧 */
.obj{position:relative;border-left:6px solid var(--rule)}
.obj:has(.chip.k1),.obj:has(.chip.k2){border-left-color:var(--red)}
.obj:has(.chip.k3){border-left-color:var(--yellow)}
.obj .t{font-weight:700;font-size:17px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips.filt{margin:4px 0 10px}
.chip{font-size:12.5px;border:1px solid var(--rule);border-radius:2px;padding:2px 8px;background:var(--sheet);color:var(--ink)}
button.chip{cursor:pointer;padding:8px 12px;min-height:40px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip.ng{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.chip.k1,.chip.k2{color:var(--red);border-color:var(--red)}
.chip.k3{color:var(--ink);border-color:var(--yellow);background:var(--yellow-t)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 16px;border-radius:3px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;gap:4px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#1a0004}}
.btn.ghost{border-color:transparent;background:transparent;padding:8px 4px;color:var(--ink);font-weight:400}
.btn.danger{color:var(--red);border-color:var(--rule);font-weight:400}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
.btn.wide{width:100%;margin:6px 0 12px}
.row{display:flex;gap:8px;margin-top:12px}.row.wrap{flex-wrap:wrap}.row .btn.pri{flex:1}

/* 入力 */
.search{width:100%;font-size:16px;padding:12px 14px;border-radius:3px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);margin-bottom:8px}
.f{display:block;margin:0 0 12px}.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:3px;font-weight:700}
.f input,.f select,textarea,.comp select,.comp input{width:100%;font-size:16px;padding:10px;border-radius:2px;border:1px solid var(--rule);border-bottom:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.f small,.cb small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
.cb{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule2)}
.cb input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--red)}
.cb.inline{border:0;padding:0 0 6px}
.hide{display:none}
.comp{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-bottom:6px;align-items:center}
.sticky{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:2}

/* 対象物の罫線表（項目｜内容） */
dl.form{display:grid;grid-template-columns:5.5em 1fr;margin:0 -14px}
.card.sheet{padding-top:0}
dl.form dt,dl.form dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--rule)}
dl.form dt{background:var(--paper);color:var(--sub);font-size:13px;font-weight:700;border-right:1px solid var(--rule)}
dl.form dd{font-size:15px}
.tok{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:2px;padding:0 5px;vertical-align:1px}
.cls b{display:block;font-size:18px}.cls span{display:block;font-size:14px}.cls small{color:var(--sub);font-size:11.5px}
.cls.k1 b,.cls.k2 b{color:var(--red)}
.warn{background:var(--yellow-t);color:var(--ink);border-left:5px solid var(--yellow);padding:10px 12px;font-size:13.5px;margin:12px 0;line-height:1.6}

/* 査察記録 */
.li{display:flex;justify-content:space-between;gap:8px;width:100%;padding:13px 0;border:0;border-top:1px solid var(--rule2);background:none;color:inherit;font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.ng{color:var(--red)}

/* 判定結果：左の色帯が JIS 安全色 */
.jr{display:grid;grid-template-columns:4.2em 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--rule2)}
.jr .t{font-weight:700;line-height:1.45}.jr.no{opacity:.55}
.st{font-size:12px;font-weight:700;text-align:center;padding:3px 0;height:fit-content;border-radius:2px}
.st.req{background:var(--red);color:#fff}.st.chk{background:var(--yellow);color:#1F2328}.st.no{border:1px solid var(--rule);color:var(--sub)}
@media (prefers-color-scheme:dark){.st.req{color:#1a0004}}
.law{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;padding:3px 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* 査察チェック：判子 */
.prog{height:8px;background:var(--rule2);overflow:hidden;margin:10px 0 4px}.prog div{height:100%;background:var(--green)}
.ck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:14px 0;border-top:1px solid var(--rule2)}
.ck .t{font-size:15px;line-height:1.55}.ck .t small{color:var(--sub);display:block}
.ck .law{grid-column:1}
.ck .seg{grid-column:2;grid-row:1 / span 2}
.ck.ng .t{color:var(--red);font-weight:700}
@media (max-width:420px){.ck{grid-template-columns:1fr}.ck .seg{grid-column:1;grid-row:auto;justify-content:flex-start}}
.seg{display:flex;gap:6px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--sub);cursor:pointer;padding:2px;min-width:54px}
.stamp .seal{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1.5px dashed var(--rule);font-family:var(--mincho);font-size:22px;font-weight:700;color:var(--sub);background:var(--sheet)}
.stamp .cap{font-size:11px;line-height:1.2}
.stamp.on .seal{border:3px double currentColor;transform:rotate(-9deg)}
.stamp.ok.on{color:var(--green)}.stamp.ok.on .seal{color:var(--green);background:var(--green-t)}
.stamp.ng.on{color:var(--red)}.stamp.ng.on .seal{color:var(--red);background:var(--red-t)}
.stamp.na.on{color:var(--ink)}.stamp.na.on .seal{color:var(--ink);background:var(--paper)}
.stamp.on .cap{font-weight:700}
.stamp.pressed .seal{animation:press .22s cubic-bezier(.3,1.6,.6,1)}
@keyframes press{from{transform:scale(1.35) rotate(-2deg);opacity:.2}to{transform:scale(1) rotate(-9deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.pressed .seal{animation:none}}

/* 指摘事項 */
.fd{border:1px solid var(--rule);border-left:5px solid var(--red);padding:10px;margin-bottom:10px;background:var(--sheet)}
.fdh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.fdh b{font-size:15px;color:var(--red);min-width:1.6em}
.fdh select{flex:1;font-size:15px;padding:8px;border-radius:2px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}

/* 違反処理の流れ（順序がある） */
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--rule2)}
.step>b{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px}
.step .t{font-weight:700}
table.mini{width:100%;border-collapse:collapse;font-size:13px}.mini th,.mini td{border:1px solid var(--rule);padding:6px;text-align:left;vertical-align:top}.mini th{background:var(--paper)}.mini td:first-child{white-space:nowrap;font-weight:700}

/* 条文 */
details.law-r{padding:12px 14px}
details.law-r summary{cursor:pointer;list-style:none;font-size:14.5px;line-height:1.55}details.law-r summary::-webkit-details-marker{display:none}
details.law-r[open] summary{padding-bottom:8px;border-bottom:1px solid var(--rule2)}
.tag{font-size:11px;font-weight:700;border-radius:2px;padding:1px 6px;margin-right:6px;border:1px solid var(--blue);color:var(--blue);vertical-align:2px}
.loc .tag{border-color:var(--red);color:var(--red)}.kok .tag{border-color:var(--sub);color:var(--sub)}
.lt{white-space:pre-wrap;font-family:var(--mincho);font-size:15px;line-height:1.95;margin:10px 0}
.egov{margin-top:8px}.egov-t{border-left:3px solid var(--blue);padding-left:12px}
.law-r a{color:var(--blue);font-size:13.5px;display:inline-block;margin-top:6px}
mark{background:var(--yellow);color:#1F2328;padding:0 1px}

/* 下部ナビ：選択中は上辺に赤い帯 */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sheet);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-top:4px solid transparent;background:none;color:var(--sub);font-size:11.5px;padding:6px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);font-weight:700;border-top-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(20,24,23,.5);display:grid;place-items:center;z-index:9;padding:20px}.modal .box{background:var(--sheet);border-top:4px solid var(--red);padding:18px;max-width:340px;width:100%}

/* 書類プレビュー（常に白い紙） */
.paper{background:#fff;color:#000;border:1px solid var(--rule);padding:20px 16px;margin:10px 0 20px;font-family:var(--mincho);font-size:14px;line-height:1.8;overflow-x:auto}
.paper .c{text-align:center}.paper .r{text-align:right}.paper .frm,.paper .small{font-size:12px}.paper h2{letter-spacing:.3em;font-size:18px;margin:10px 0;border:0;padding:0}
.dt{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:13px}.dt th,.dt td{border:1px solid #000;padding:4px 6px;vertical-align:top;text-align:left}.dt th{background:#f2f2f2;white-space:nowrap}.list td:first-child{text-align:center;width:2.5em}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-go="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>対象物</button>
  <button data-go="laws"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>条文検索</button>
  <button data-go="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>違反処理</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
</nav>
<script type="application/json" id="localtexts">{"docs": [{"key": "kayojo", "title": "揖斐郡消防組合火災予防条例", "url": "http://www.fd-ibi.jp/jorei/kayojo.pdf"}, {"key": "kayoki", "title": "揖斐郡消防組合火災予防規則", "url": "http://www.fd-ibi.jp/jorei/kayoki.pdf"}, {"key": "kayosaki", "title": "揖斐郡消防組合火災予防査察規程", "url": "http://www.fd-ibi.jp/jorei/kayosaki.pdf"}, {"key": "kiseki", "title": "揖斐郡消防組合危険物規制規則", "url": "http://www.fd-ibi.jp/jorei/kiseki.pdf"}, {"key": "sotsuyo", "title": "遠隔移報システム等による火災通報の取扱要綱", "url": "http://www.fd-ibi.jp/jorei/sotsuyo.pdf"}, {"key": "boukahyouji", "title": "防火対象物に係る表示制度要綱", "url": "http://www.fd-ibi.jp/jorei/boukahyouji.pdf"}], "arts": [{"d": "kayojo", "a": "冒頭", "h": "", "t": "○揖斐郡消防組合火災予防条例昭和45年４月１日条例第16号\n目次\n第１章 総則（第１条）\n第２章 削除\n第３章 火を使用する設備の位置、構造及び管理の基準等\n第１節 火を使用する設備及びその使用に際し、火災の発生のおそれのある設備の位置、構造及び管理の基準（第３条―第17条の３）\n第２節 火を使用する器具及びその使用に際し、火災の発生のおそれのある器具の取扱いの基準（第18条―第22条の２）\n第３節 火の使用に関する制限等（第23条―第28条）\n第４節 火災に関する警報の発令中における火の使用の制限（第29条）\n第３章の２       住宅用防災機器の設置及び維持に関する基準等（第29条の２―第29条の７）\n第３章の３       林野火災の予防（第29条の８・第29条の９）\n第４章 指定数量未満の危険物及び指定可燃物の貯蔵及び取扱いの技術上の基準等\n第１節 指定数量未満の危険物の貯蔵及び取扱いの技術上の基準等（第30条―第32条）\n第２節 指定可燃物等の貯蔵及び取扱いの技術上の基準等（第33条―第34条の２）\n第３節 基準の特例（第34条の３）\n第５章 避難管理（第35条―第42条）\n第５章の２       屋外催しに係る防火管理（第42条の２―第42条の３）\n第６章 雑則（第43条―第48条）\n第７章 罰則（第49条・第50条）"}, {"d": "kayojo", "a": "附則", "h": "", "t": "附則\n第１章 総則"}, {"d": "kayojo", "a": "第１条", "h": "（目的）", "t": "第１条 この条例は、消防法（昭和23年法律第186号。以下「法」という。）第９条の規定に基づき火を使用する設備の位置、構造及び管理の基準等について、法第９条の２の規定に基づき住宅用防災機器の設置及び維持に関する基準等について、法第９条の４の規定に基づき指定数量未満の危険物等の貯蔵及び取り扱いの基準等について並びに法第22条第４項の規定に基づき火災に関する警報の発令中における火の使用の制限について定めるとともに、揖斐郡消防組合における火災予防上必要な事項を定めることを目的とする。\n第２章 削除"}, {"d": "kayojo", "a": "第２条", "h": "", "t": "第２条 削除\n第３章 火を使用する設備の位置、構造及び管理の基準等\n第１節 火を使用する設備及びその使用に際し、火災の発生のおそれのある設備の位置、構造及び管理の基準"}, {"d": "kayojo", "a": "第３条", "h": "（炉）", "t": "第３条 炉の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   火災予防上安全な距離を保つことを要しない場合（不燃材料（建築基準法（昭和25年法律第201号）第２条第９号に規定する不燃材料をいう。以下同じ。）で有効に仕上げをした建築物等（消防法施行令（昭和36年政令第37号。\n以下「令」という。）第５条第１項第１号に規定する建築物等をいう。以下同じ。）の部分の構造が耐火構造（建築基準法第２条第７号に規定する耐火構造をいう。以下同じ。）であって、間柱、下地その他主要な部分を準不燃材料（建築基準法施行令（昭和25年政令第338号）第１条第５号に規定する準不燃材料をいう。以下同じ。）で造ったものである場合又は当該建築物等の部分の構造が耐火構造以外の構造であって、間柱、下地その他主要な部分を不燃材料で造ったもの（有効に遮熱できるものに限る。）である場合をいう。以下同じ。）を除き、建築物等及び可燃性の物品から次の各号に掲げる距離のうち、火災予防上安全な距離として消防長（消防署長）が認める距離以上の距離を保つこと。\nア     別表第３の炉の項に掲げる距離\nイ     対象火気設備等及び対象火気器具等の離隔距離に関する基準（平成14年消防庁告示第１号）により得られる距離\n(2)    可燃物が落下し、又は接触するおそれのない位置に設けること。\n(3)    可燃性のガス又は蒸気が発生し、又は滞留するおそれのない位置に設けること。\n(4)    階段、避難口等の付近で避難の支障となる位置に設けないこと。\n(5)    燃焼に必要な空気を取り入れることができ、かつ、有効な換気を行うことができる位置に設けること。\n(6)    屋内に設ける場合にあっては、土間又は不燃材料のうち金属以外のもので造った床上に設けること。ただし、金属で造った床上又は台上に設ける場合において防火上有効な措置を講じたときは、この限りでない。\n(7)    使用に際し火災の発生のおそれのある部分を不燃材料で造ること。\n(8)    地震その他の振動又は衝撃（以下「地震等」という。）により容易に転倒し、き裂し、又は破損しない構造とすること。\n(9)    表面温度が過度に上昇しない構造とすること。\n(10)   屋外に設ける場合にあっては、風雨等により口火及びバーナーの火が消えないような措置を講ずること。ただし、第18号の２アに掲げる装置を設けたものにあっては、この限りでない。\n(11)   開放炉又は常時油類その他これらに類する可燃物を煮沸する炉にあっては、その上部に不燃性の天蓋及び排気筒を屋外に通ずるように設けるとともに、火粉の飛散又は火炎の伸長により火災の発生のおそれのあるものにあっては、防火上有効なしゃへいを設けること。\n(12)   溶融物があふれるおそれのある構造の炉にあっては、あふれた溶融物を安全に誘導する装置を設けること。\n(13)   削除\n(14)   熱風炉に附属する風道については、次によること。\nア     風道並びにその被覆及び支わくは、不燃材料で造るとともに、風道の炉に近接する部分に防火ダンパーを設けること。\nイ     炉からアの防火ダンパーまでの部分及び当該防火ダンパーから２メートル以内の部分は、建築物等の可燃性の部分及び可燃性の物品との間に15センチメートル以上の距離を保つこと。ただし、厚さ10センチメートル以上の金属以外の不燃材料で被覆する部分については、この限りでない。\nウ     給気口は、じんあいの混入を防止する構造とすること。\n(15)   薪、石炭その他の固体燃料を使用する炉にあっては、たき口から火粉等が飛散しない構造とするとともに、ふたのある不燃性の取灰入れを設けること。この場合において、不燃材料以外の材料で造った床上に取灰入れを設けるときは、不燃材料で造った台上に設けるか、又は防火上有効な底面通気をはかること。\n(16)   削除\n(17)   灯油、重油その他の液体燃料を使用する炉の附属設備は、次によること。\nア     燃料タンクは、使用中燃料が漏れ、あふれ、又は飛散しない構造とすること。\nイ     燃料タンクは、地震等により容易に転倒又は落下しないように設けること。\nウ     燃料タンクとたき口との間には、２メートル以上の水平距離を保つか、又は防火上有効なしゃへいを設けること。ただし、油温が著しく上昇するおそれのない燃料タンクにあっては、この限りでない。\nエ    燃料タンクは、その容量（タンクの内容積の90パーセントの量をいう。\n以下同じ。）に応じ、次の表に掲げる厚さの鋼板又はこれと同等以上の強度を有する金属板で気密に造ること。\nタンクの容量                    板厚5リットル以下                       0.6ミリメートル以上5リットルを超え20リットル以下              0.8ミリメートル以上20リットルを超え40リットル以下             1.0ミリメートル以上40リットルを超え100リットル以下            1.2ミリメートル以上100リットルを超え250リットル以下           1.6ミリメートル以上250リットルを超え500リットル以下           2.0ミリメートル以上500リットルを超え1,000リットル以下         2.3ミリメートル以上1,000リットルを超え2,000リットル以下       2.6ミリメートル以上2,000リットルを超えるもの               3.2ミリメートル以上\nオ    燃料タンクを屋内に設ける場合にあっては、不燃材料で造った床上に設けること。\nカ    燃料タンクの架台は、不燃材料で造ること。\nキ    燃料タンクの配管には、タンク直近の容易に操作できる位置に開閉弁を設けること。ただし、地下に埋設する燃料タンクにあっては、この限りでない。\nク    燃料タンク又は配管には、有効なろ過装置を設けること。ただし、ろ過装置が設けられた炉の燃料タンク又は配管にあっては、この限りでない。\nケ    燃料タンクには、見やすい位置に燃料の量を自動的に覚知することができる装置を設けること。この場合において、当該装置がガラス管で作られているときは、金属管等で安全に保護すること。\nコ    燃料タンクは、水抜きができる構造とすること。\nサ    燃料タンクには、通気管又は通気口を設けること。この場合において、当該燃料タンクを屋外に設けるときは、当該通気管又は通気口の先端から雨水が浸入しない構造とすること。\nシ     燃料タンクの外面には、さび止めのための措置を講ずること。ただし、アルミニウム合金、ステンレス鋼その他さびにくい材質で作られた燃料タンクにあっては、この限りでない。\nス     燃焼装置に過度の圧力がかかるおそれのある炉にあっては、異常燃焼を防止するための減圧装置を設けること。\nセ     燃料を予熱する方式の炉にあっては、燃料タンク又は配管を直火で予熱しない構造とするとともに、過度の予熱を防止する措置を講ずること。\n(18)   液体燃料又はプロパンガス、石炭ガスその他の気体燃料を使用する炉にあっては、多量の未燃ガスが滞留せず、かつ、点火及び燃焼の状態が確認できる構造とするとともに、その配管については、次によること。\nア     金属管を使用すること。ただし、燃焼装置、燃料タンク等に接続する部分で金属管を使用することが構造上又は使用上適当でない場合は、当該燃料に侵されない金属管以外の管を使用することができる。\nイ     接続は、ねじ接続、フランジ接続、溶接等とすること。ただし、金属管と金属管以外の管を接続する場合にあっては、さし込み接続とすることができる。\nウ     イのさし込み接続による場合は、その接続部分をホースバンド等で締めつけること。\n(18の2) 液体燃料又は気体燃料を使用する炉にあっては、必要に応じ次の安全装置を設けること。\nア     炎が立ち消えた場合等において安全を確保できる装置\nイ     未燃ガスが滞留するおそれのあるものにあっては、点火前及び消火後に自動的に未燃ガスを排出できる装置\nウ     炉内の温度が過度に上昇するおそれのあるものにあっては、温度が過度に上昇した場合において自動的に燃焼を停止できる装置\nエ    電気を使用して燃焼を制御する構造又は燃料の予熱を行う構造のものにあっては、停電時において自動的に燃焼を停止できる装置\n(18の3) 気体燃料を使用する炉の配管、計量器等の附属設備は、電線、電機開閉器その他の電気設備が設けられているパイプシャフト、ピットその他の漏れた燃料が滞留するおそれのある場所には設けないこと。ただし、電気設備に防爆工事等の安全措置を講じた場合においては、この限りでない。\n(19)   電気を熱源とする炉にあっては、次によること。\nア    電線、接続器具等は、耐熱性を有するものを使用するとともに、短絡を生じないように措置すること。\nイ    炉内の温度が過度に上昇するおそれのあるものにあっては、必要に応じ温度が過度に上昇した場合において自動的に熱源を停止できる装置を設けること。\n２   炉の管理は、次に掲げる基準によらなければならない。\n(1)    炉の周囲は、常に、整理及び清掃に努めるとともに、燃料その他の可燃物をみだりに放置しないこと。\n(2)    炉及びその附属設備は、必要な点検及び整備を行い、火災予防上有効に保持すること。\n(3)    液体燃料を使用する炉及び電気を熱源とする炉にあっては、前号の点検及び整備を必要な知識及び技能を有する者として消防長が指定するものに行わせること。\n(4)    本来の使用燃料以外の燃料を使用しないこと。\n(5)    燃料の性質等により異常燃焼を生ずるおそれのある炉にあっては、使用中監視人を置くこと。ただし、異常燃焼を防止するために必要な措置を講じたときは、この限りでない。\n(6)    燃料タンクは、燃料の性質等に応じ、しゃこうし又は転倒若しくは衝撃を防止するために必要な措置を講ずること。\n３   入力350キロワット以上の炉にあっては、不燃材料で造った壁、柱、床及び天井（天井のない場合にあっては、はり又は屋根）で区画され、かつ、窓及び出入口等に防火戸（建築基準法第２条第９号の２ロに規定する防火設備であるものに限る。以下同じ。）を設けた室内に設けること。ただし、炉の周囲に有効な空間を保有する等防火上支障のない措置を講じた場合においては、この限りでない。\n４   前３項に規定するもののほか、液体燃料を使用する炉の位置、構造及び管理の基準については、第30条及び第31条の２から第31条の５まで（第31条の４第２項第１号から第３号まで及び第８号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第３条の２", "h": "（ふろがま）", "t": "第３条の２ ふろがまの構造は、次に掲げる基準によらなければならない。\n(1)   かま内にすすが付着しにくく、かつ、目詰まりしにくい構造とすること。\n(2)   気体燃料又は液体燃料を使用するふろがまには、空だきをした場合に自動的に燃焼を停止できる装置を設けること。\n２   前項に規定するもののほか、ふろがまの位置、構造及び管理の基準については、前条（第１項第11号及び第12号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第３条の３", "h": "（温風暖房機）", "t": "第３条の３ 温風暖房機の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   加熱された空気に、火粉、煙、ガス等が混入しない構造とし、熱交換部分を耐熱性の金属材料等で造ること。\n(2)   温風暖房機に附属する風道にあっては、不燃材料以外で仕上げをした建築物等の部分及び可燃性の物品との間に次の表に掲げる式によって算定した数値（入力70キロワット以上のものに附属する風道にあっては、算定した数値が15以下の場合は、15とする。）以上の距離を保つこと。ただし、厚さ２センチメートル以上（入力70キロワット以上のものに附属する風道にあっては、10センチメートル以上）の金属以外の不燃材料で被覆する部分については、この限りでない。\n風道からの方向               距離（単位センチメートル）\n上方                L×0.70側方                L×0.55下方                L×0.45この表においてLは、風道の断面が円形の場合は、直径、矩形の場合は長辺の長さとする。\n２   前項に規定するもののほか、温風暖房機の位置、構造及び管理の基準については、第３条（第１項第11号及び第12号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第３条の４", "h": "（厨房設備）", "t": "第３条の４ 調理を目的として使用するレンジ、フライヤー、かまど等の設備（以下「厨房設備」という。）の位置、構造及び管理は、次に掲げる基準によらなければならない。\n(1)    厨房設備に附属する排気ダクト及び天蓋（以下「排気ダクト等」という。）\nは、次によること。\nア    排気ダクト等は、耐食性を有する鋼板又はこれと同等以上の耐食性及び強度を有する不燃材料で造ること。ただし、当該厨房設備の入力及び使用状況から判断して火災予防上支障がないと認められるものにあっては、この限りでない。\nイ    排気ダクト等の接続は、フランジ接続、溶接等とし、気密性のある接続とすること。\nウ    排気ダクト等は、建築物等の可燃性の部分及び可燃性の物品との間に10センチメートル以上の距離を保つこと。ただし、金属以外の不燃材料で有効に被覆する部分については、この限りでない。\nエ    排気ダクトは、十分に排気を行うことができるものとすること。\nオ    排気ダクトは、直接屋外に通ずるものとし、他の用途のダクト等と接続しないこと。\nカ    排気ダクトは、曲がり及び立ち上がりの箇所を極力少なくし、内面を滑らかに仕上げること。\n(2)   油脂を含む蒸気を発生させるおそれのある厨房設備の天蓋は、次によること。\nア    排気中に含まれる油脂等の付着成分を有効に除去することができるグリスフィルター、グリスエクストラクター等の装置（以下「グリス除去装置」という。）を設けること。ただし、排気ダクトを用いず天蓋から屋外へ直接排気を行う構造のものにあっては、この限りでない。\nイ    グリス除去装置は、耐食性を有する鋼板又はこれと同等以上の耐食性及び強度を有する不燃材料で造られたものとすること。ただし、当該厨房設備の入力及び使用状況から判断して火災予防上支障がないと認められるものにあっては、この限りでない。\nウ    排気ダクトへの火炎の伝送を防止する装置（以下「火炎伝送防止装置」という。）を設けること。ただし、排気ダクトを用いず天蓋から屋外へ直接排気を行う構造のもの又は排気ダクトの長さ若しくは当該厨房設備の入力及び使用状況から判断して火災予防上支障がないと認められるものにあっては、この限りでない。\nエ    次に掲げる厨房設備に設ける火炎伝送防止装置は、自動消火装置とすること。\n(ア) 令別表第１(1)項から(4)項まで、(5)項イ、(6)項、(9)項イ、(16)項イ、（16の２）項及び（16の３）項に掲げる防火対象物の地階に設ける厨房設備で当該厨房設備の入力と同一厨房室内に設ける他の厨房設備の入力の合計が350キロワット以上のもの(イ) （ア）に掲げるもののほか、高さ31メートルを超える建築物に設ける厨房設備で当該厨房設備の入力と同一厨房室内に設ける他の厨房設備の入力の合計が350キロワット以上のもの\n(3)   天蓋、グリス除去装置及び火炎伝送防止装置は、容易に清掃ができる構造とすること。\n(4)   天蓋及び天蓋と接続する排気ダクト内の油脂等の清掃を行い、火災予防上支障のないように維持管理すること。\n２   前項に規定するもののほか、厨房設備の位置、構造及び管理の基準については、第３条（第１項第11号から第14号までを除く。）の規定を準用する。この場合において第３条第３項の規定中「入力」とあるのは、「当該厨房設備の入力と同一厨房室内に設ける他の厨房設備の入力の合計が」と読み替えるものとする。"}, {"d": "kayojo", "a": "第４条", "h": "（ボイラー）", "t": "第４条 ボイラーの構造は、次に掲げる基準によらなければならない。\n(1)   蒸気管は、可燃性の壁、床、天井等を貫通する部分及びこれらに接触する部分を、けいそう土その他の遮熱材料で有効に被覆すること。\n(2)   蒸気の圧力が異常に上昇した場合に自動的に作動する安全弁その他の安全装置を設けること。\n２   前項に規定するもののほか、ボイラーの位置、構造及び管理の基準については、第３条（第１項第11号及び第12号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第５条", "h": "（ストーブ）", "t": "第５条 ストーブ（移動式のものを除く。以下この条において同じ。）のうち、固体燃料を使用するものにあっては、不燃材料で造ったたき殻受けを付設しなければならない。\n２   前項に規定するもののほか、ストーブの位置、構造及び管理の基準については、第３条（第１項第11号から第14号まで及び第17号ホを除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第６条", "h": "（壁付暖炉）", "t": "第６条 壁付暖炉の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   背面及び側面と壁等との間に10センチメートル以上の距離を保つこと。ただし、壁等が耐火構造であって、間柱、下地その他主要な部分を準不燃材料で造ったものの場合にあっては、この限りでない。\n(2)   厚さ20センチメートル以上の鉄筋コンクリート造、無筋コンクリート造、れんが造、石造又はコンクリートブロツク造りとし、かつ、背面の状況を点検することができる構造とすること。\n２   前項に規定するもののほか、壁付暖炉の位置、構造及び管理の基準については、第３条（第１項第１号、第７号及び第９号から第12号までを除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第７条", "h": "（乾燥設備）", "t": "第７条 乾燥設備の構造は、次に掲げる基準によらなければならない。\n(1)   乾燥物品が直接熱源と接触しない構造とすること。\n(2)   室内の温度が過度に上昇するおそれのある乾燥設備にあっては、非常警報装置又は熱源の自動停止装置を設けること。\n(3)   火粉が混入するおそれのある燃焼排気により直接可燃性の物品を乾燥するものにあっては、乾燥室内に火粉を飛散しない構造とすること。\n２   前項に規定するもののほか、乾燥設備の位置、構造及び管理の基準については、第３条（第１項第11号及び第12号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第７条の２", "h": "（簡易サウナ設備）", "t": "第７条の２ 簡易サウナ設備（屋外その他の直接外気に接する場所に設けるテント型サウナ室（サウナ室のうちテントを活用したものをいう。）又はバレル型サウナ室（サウナ室のうち円筒形であり、かつ、木製のものをいう。）に設ける放熱設備であって、定格出力６キロワット以下のものであり、かつ、薪又は電気を熱源とするものをいう。以下同じ。）の位置及び構造は、次に掲げる基準によらなければならない。\n(1) 火災予防上安全な距離を保つことを要しない場合を除き、建築物等及び可燃性の物品から火災予防上安全な距離として対象火気設備等及び対象火気器具等の離隔距離に関する基準により得られる距離以上の距離を保つこと。\n(2) 簡易サウナ設備の温度が異常に上昇した場合に直ちにその熱源を遮断することができる手動及び自動の装置を設けること。ただし、薪を熱源とする簡易サウナ設備であって、その周囲において火災が発生した際に速やかに使用できる位置に消火器を設置した場合は、この限りではない。\n２   前項に規定するもののほか、簡易サウナ設備の位置、構造及び管理の基準については、第３条（第１項第１号、第10号から第14号まで、第17号から第18号の３まで、第２項第６号及び第３項並びに第４項を除く。）及び第５条第１項の規定を準用する。"}, {"d": "kayojo", "a": "第７条の３", "h": "（一般サウナ設備）", "t": "第７条の３ サウナ室に設ける放熱設備（以下「サウナ設備」という。）の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   火災予防上安全な距離を保つことを要しない場合を除き、建築物等及び可燃性の物品から火災予防上安全な距離として対象火気設備等及び対象火気器具等の離隔距離に関する基準により得られる距離以上の距離を保つこと。\n(2)   サウナ設備の温度が異常に上昇した場合に直ちにその熱源を遮断することができる手動及び自動の装置を設けること。\n２   前項に規定するもののほか、サウナ設備の位置、構造及び管理の基準については、第３条（第１項第１号及び第10号から第12号までを除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第８条", "h": "（簡易湯沸設備）", "t": "第８条 簡易湯沸設備の位置、構造及び管理の基準については、第３条（第１項第６号及び第10号から第15号まで、第２項第５号並びに第３項を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第８条の２", "h": "（給湯湯沸設備）", "t": "第８条の２ 給湯湯沸設備の位置、構造及び管理の基準については、第３条（第１項第11号から第14号までを除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第８条の３", "h": "（燃料電池発電設備）", "t": "第８条の３ 屋内に設ける燃料電池発電設備（固体高分子型燃料電池、リン酸型燃料電池、溶融炭酸塩型燃料電池又は固体酸化物型燃料電池による発電設備であって火を使用するものに限る。第３項及び第５項、第17条の２並びに第44条第11号において同じ。）の位置、構造及び管理の基準については、第３条第１項第１号（アを除く。）、第２号、第４号、第５号、第７号、第９号、第17号（ウ、ス及びセを除く。）、第18号及び第18号の３並びに第２項第１号、第11条第１項（第７号を除く。）並びに第12条第１項（第２号を除く。）の規定を準用する。\n２   前項の規定にかかわらず、屋内に設ける燃料電池発電設備（固体高分子型燃料電池又は固体酸化物型燃料電池による発電設備であって火を使用するものに限る。以下この項及び第４項において同じ。）であって出力10キロワット未満のもののうち、改質器の温度が過度に上昇した場合若しくは過度に低下した場合又は外箱の換気装置に異常が生じた場合に自動的に燃料電池発電設備を停止できる装置を設けたものの位置、構造及び管理の基準については、第３条第１項第１号（アを除く。）、第２号、第４号、第５号、第７号、第９号、第17号（ウ、ス及びセを除く。）、第18号及び第18号の３並びに第２項第１号及び第４号、第11条第１項第１号、第２号、第４号、第８号及び第10号並びに第12条第１項第３号及び第４号の規定を準用する。\n３   屋外に設ける燃料電池発電設備の位置、構造及び管理の基準については、第３条第１項第１号（アを除く。）、第２号、第４号、第５号、第７号、第９号、第10号、第17号（ウ、ス及びセを除く。）、第18号及び第18号の３並びに第２項第１号並びに第11条第１項第３号の２及び第５号から第10号まで（第７号を除く。）並びに第２項並びに第12条第１項第１号、第３号及び第４号の規定を準用する。\n４   前項の規定にかかわらず、屋外に設ける燃料電池発電設備であって出力10キロワット未満のもののうち、改質器の温度が過度に上昇した場合若しくは過度に低下した場合又は外箱の換気装置に異常が生じた場合に自動的に燃料電池発電設備を停止できる装置を設けたものの位置、構造及び管理の基準については、"}, {"d": "kayojo", "a": "第３条", "h": "", "t": "第３条 第１項第１号（アを除く。）、第２号、第４号、第５号、第７号、第９号、第10号、第17号（ウ、ス及びセを除く。）、第18号及び第18号の３並びに第２項第１号及び第４号、第11条第１項第８号及び第10号並びに第12条第１項第３号及び第４号の規定を準用する。\n５   前各項に規定するもののほか、燃料電池発電設備の構造の基準については、発電用火力設備に関する技術基準を定める省令（平成９年通商産業省令第51号）"}, {"d": "kayojo", "a": "第30条", "h": "", "t": "第30条 及び第34条の規定並びに電気設備に関する技術基準を定める省令（平成９年通商産業省令第52号）第44条の規定の例による。"}, {"d": "kayojo", "a": "第９条", "h": "（掘ごたつ及びいろり）", "t": "第９条 掘ごたつの火床又はいろりの内面は、不燃材料で作り、又は被覆しなければならない。\n２   掘ごたつ及びいろりの管理の基準については、第３条第２項第１号及び第４号の規定を準用する。"}, {"d": "kayojo", "a": "第９条の２", "h": "（ヒートポンプ冷暖房機）", "t": "第９条の２ ヒートポンプ冷暖房機の内燃機関の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   容易に点検することができる位置に設けること。\n(2)   防振のための措置を講ずること。\n(3)   排気筒を設ける場合は、防火上有効な構造とすること。\n２   前項に規定するもののほか、ヒートポンプ冷暖房機の内燃機関の位置、構造及び管理の基準については、第３条（第１項第10号から第15号まで、第18号、第18号の２及び第19号、第２項第５号並びに第３項を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第10条", "h": "（火花を生ずる設備）", "t": "第10条 グラビヤ印刷機、ゴムスプレッダー、起毛機、反毛機その他その操作に際し、火花を生じ、かつ、可燃性の蒸気又は微粉を放出する設備（以下「火花を生ずる設備」という。）の位置、構造及び管理は、次に掲げる基準によらなければならない。\n(1)   壁、天井（天井のない場合においては、屋根）及び床の火花を生ずる設備に面する部分の仕上げを準不燃材料でした室内に設けること。\n(2)   静電気による火花を生ずるおそれのある部分に、静電気を有効に除去する措置を講ずること。\n(3)   可燃性の蒸気又は微粉を有効に除去する換気装置を設けること。\n(4)   火花を生ずる設備のある室内においては、常に、整理及び清掃に努めるとともに、みだりに火気を使用しないこと。"}, {"d": "kayojo", "a": "第10条の２", "h": "（放電加工機）", "t": "第10条の２ 放電加工機（加工液として法第２条第７項に規定する危険物を用いるものに限る。以下同じ。）の構造は、次に掲げる基準によらなければならない。\n(1)   加工槽内の放電加工部分以外における加工液の温度が、設定された温度を超えた場合において、自動的に加工を停止できる装置を設けること。\n(2)   加工液の液面の高さが、放電加工部分から液面までの間に必要最小限の間隔を保つために設定された液面の高さより低下した場合において、自動的に加工を停止できる装置を設けること。\n(3)   工具電極と加工対象物との間の炭化生成物の発生成長等による異常を検出した場合において、自動的に加工を停止できる装置を設けること。\n(4)   加工液に着火した場合において、自動的に消火できる装置を設けること。\n２   放電加工機の管理は、次に掲げる基準によらなければならない。\n(1)   引火点70度未満の加工液を使用しないこと。\n(2)   吹きかけ加工その他火災の発生のおそれのある方法による加工を行わないこと。\n(3)   工具電極を確実に取り付け、異常な放電を防止すること。\n(4)   必要な点検及び整備を行い、火災予防上有効に保持すること。\n３   前２項に規定するもののほか、放電加工機の位置、構造及び管理の基準については、前条（第２号を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第11条", "h": "（変電設備）", "t": "第11条 屋内に設ける変電設備（全出力20キロワット以下のもの及び次条に掲げるものを除く。以下同じ。）の位置、構造及び管理は、次に掲げる基準によらなければならない。\n(1)   水が浸入し、又は浸透するおそれのない位置に設けること。\n(2)   可燃性又は腐食性の蒸気又はガスが発生し、又は滞留するおそれのない位置に設けること。\n(3)   変電設備（消防長（消防署長）が火災予防上支障がないと認める構造を有するキュービクル式のものを除く。）は、不燃材料で造った壁、柱、床及び天井（天井のない場合にあっては、はり又は屋根。以下同じ。）で区画され、かつ窓及び出入口に防火戸を設ける室内に設けること。ただし、変電設備の周囲に有効な空間を保有する等防火上支障のない措置を講じた場合においては、この限りでない。\n(3の2) 建築物等の部分との間に換気、点検及び整備に支障のない距離を保つこと。\n(3の3) 第３号の壁等をダクト、ケーブル等が貫通する部分には、すき間を不燃材料で埋める等火災予防上有効な措置を講ずること。\n(4)    屋外に通ずる有効な換気設備を設けること。\n(5)    見やすい箇所に変電設備である旨を表示した標識を設けること。\n(6)    変電設備のある室内には、係員以外の者をみだりに出入させないこと。\n(7)    変電設備のある室内は、常に、整理及び清掃に努めるとともに、油ぼろその他の可燃物をみだりに放置しないこと。\n(8)    定格電流の範囲内で使用すること。\n(9)    必要な知識及び技能を有する者として消防長が指定するものに必要に応じ設備の各部分の点検及び絶縁抵抗等の測定試験を行わせ、不良箇所を発見したときは、直ちに補修させるとともに、その結果を記録し、かつ、保存すること。\n(10)   変圧器、コンデンサーその他の機器及び配線は、堅固に床、壁、支柱等に固定すること。\n２   屋外に設ける変電設備（柱上及び道路上に設ける電気事業者用のもの並びに消防長（消防署長）が火災予防上支障がないと認める構造を有するキュービクル式のものを除く。）にあっては、建築物から３メートル以上の距離を保たなければならない。ただし、不燃材料で作り、又はおおわれた外壁で開口部のないものに面するときは、この限りでない。\n３   前項に規定するもののほか、屋外に設ける変電設備（柱上及び道路上に設ける電気事業者用のものを除く。）の位置、構造及び管理の基準については、第１項第３号の２及び第５号から第10号までの規定を準用する。"}, {"d": "kayojo", "a": "第11条の２", "h": "（急速充電設備）", "t": "第11条の２ 急速充電設備（電気を設備内部で変圧して、電気自動車等（電気を動力源とする自動車、原動機付自転車、船舶、航空機その他これらに類するものをいう。以下同じ。）にコネクター（充電用ケーブルを電気自動車等に接続するためのものをいう。以下同じ。）を用いて充電する設備（全出力20キロワット以下のものを除く。）をいい、分離型のもの（変圧する機能を有する設備本体及び充電ポスト（コネクター及び充電用ケーブルを収納する設備で、変圧する機能を有しないものをいう。以下同じ。）により構成されるものをいう。\n以下同じ。）にあっては、充電ポストを含む。以下同じ。）の位置、構造及び管理は、次に掲げる基準によらなければならない。\n(1)   急速充電設備（全出力50キロワット以下のもの及び消防長（消防署長）が認める延焼を防止するための措置が講じられているものを除く。）を屋外に設ける場合にあっては、建築物から３メートル以上の距離を保つこと。ただし、次に掲げるものにあっては、この限りでない。\nア    不燃材料で造り、又は覆われた外壁で開口部のないものに面するもの\nイ    分離型のものにあっては、充電ポスト\n(2)   その筐体は不燃性の金属材料で造ること。ただし、分離型のものの充電ポストにあっては、この限りでない。\n(3)   堅固に床、壁、支柱等に固定すること。\n(4)   その筐体は雨水等の浸入防止の措置を講ずること。\n(5)   充電を開始する前に、急速充電設備と電気自動車等との間で自動的に絶縁状況の確認を行い、絶縁されていない場合には、充電を開始しない措置を講ずること。\n(6)   コネクターと電気自動車等が確実に接続されていない場合には、充電を開始しない措置を講ずること。\n(7)   コネクターが電気自動車等に接続され、電圧が印加されている場合には、当該コネクターが当該電気自動車等から外れないようにする措置を講ずること。\n(8)   漏電、地絡及び制御機能の異常を自動的に検知する構造とし、漏電、地絡又は制御機能の異常を検知した場合には、急速充電設備を自動的に停止させる措置を講ずること。\n(9)    電圧及び電流を自動的に監視する構造とし、電圧又は電流の異常を検知した場合には、急速充電設備を自動的に停止させる措置を講ずること。\n(10)   異常な高温とならないこと。また、異常な高温となった場合には、急速充電設備を自動的に停止させる措置を講ずること。\n(11)   急速充電設備を手動で緊急に停止することができる装置を、当該急速充電設備の利用者が異常を認めたときに、速やかに操作することができる箇所に設けること。\n(12)   急速充電設備と電気自動車等の衝突を防止する措置を講ずること。\n(13)   コネクターについて、操作に伴う不時の落下を防止する措置を講ずること。ただし、コネクターに十分な強度を有するものにあっては、この限りでない。\n(14)   充電用ケーブルを冷却するため液体を用いるものにあっては、当該液体が漏れた場合に、漏れた液体が内部基盤等の機器に影響を与えない構造とすること。また、充電用ケーブルを冷却するために用いる液体の流量及び温度の異常を自動的に検知する構造とし、当該液体の流量又は温度の異常を検知した場合には、急速充電設備を自動的に停止させる措置を講ずること。\n(15)   複数の充電用ケーブルを有し、複数の電気自動車等に同時に充電する機能を有するものにあっては、出力の切替えに係る開閉器の異常を自動的に検知する構造とし、当該開閉器の異常を検知した場合には、急速充電設備を自動的に停止させる措置を講ずること。\n(16)   急速充電設備のうち蓄電池を内蔵しているものにあっては、当該蓄電池（主として保安のために設けるものを除く。）について次に掲げる措置を講ずること。\nア     電圧及び電流を自動的に監視する構造とし、電圧又は電流の異常を検知した場合には、急速充電設備を自動的に停止させること。\nイ    異常な高温とならないこと。\nウ    温度の異常を自動的に検知する構造とし、異常な高温又は低温を検知した場合には、急速充電設備を自動的に停止させること。\nエ    制御機能の異常を自動的に検知する構造とし、制御機能の異常を検知した場合には、急速充電設備を自動的に停止させること。\n(17)   急速充電設備のうち分離型のものにあっては、充電ポストに蓄電池（主として保安のために設けるものを除く。）を内蔵しないこと。\n(18)   急速充電設備の周囲は、換気、点検及び整備に支障のないようにすること。\n(19)   急速充電設備の周囲は、常に、整理及び清掃に努めるとともに、油ぼろその他の可燃物をみだりに放置しないこと。\n２   前項に規定するもののほか、急速充電設備の位置、構造及び管理の基準については、前条第１項第２号、第５号、第８号及び第９号の規定を準用する。"}, {"d": "kayojo", "a": "第12条", "h": "（内燃機関を原動力とする発電設備）", "t": "第12条 屋内に設ける内燃機関を原動力とする発電設備の位置及び構造は、次に掲げる基準によらなければならない。\n(1)    容易に点検することができる位置に設けること。\n(2)    防振のための措置を講じた床上又は台上に設けること。\n(3)    排気筒は、防火上有効な構造とすること。\n(4)    発電機、燃料タンクその他の機器は、堅固に床、壁、支柱等に固定すること。\n２   前項に規定するもののほか、屋内に設ける内燃機関を原動力とする発電設備の位置、構造及び管理の基準については、第３条第１項第17号及び第18号の３並びに第11条第１項の規定を準用する。この場合において、第３条第１項第17号ウ中「たき口」とあるのは、「内燃機関」と読み替えるものとする。\n３   屋外に設ける内燃機関を原動力とする発電設備の位置、構造及び管理の基準については、第３条第１項第17号及び第18号の３、第11条第１項第３号の２及び第５号から第10号まで並びに第２項並びに本条第１項の規定を準用する。この場合において、第３条第１項第17号ウ中「たき口」とあるのは、「内燃機関」と読み替えるものとする。\n４   前項の規定にかかわらず、屋外に設ける気体燃料をしようとするピストン式内燃機関を原動力とする発電設備であって出力10キロワット未満のもののうち、次の各号に掲げる基準に適合する鋼板（板圧が0.8ミリメートル以上のものに限る。）製の外箱に収納されているものの位置、構造及び管理の基準については、"}, {"d": "kayojo", "a": "第３条", "h": "", "t": "第３条 第１項第１号（アを除く。）及び第18号の３、第11条第１項第７号、第８号及び第10号並びに本条第１項第２号から第４号までの規定を準用する。\n(1)   断熱材又は防音材を使用する場合は、難燃性のものを使用すること。\n(2)   換気口は、外箱の内部の温度が過度に上昇しないように有効な換気を行うことができるものとし、かつ、雨水等の侵入防止の措置が講じられているものであること。\n５   前各項に規定するもののほか、内燃機関を原動力とする発電設備の構造の基準については、発電用火力設備に関する技術基準を定める省令第27条の規定の例による。"}, {"d": "kayojo", "a": "第13条", "h": "（蓄電池設備）", "t": "第13条 蓄電池設備（蓄電池容量が10キロワット時以下のもの及び蓄電池容量が10キロワット時を超え20キロワット時以下のものであって蓄電池設備の出火防止措置及び延焼防止措置に関する基準（令和５年消防庁告示第７号）第２に定めるものを除く。以下同じ。）は、地震等により容易に転倒し、亀裂し、又は破損しない構造とすること。この場合において、開放形鉛蓄電池を用いたものにあっては、その電槽は、耐酸性の床上又は台上に設けなければならない。\n２   前項に規定するもののほか、屋内に設ける蓄電池設備の位置、構造及び管理の基準については、第10条第４号並びに第11条第１項第１号、第３号から第６号まで及び第９号の規定を準用する。\n３   第１項に規定するもののほか、屋外に設ける蓄電池設備（柱上及び道路上に設ける電気事業者用のもの、蓄電池設備の出火防止措置及び延焼防止措置に関する基準第３に定めるもの並びに消防長（消防署長）が火災予防上支障がないと認める構造を有するキュービクル式のものを除く。）にあっては、建築物から３メートル以上の距離を保たなければならない。ただし、不燃材料で造り、又は覆われた外壁で開口部のないものに面するときは、この限りでない。\n４   前項に規定するもののほか、屋外に設ける蓄電池設備の位置、構造及び管理の基準については、第10条第４号、第11条第１項第３号の２、第５号、第６号及び第９号並びに第11条の２第１項第４号の規定を準用する。"}, {"d": "kayojo", "a": "第14条", "h": "（ネオン管灯設備）", "t": "第14条 ネオン管灯設備の位置及び構造は、次に掲げる基準によらなければならない。\n(1)   点滅装置は、低圧側の容易に点検できる位置に設けるとともに、不燃材料で造った覆いを設けること。ただし、無接点継電器を使用するものにあっては、この限りでない。\n(2)   変圧器を雨のかかる場所に設ける場合にあっては、屋外用のものを選び、導線引き出し部が下向きとなるように設けること。ただし、雨水の浸透を防止するために有効な措置を講じたときは、この限りでない。\n(3)   支枠その他ネオン管灯に近接する取付け材には、木材（難燃合板を除く。）\n又は合成樹脂（不燃性及び難燃性のものを除く。）を用いないこと。\n(4)   壁等を貫通する部分のがい管は壁等に固定すること。\n(5)   電源の開閉器は、容易に操作しやすい位置に設けること。\n２   ネオン管灯設備の管理の基準については、第11条第１項第９号の規定を準用する。"}, {"d": "kayojo", "a": "第15条", "h": "（舞台装置等の電気設備）", "t": "第15条 舞台装置若しくは展示装飾のために使用する電気設備又は工事、農業等のために一時的に使用する電気設備（以下「舞台装置等の電気設備」という。）\nの位置及び構造は、次に掲げる基準によらなければならない。\n(1)    舞台装置又は展示装飾のために使用する電気設備は、次によること。\nア    電灯は、可燃物を過熱するおそれのない位置に設けること。\nイ    電灯の充電部分は、露出させないこと。\nウ    電灯又は配線は、著しく動揺し、又は脱落しないように取り付けること。\nエ    アークを発生する設備は、不燃材料で造ること。\nオ    １の電線を２以上の分岐回路に使用しないこと。\n(2)    工事、農事等のために一時的に使用する電気設備は、次によること。\nア    分電盤、電動機等は、雨雪、土砂等により障害を受けるおそれのない位置に設けること。\nイ    残置灯設備の電路には、専用の開閉器を設け、かつ、ヒューズを設ける等自動しゃ断の措置を講ずること。\n２   舞台装置等の電気設備の管理の基準については、第11条第１項第７号から第10号までの規定を準用する。"}, {"d": "kayojo", "a": "第16条", "h": "（避雷設備）", "t": "第16条 避雷設備の位置及び構造は、消防長が指定する日本産業規格（産業標準化法（昭和24年法律第185号）第20条第１項の日本産業規格をいう。以下同じ。）\nに適合するものとしなければならない。\n２   避雷設備の管理については、第11条第１項第９号の規定を準用する。"}, {"d": "kayojo", "a": "第17条", "h": "（水素ガスを充てんする気球）", "t": "第17条 水素ガスを充てんする気球の位置、構造及び管理は、次に掲げる基準によらなければならない。\n(1)    煙突その他火気を使用する施設の付近において掲揚し、又はけい留しないこと。\n(2)   建築物の屋上で掲揚しないこと。ただし、屋根が不燃材料で造った陸屋根で、その最少幅員が気球の直径の２倍以上である場合においては、この限りでない。\n(3)   掲揚に際しては、掲揚綱と周囲の建築物又は工作物との間に水平距離10メートル以上の空間を保有するとともに、掲揚綱の固定箇所にさく等を設け、かつ、立入を禁止する旨を標示すること。ただし、前号ただし書の規定により建築物の屋上で掲揚する場合においては、この限りでない。\n(4)   気球の容積は、15立方メートル以下とすること。ただし、観測又は実験のために使用する気球については、この限りでない。\n(5)   風圧又は摩擦に対し十分な強度を有する材料で造ること。\n(6)   気球に付設する電飾は、気球から３メートル以上離れた位置に取り付け、かつ、充電部分が露出しない構造とすること。ただし、過熱又は火花が生じないように必要な措置を講じたときは、気球から１メートル以上離れた位置に取り付けることができる。\n(7)   前号の電飾に使用する電線は、断面積が0.75平方ミリメートル以上（文字網の部分に使用するものにあっては、0.5平方ミリメートル以上）のものを用い、長さ１メートル以下（文字網の部分に使用するものにあっては、0.6メートル以下）ごと及び分岐点の付近において支持すること。\n(8)   気球の地表面に対する傾斜角度が45度以下となるような強風時においては、掲揚しないこと。\n(9)   水素ガスの充てん又は放出については、次によること。\nア   屋外の通風のよい場所で行うこと。\nイ   操作者以外の者が近接しないように適当な措置を講ずること。\nウ   電飾を付設するものにあっては、電源をしゃ断して行うこと。\nエ   摩擦又は衝撃を加える等粗暴な行為をしないこと。\nオ   水素ガスの充てんに際しては、気球内に水素ガス又は空気が残存していないことを確かめた後減圧器を使用して行うこと。\n(10)   水素ガスが90容量パーセント以下となった場合においては、詰替えを行うこと。\n(11)   掲揚中又はけい留中においては、看視人を置くこと。ただし、建築物の屋上その他公衆の立入るおそれのない場所で掲揚し、又はけい留する場合にあっては、この限りでない。\n(12)   多数の者が集合している場所において運搬その他の取扱いを行わないこと。"}, {"d": "kayojo", "a": "第17条の２", "h": "（火を使用する設備に附属する煙突）", "t": "第17条の２ 火を使用する（燃料電池発電設備を除く。）設備に附属する煙突は、次に掲げる基準によらなければならない。\n(1)    構造又は材質に応じ、支わく、支線、腕金具等で固定すること。\n(2)    可燃性の壁、床、天井等を貫通する部分、小屋裏、天井裏、床裏等において接続する場合は、容易に離脱せず、かつ、燃焼排気が漏れない構造とすること。\n(3)    容易に清掃ができる構造とすること。\n(4)    火粉を飛散するおそれのある設備に附属するものにあっては、火粉の飛散を防止するための有効な装置を設けること。\n(5)    前各号に規定するもののほか、煙突の基準については、建築基準法施行令"}, {"d": "kayojo", "a": "第115条", "h": "", "t": "第115条 第１項第１号から第３号まで及び第２項の規定を準用する。"}, {"d": "kayojo", "a": "第17条の３", "h": "（基準の特例）", "t": "第17条の３ この節の規定は、この節に掲げる設備について、消防長（消防署長）\nが、当該設備の位置、構造及び管理並びに周囲の状況から判断して、この節の規定による基準によらなくとも、火災予防上支障がないと認めるとき又は予想しない特殊の設備を用いることにより、この節の規定による基準による場合と同等以上の効力があると認めるときにおいては、適用しない。\n第２節 火を使用する器具及びその使用に際し、火災の発生のおそれのある器具の取扱いの基準"}, {"d": "kayojo", "a": "第18条", "h": "（液体燃料を使用する器具）", "t": "第18条 液体燃料を使用する器具の取扱いは、次に掲げる基準によらなければならない。\n(1)    火災予防上安全な距離を保つことを要しない場合を除き、建築物等及び可燃性の物品から次の各号に掲げる距離のうち、火災予防上安全な距離として消防長（消防署長）が必要と認める距離以上の距離を保つこと。\nア        別表第３の左欄に掲げる種類等に応じ、それぞれ同表の右欄に掲げる距離\nイ        対象火気設備等及び対象火気器具等の離隔距離に関する基準により得られる距離\n(2)    可燃性のガス又は蒸気が滞留するおそれのない場所で使用すること。\n(3)    地震等により容易に可燃物が落下するおそれのない場所で使用すること。\n(4)    地震等により容易に転倒又は落下するおそれのないような状態で使用すること。\n(5)    不燃性の床上又は台上で使用すること。\n(6)    故障し、又は破損したものを使用しないこと。\n(7)    本来の使用目的以外に使用する等不適当な使用をしないこと。\n(8)    本来の使用燃料以外の燃料を使用しないこと。\n(9)    器具の周囲は、常に、整理及び清掃に努めるとともに、燃料その他の可燃物をみだりに放置しないこと。\n(9の2) 祭礼、縁日、花火大会、展示会その他の多数の者の集合する催しに際して使用する場合にあっては、消火器の準備をした上で使用すること。\n(10)   燃料もれがないことを確認してから点火すること。\n(11)   使用中は、器具を移動させ、又は燃料を補給しないこと。\n(12)   もれ、又はあふれた燃料を受けるためのさらを設けること。\n(13)   必要な知識及び技能を有するものとして消防長が指定するものに必要な点検及び整備を行わせ、火災予防上有効に保持すること。\n２   液体燃料を使用する移動式ストーブにあっては、前項に規定するもののほか、地震等により自動的に消火する装置又は自動的に燃料の供給を停止する装置を設けたものを使用しなければならない。"}, {"d": "kayojo", "a": "第19条", "h": "（固体燃料を使用する器具）", "t": "第19条 固体燃料を使用する器具の取扱いは、次に掲げる基準によらなければならない。\n(1)    火ばちにあっては、底部に、しゃ熱のための空間を設け、又は砂等を入れて使用すること。\n(2)    置ごたつにあっては、火入容器を金属以外の不燃材料で造った台上に置いて使用すること。\n２   前項に規定するもののほか、固体燃料を使用する器具の取扱いの基準については、前条第１項第１号から第９号の２までの規定を準用する。"}, {"d": "kayojo", "a": "第20条", "h": "（気体燃料を使用する器具）", "t": "第20条 気体燃料を使用する器具に接続する金属管以外の管は、その器具に応じた適当な長さとしなければならない。\n２   前項に規定するもののほか、気体燃料を使用する器具の取扱いの基準については、第18条第１項第１号から第10号までの規定を準用する。"}, {"d": "kayojo", "a": "第21条", "h": "（電気を熱源とする器具）", "t": "第21条 電気を熱源とする器具の取扱いは、次に掲げる基準によらなければならない。\n(1)    通電した状態でみだりに放置しないこと。\n(2)    安全装置は、みだりに取りはずし、又はその器具に不適合なものと取り替えないこと。\n２   前項に規定するもののほか、電気を熱源とする器具の取扱いの基準については、第18条第１項第１号から第７号まで、第９号及び第９号の２の規定（器具の表面に可燃物が触れた場合に当該可燃物が発火するおそれのない器具にあっては、同項第２号及び第５号から第７号までの規定に限る。）を準用する。"}, {"d": "kayojo", "a": "第22条", "h": "（使用に際し火災の発生のおそれのある器具）", "t": "第22条 火消つぼその他使用に際し火災の発生のおそれのある器具の取扱いの基準については、第18条第１項第１号から第７号まで、第９号及び第９号の２の規定を準用する。"}, {"d": "kayojo", "a": "第22条の２", "h": "（基準の特例）", "t": "第22条の２ この節の規定は、この節に掲げる器具について、消防長（消防署長）\nが、当該器具の取扱い及び周囲の状況から判断して、この節の規定による基準によらなくとも、火災予防上支障がないと認めたとき又は予想しない特殊の器具を用いることにより、この節の規定による基準による場合と同等以上の効力があると認めたときにおいては、適用しない。\n第３節 火の使用に関する制限等"}, {"d": "kayojo", "a": "第23条", "h": "（喫煙等）", "t": "第23条 次に掲げる場所で、消防長（消防署長）が指定する場所においては、喫煙し、若しくは裸火を使用し、又は当該場所に火災予防上危険な物品を持ち込んではならない。ただし、特に必要な場合において消防長（消防署長）が火災予防上支障がないと認めたときは、この限りでない。\n(1)   劇場、映画館、演芸場、観覧場、公会堂若しくは集会場（以下「劇場等」という。）の舞台又は客席\n(2)   百貨店、マーケツトその他の物品販売業を営む店舗又は展示場（以下「百貨店等」という。）の売場又は展示部分\n(3)   文化財保護法（昭和25年法律第214号）の規定によって重要文化財、重要有形民俗文化財、史跡若しくは重要な文化財として指定され、又は旧重要美術品等の保存に関する法律（昭和８年法律第43号）の規定によって重要美術品として認定された建造物の内部又は周囲\n(4)   第１号及び第２号に掲げるもののほか、火災が発生した場合に人命に危険を生ずるおそれのある場所\n２   前項の消防長（消防署長）が指定する場所には、客席の前面その他の見やすい箇所に「禁煙」、「火気厳禁」又は「危険物持込み厳禁」と表示した標識を設けなければならない。この場合において、標識の色は、地を赤色、文字を白色とするものとする。\n３   第１項の消防長（消防署長）が指定する場所（同項第３号に掲げる場所を除く。）を有する防火対象物の関係者は、次の各号に掲げる場合の区分に応じ、それぞれ次の各号に定める措置を講じなければならない。\n(1)   当該防火対象物内において全面的喫煙が禁止されている場合   当該防火対象物内において全面的に喫煙が禁止されている旨の標識の設置その他の当該防火対象物内における全面的な喫煙の禁止を確保するために消防長（消防署長）が火災予防上必要と認める措置\n(2)   前号に掲げる場合以外の場合 適当な数の吸殻容器を設けた喫煙所の設置及び当該喫煙所における「喫煙所」と表示した標識の設置（健康増進法（平成14年法律第103号）第33条第２項に規定する喫煙専用室標識を設ける場合においてはこの限りでない。）\n４   第２項又は前項第２号に規定する標識と併せて図記号による標識を設けるときは、「禁煙」又は「火気厳禁」と表示した標識と併せて設ける図記号にあっては、国際標準化機構が定めた規格第7010号又は日本産業規格Z8210に適合するものとし、「喫煙所」と表示した標識と併せて設ける図記号にあっては、国際標準化機構が定めた規格第7001号又は日本産業規格Z8210に適合するものとしなければならない。\n５   第３項第２号に掲げる場合において、劇場等の喫煙所は、階ごとに客席及び廊下（通行の用に供しない部分を除く。）以外の場所に設けなければならない。\nただし、劇場等の一部の階において全面的に喫煙が禁止されている旨の標識の設置その他の当該階における全面的な喫煙の禁止を確保するために消防長（消防署長）が火災予防上必要と認める措置を講じた場合は、当該階において喫煙所を設けないことができる。\n６   前項の喫煙所の床面積の合計は、客席の床面積の合計の30分の１以上としなければならない。ただし、消防長（消防署長）が、当該場所の利用状況等から判断して、火災予防上支障がないと認めるときは、この限りでない。\n７   第１項の消防長（消防署長）の指定する場所の関係者は、当該場所で喫煙し、若しくは裸火を使用し、又は当該場所に火災予防上危険な物品を持ち込もうとしている者があるときは、これを制止しなければならない。"}, {"d": "kayojo", "a": "第24条", "h": "（空地及び空家の管理）", "t": "第24条 空地の所有者、管理者又は占有者は、当該空地の枯草等の燃焼のおそれのある物件の除去その他火災予防上必要な措置を講じなければならない。\n２   空家の所有者又は管理者は、当該空家への侵入の防止、周囲の燃焼のおそれのある物件の除去その他火災予防上必要な措置を講じなければならない。"}, {"d": "kayojo", "a": "第25条", "h": "（たき火）", "t": "第25条 可燃性の物品その他の可燃物の近くにおいては、たき火をしてはならない。\n２   たき火をする場合においては、消火準備その他火災予防上必要な措置を講じなければならない。"}, {"d": "kayojo", "a": "第26条", "h": "（がん具用煙火）", "t": "第26条 がん具用煙火は、火災予防上支障のある場所で消費してはならない。\n２   がん具用煙火を貯蔵し、又は取り扱う場合においては、炎、火花又は高温体との接近を避けなければならない。\n３   火薬類取締法施行規則（昭和25年通商産業省令第88号）第91条第２号で定める数量の５分の１以上同号で定める数量以下のがん具用煙火を貯蔵し、又は取り扱う場合においては、ふたのある不燃性の容器に入れるか、又は防炎処理を施したおおいをしなければならない。"}, {"d": "kayojo", "a": "第27条", "h": "（化学実験室等）", "t": "第27条 化学実験室、薬局等において危険物、その他これらに類する物品を貯蔵し、又は取り扱う場合においては、第30条、第31条の２第１項第２号から第16号まで及び第２項第１号並びに第31条の４第１項の規定に準じて貯蔵し、又は取り扱うほか、火災予防上必要な措置を講じなければならない。"}, {"d": "kayojo", "a": "第28条", "h": "（作業中の防火管理）", "t": "第28条 ガス若しくは電気による溶接作業、自動車の解体等の溶断作業、グラインダー等による火花を発する作業、トーチランプ等による加熱作業、アスフアルト等の溶解作業又は鋲打作業（以下「溶接作業等」という。）は、可燃性の物品の附近においてこれをしてはならない。\n２   自動車の解体作業においては、溶断作業を行う前に燃料等の可燃性物品の除去及び消火用具の準備を行い、かつ、除去した燃料等の適切な管理を行わなければならない。\n３   溶接作業等を行う場合は、火花の飛散、接炎等による火災の発生を防止するため、湿砂の散布、散水、不燃材料によるしゃ熱又は可燃性物品の除去及び作業後の点検その他火災予防上必要な措置を講じなければならない。\n４   令別表第１に掲げる防火対象物（同表(18)項から(20)項までに掲げるものを除く。以下第40条及び第41条において同じ。）及びこれらの防火対象物の用途に供するため工事中の建築物その他の工作物において、可燃性の蒸気若しくはガスを著しく発生する物品を使用する作業又は爆発性若しくは可燃性の粉じんを著しく発生する作業を行う場合は、換気又は除じん、火気の制限、消火用具の準備、作業後の点検その他火災予防上必要な措置を講じなければならない。\n５   作業現場においては、火災予防上安全な場所に吸殻容器を設け、当該場所以外の場所では喫煙してはならない。\n第４節 火災に関する警報の発令中における火の使用の制限"}, {"d": "kayojo", "a": "第29条", "h": "（火災に関する警報の発令中における火の使用の制限）", "t": "第29条 火災に関する警報（法第22条第３項に規定する火災に関する警報をいう。\n以下同じ。）が発せられた場合における火の使用については、次の各号に定めるところによらなければならない。\n(1)   山林、原野等において火入れをしないこと。\n(2)   煙火を消費しないこと。\n(3)   屋外において火遊び又はたき火をしないこと。\n(4)   屋外においては、引火性又は爆発性の物品その他の附近で喫煙をしないこと。\n(5)   山林、原野等の場所で、火災が発生するおそれが大であると認めて管理者が指定した区域内において喫煙をしないこと。\n(6)   残火（たばこの吸殻を含む。）、取灰又は火粉を始末すること。\n第３章の２   住宅用防災機器の設置及び維持に関する基準等"}, {"d": "kayojo", "a": "第29条の２", "h": "（住宅用防災機器）", "t": "第29条の２ 住宅（法第９条の２第１項に規定する住宅をいう。以下この章において同じ。）の関係者（住宅の所有者、管理者又は占有者をいう。）は、次条及び第29条の４に定める基準に従って、次の各号のいずれかの住宅用防災機器を設置し、及び維持しなければならない。\n(1)   住宅用防災警報器（令第５条の６第１号に規定する住宅用防災警報器をいう。以下この章において同じ。）\n(2)   住宅用防災報知設備（令第５条の６第２号に規定する住宅用防災報知設備をいう。以下この章において同じ。）"}, {"d": "kayojo", "a": "第29条の３", "h": "（住宅用防災警報器の設置及び維持に関する基準）", "t": "第29条の３ 住宅用防災警報器は、次に掲げる住宅の部分（第２号から第５号までに掲げる住宅の部分にあっては、令別表第１(5)項ロに掲げる防火対象物又は\n(16)項に掲げる防火対象物の住宅の用途に供される部分のうち、専ら住居の用に供されるべき住宅の部分以外の部分であって、廊下、階段、エレベーター、エレベーターホール、機械室、管理事務所その他入居者の共同の福祉のために必要な共用部分を除く。）に設けること。\n(1)    就寝の用に供する居室（建築基準法第２条第４号に規定する居室をいう。\n第４号及び第５号において同じ。）\n(2)    前号に掲げる住宅の部分が存する階（避難階（建築基準法施行令第13条第１号に規定する避難階をいう。以下この条において同じ。）を除く。）から直下階に通ずる階段（屋外に設けられたものを除く。以下この条において同じ。）の上端\n(3)    前２号に掲げるもののほか、第１号に掲げる住宅の部分が存する階（避難階から上方に数えた階数が２以上である階に限る。）から下方に数えた階数が２である階に直上階から通ずる階段の下端（当該階段の上端に住宅用防災警報器が設置されている場合を除く。）\n(4)    第１号及び第２号に掲げるもののほか、第１号に掲げる住宅の部分が避難階のみに存する場合であって、居室が存する最上階（避難階から上方に数えた階数が２以上である階に限る。）から直下階に通ずる階段の上端\n(5)    前４号の規定により住宅用防災警報器が設置される階以外の階のうち、床面積が７平方メートル以上である居室が５以上存する階（この号において「当該階」という。）の次に掲げるいずれかの住宅の部分\nア    廊下\nイ    廊下が存しない場合にあっては、当該階から直下階に通ずる階段の上端\nウ    廊下及び直下階が存しない場合にあっては、当該階の直上階から当該階に通ずる階段の下端\n２   住宅用防災警報器は、天井又は壁の屋内に面する部分（天井のない場合にあっては、屋根又は壁の屋内に面する部分。この項において同じ。）の次のいずれかの位置に設けること。\n(1)   壁又ははりから0.6メートル以上離れた天井の屋内に面する部分\n(2)   天井から下方0.15メートル以上0.5メートル以内の位置にある壁の屋内に面する部分\n３   住宅用防災警報器は、換気口等の空気吹出し口から、1.5メートル以上離れた位置に設けること。\n４   住宅用防災警報器は、次の表の左欄に掲げる住宅の部分の区分に応じ、同表の右欄に掲げる種別のものを設けること。\n住宅の部分                 住宅用防災警報器の種別第1項第1号から第4号まで並びに 光電式住宅用防災警報器（住宅用防災警報器及第5号イ及びウに掲げる住宅の部 び住宅用防災報知設備に係る技術上の規格を分                   定める省令（平成17年総務省令第11号。以下この章において「住宅用防災警報器等規格省令」という。）第2条第4号に掲げるものをいう。この表において同じ。）\n第1項第5号アに掲げる住宅の部分 イオン化式住宅用防災警報器（住宅用防災警報器等規格省令第2条第3号に掲げるものをいう。）又は光電式住宅用防災警報器\n５   住宅用防災警報器は、住宅用防災警報器等規格省令に定める技術上の規格に適合するものでなければならない。\n６   住宅用防災警報器は、前５項に定めるもののほか、次に掲げる基準により設置し、及び維持しなければならない。\n(1)   電源に電池を用いる住宅用防災警報器にあっては、当該住宅用防災警報器を有効に作動できる電圧の下限値となった旨が表示され、又は音響により伝達された場合は、適切に電池を交換すること。\n(2)   電源に電池以外から供給される電力を用いる住宅用防災警報器にあっては、正常に電力が供給されていること。\n(3)   電源に電池以外から供給される電力を用いる住宅用防災警報器の電源は、分電盤との間に開閉器が設けられていない配線からとること。\n(4)   電源に用いる配線は、電気工作物に係る法令の規定によること。\n(5)   自動試験機能（住宅用防災警報器等規格省令第２条第５号に規定するものをいう。次号において同じ。）を有しない住宅用防災警報器にあっては、交換期限が経過しないよう、適切に住宅用防災警報器を交換すること。\n(6)   自動試験機能を有する住宅用防災警報器にあっては、機能の異常が表示され、又は音響により伝達された場合は、適切に住宅用防災警報器を交換すること。"}, {"d": "kayojo", "a": "第29条の４", "h": "（住宅用防災報知設備の設置及び維持に関する基準）", "t": "第29条の４ 住宅用防災報知設備の感知器（火災報知設備の感知器及び発信機に係る技術上の規格を定める省令（昭和56年自治省令第17号。以下この章において「感知器等規格省令」という。）第２条第１号に規定するものをいう。以下この章において「感知器」という。）は、前条第１項各号に掲げる住宅の部分に設けること。\n２   感知器は、前条第２項及び第３項に定める位置に設けること。\n３   感知器は、次の表の左欄に掲げる住宅の部分の区分に応じ、同表の右欄に掲げる種別のものを設けること。\n住宅の部分               感知器の種別前条第1項第1号から第4号まで並 光電式スポット型感知器（感知器等規格省令第びに第5号イ及びウに掲げる住宅 2条第9号に掲げるもののうち、感知器等規格省の部分                 令第17条第2項で定める1種又は2種の試験に合格するものに限る。この表において同じ。）\n前条第1項第5号アに掲げる住宅のイオン化式スポット型感知器（感知器等規格省部分                  令第2条第8号に掲げるもののうち、感知器等規格省令第16条第2項で定める1種又は2種の試験に合格するものに限る。）又は光電式スポット型感知器\n４   住宅用防災報知設備は、その部分である法第21条の２第１項の検定対象機械器具等で令第37条第４号から第６号までに掲げるものに該当するものについてはこれらの検定対象機械器具等について定められた法第21条の２第２項の技術上の規格に、その部分である補助警報装置については住宅用防災警報器等規格省令に定める技術上の規格に、それぞれ適合するものでなければならない。\n５   住宅用防災報知設備は、前４項に定めるもののほか、次に掲げる基準により設置し、及び維持しなければならない。\n(1)    受信機（受信機に係る技術上の規格を定める省令（昭和56年自治省令第19号）第２条第７号に規定するものをいう。この項において同じ。）は、操作に支障が生じず、かつ、住宅の内部にいる者に対し、有効に火災の発生を報知できる場所に設けること。\n(2)    前条第１項各号に掲げる住宅の部分が存する階に受信機が設置されていない場合にあっては、住宅の内部にいる者に対し、有効に火災の発生を報知できるように、当該階に補助警報装置を設けること。\n(3)    感知器と受信機との間の信号を配線により送信し、又は受信する住宅用防災報知設備にあっては、当該配線の信号回路について容易に導通試験をすることができるように措置されていること。ただし、配線が感知器からはずれた場合又は配線に断線があった場合に受信機が自動的に警報を発するものにあっては、この限りでない。\n(4)    感知器と受信機との間の信号を無線により送信し、又は受信する住宅用防災報知設備にあっては、次によること。\nア   感知器と受信機との間において確実に信号を送信し、又は受信することができる位置に感知器及び受信機を設けること。\nイ    受信機において信号を受信できることを確認するための措置を講じていること。\n(5)   住宅用防災報知設備は、受信機その他の見やすい箇所に容易に消えないよう感知器の交換期限を明示すること。\n(6)   前条第６項第１号、第５号及び第６号の規定は感知器について、同条同項第２号から第４号までの規定は住宅用防災報知設備について準用する。"}, {"d": "kayojo", "a": "第29条の５", "h": "（設置の免除）", "t": "第29条の５ 前３条の規定にかかわらず、次の各号に掲げるときは、次の各号に定める設備の有効範囲内の住宅の部分について住宅用防災警報器又は住宅用防災報知設備（以下この章において「住宅用防災警報器等」という。）を設置しないことができる。\n(1)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分にスプリンクラー設備（標示温度が75度以下で種別が１種の閉鎖型スプリンクラーヘッドを備えているものに限る。）を令第12条に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(2)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に自動火災報知設備を令第21条に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(3)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に共同住宅用スプリンクラー設備を特定共同住宅等における必要とされる防火安全性能を有する消防の用に供する設備等に関する省令（平成17年総務省令第40号。以下「特定共同住宅等省令」という。）第３条第３項第２号に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(4)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に共同住宅用自動火災報知設備を特定共同住宅等省令第３条第３項第３号に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(5)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に住戸用自動火災報知設備を特定共同住宅等省令第３条第３項第４号に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(6)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に特定小規模施設用自動火災報知設備を特定小規模施設における必要とされる防火安全性能を有する消防の用に供する設備等に関する省令（平成20年総務省令第156号）第３条第２項及び第３項に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき\n(7)   第29条の３第１項各号又は前条第１項に掲げる住宅の部分に複合型居住施設用自動火災報知設備を複合型居住施設における必要とされる防火安全性能を有する消防の用に供する設備等に関する省令（平成22年総務省令第７号）"}, {"d": "kayojo", "a": "第３条", "h": "", "t": "第３条 第２項に定める技術上の基準に従い、又は当該技術上の基準の例により設置したとき"}, {"d": "kayojo", "a": "第29条の６", "h": "（基準の特例）", "t": "第29条の６ 第29条の２から第29条の４までの規定は、住宅用防災警報器等について、消防長（消防署長）が、住宅の位置、構造又は設備の状況から判断して、これらの規定による住宅用防災警報器等の設置及び維持に関する基準によらなくとも、住宅における火災の発生又は延焼のおそれが著しく少なく、かつ、住宅における火災による被害を最小限度に止めることができると認めるときにおいては、適用しない。"}, {"d": "kayojo", "a": "第29条の７", "h": "（住宅における火災の予防の推進）", "t": "第29条の７ 揖斐郡消防組合は、住宅における火災の予防を推進するため、次に掲げる施策の実施に努めるものとする。\n(1)   住宅における出火防止、火災の早期発見、初期消火、延焼防止、通報、避難等に資する住宅用防災機器、感震ブレーカーその他の物品、機械器具及び設備の普及の促進\n(2)   住民の自主的な防災組織が行う住宅における火災の予防に資する活動の促進\n２   揖斐郡消防組合管内の住民は、住宅における火災の予防を推進するため、第29条の３第１項に定める住宅の部分のほか、台所その他の火災発生のおそれが大であると認められる住宅の部分における住宅用防災警報器等の設置に努めるものとする。\n第３章の３ 林野火災の予防"}, {"d": "kayojo", "a": "第29条の８", "h": "（林野火災に関する注意報）", "t": "第29条の８ 管理者は、気象の状況が山林、原野等における火災（以下「林野火災」という。）の予防上注意を要すると認めるときは、林野火災に関する注意報を発することができる。\n２   前項の規定による注意報が発せられたときは、注意報が解除されるまでの間、揖斐郡消防組合管内の区域内に在る者は、第29条各号に定める火の使用の制限に従うよう努めなければならない。\n３   管理者は、林野火災の発生の危険性を勘案して、前項の規定による火の使用の制限の努力義務の対象となる区域を指定することができる。"}, {"d": "kayojo", "a": "第29条の９", "h": "（林野火災の予防を目的とした火災に関する警報の発令中における火の使用の制限）", "t": "第29条の９ 管理者は、林野火災の予防を目的として火災に関する警報を発したときは、林野火災の発生の危険性を勘案して、第29条各号に定める火の使用の制限の対象となる区域を指定することができる。\n第４章 指定数量未満の危険物及び指定可燃物の貯蔵及び取扱いの技術上の基準等\n第１節 指定数量未満の危険物の貯蔵及び取扱いの技術上の基準等"}, {"d": "kayojo", "a": "第30条", "h": "（指定数量未満の危険物の貯蔵及び取扱いの基準）", "t": "第30条 法第９条の４の規定に基づき危険物の規制に関する政令（昭和34年政令第306号）で定める数量（以下「指定数量」という。）未満の危険物の貯蔵及び取扱いは、次の各号に掲げる技術上の基準によらなければならない。\n(1)   危険物を貯蔵し、又は取り扱う場所においては、みだりに火気を使用しないこと。\n(2)   危険物を貯蔵し、又は取り扱う場所においては、常に整理及び清掃を行うとともに、みだりに空箱その他の不必要な物件を置かないこと。\n(3)   危険物を貯蔵し、又は取り扱う場合においては、当該危険物が漏れ、あふれ、又は飛散しないように必要な措置を講ずること。\n(4)   危険物を容器に収納して貯蔵し、又は取り扱うときは、その容器は、当該危険物の性質に適応し、かつ、破損、腐食、さけめ等がないものであること。\n(5)   危険物を収納した容器を貯蔵し、又は取り扱う場合においては、みだりに転倒させ、落下させ、衝撃を加え、又は引きずる等粗暴な行為をしないこと。\n(6)   危険物を収納した容器を貯蔵し、又は取り扱う場合においては、地震等により、容易に容器が転落し、若しくは転倒し、又は他の落下物により損傷を受けないよう必要な措置を講ずること。"}, {"d": "kayojo", "a": "第31条", "h": "（指定数量の５分の１以上指定数量未満の危険物の貯蔵及び取扱いの技術上の基準等）", "t": "第31条 指定数量の５分の１以上指定数量未満の危険物の貯蔵及び取扱い並びに貯蔵し、又は取り扱う場所の位置、構造及び設備は、前条に定めるもののほか、次条から第31条の８までに定める技術上の基準によらなければならない。"}, {"d": "kayojo", "a": "第31条の２", "h": "", "t": "第31条の２ 指定数量の５分の１以上指定数量未満の危険物の貯蔵及び取扱いのすべてに共通する技術上の基準は、次のとおりとする。\n(1)   ためます又は油分離装置にたまった危険物は、あふれないように随時くみ上げること。\n(2)   危険物又は危険物のくず、かす等を廃棄する場合には、それらの性質に応じ、安全な場所において、他に危害又は損害を及ぼすおそれのない方法により行うこと。\n(3)    危険物を貯蔵し、又は取り扱う場所では、当該危険物の性質に応じ、遮光又は換気を行うこと。\n(4)    危険物は、温度計、湿度計、圧力計その他の計器を監視して、当該危険物の性質に応じた適正な温度、湿度又は圧力を保つように貯蔵し、又は取り扱うこと。\n(5)    危険物を貯蔵し、又は取り扱う場合においては、危険物の変質、異物の混入等により、当該危険物の危険性が増大しないように必要な措置を講ずること。\n(6)    危険物が残存し、又は残存しているおそれがある設備、機械器具、容器等を修理する場合は、安全な場所において、危険物を完全に除去した後に行うこと。\n(7)    可燃性の液体、可燃性の蒸気若しくは可燃性のガスが漏れ、若しくは滞留するおそれのある場所又は可燃性の微粉が著しく浮遊するおそれのある場所では、電線と電気器具とを完全に接続し、かつ、火花を発する機械器具、工具、履物等を使用しないこと。\n(8)    危険物を保護液中に保存する場合は、当該危険物が保護液から露出しないようにすること。\n(9)    接触又は混合により発火するおそれのある危険物と危険物その他の物品は、相互に近接して置かないこと。ただし、接触又は混合しないような措置を講じた場合は、この限りでない。\n(10)   危険物を加熱し、又は乾燥する場合は、危険物の温度が局部的に上昇しない方法で行うこと。\n(11)   危険物を詰め替える場合は、防火上安全な場所で行うこと。\n(12)   吹付塗装作業は、防火上有効な隔壁で区画された場所等安全な場所で行うこと。\n(13)   焼入れ作業は、危険物が危険な温度に達しないようにして行うこと。\n(14)   染色又は洗浄の作業は、可燃性の蒸気の換気をよくして行うとともに、廃液をみだりに放置しないで安全に処置すること。\n(15)   バーナーを使用する場合においては、バーナーの逆火を防ぎ、かつ、危険物があふれないようにすること。\n(16)   危険物を容器に収納し、又は詰め替える場合は、次によること。\nア    固体の危険物にあっては危険物の規制に関する規則（昭和34年総理府令第55号。以下「危険物規則」という。）別表第３、液体の危険物にあっては危険物規則別表第３の２の危険物の類別及び危険等級の別の項に掲げる危険物について、これらの表において適応するものとされる内装容器（内装容器の容器の種類の項が空欄のものにあっては、外装容器）又はこれと同等以上であると認められる容器（以下この号において「内装容器等」という。）に適合する容器に収納し、又は詰め替えるとともに、温度変化等により危険物が漏れないように容器を密封して収納すること。\nイ    アの内装容器等には、見やすい箇所に危険物規則第39条の３第２項から第６項までの規定の例による表示をすること。\n(17)   危険物を収納した容器を積み重ねて貯蔵する場合には、高さ３メートル（第４類の危険物のうち第３石油類及び第４石油類を収納した容器のみを積み重ねる場合にあっては、４メートル）を超えて積み重ねないこと。\n２   指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う場所の位置、構造及び設備のすべてに共通する技術上の基準は、次のとおりとする。\n(1)    危険物を貯蔵し、又は取り扱う場所には、見やすい箇所に危険物を貯蔵し、又は取り扱っている旨を表示した標識（危険物を貯蔵し、又は取り扱うタンクのうち車両に固定されたタンク（以下「移動タンク」という。）にあっては、0.3メートル平方の地が黒色の板に黄色の反射塗料その他反射性を有する材料で「危」と表示した標識）並びに危険物の類、品名、最大数量及び移動タンク以外の場所にあっては防火に関し必要な事項を掲示した掲示板を設けること。\n(2)   危険物を取り扱う機械器具その他の設備は、危険物の漏れ、あふれ又は飛散を防止することができる構造とすること。ただし、当該設備に危険物の漏れ、あふれ又は飛散による災害を防止するための附帯設備を設けたときは、この限りでない。\n(3)   危険物を加熱し、若しくは冷却する設備又は危険物の取扱いに伴って温度の変化が起こる設備には、温度測定装置を設けること。\n(4)   危険物を加熱し、又は乾燥する設備は、直火を用いない構造とすること。\nただし、当該設備が防火上安全な場所に設けられているとき、又は当該設備に火災を防止するための附帯設備を設けたときは、この限りでない。\n(5)   危険物を加圧する設備又はその取り扱う危険物の圧力が上昇するおそれのある設備には、圧力計及び有効な安全装置を設けること。\n(6)   引火性の熱媒体を使用する設備にあっては、その各部分を熱媒体又はその蒸気が漏れない構造とするとともに、当該設備に設ける安全装置は、熱媒体又はその蒸気を火災予防上安全な場所に導く構造とすること。\n(7)   電気設備は、電気工作物に係る法令の規定の例によること。\n(8)   危険物を取り扱うにあたって静電気が発生するおそれのある設備には、当該設備に蓄積される静電気を有効に除去する装置を設けること。\n(9)   危険物を取り扱う配管は、次によること。\nア    配管は、その設置される条件及び使用される状況に照らして十分な強度を有するものとし、かつ、当該配管に係る最大常用圧力の1.5倍以上の圧力で水圧試験（水以外の不燃性の液体又は不燃性の気体を用いて行う試験を含む。）を行ったとき漏えいその他の異常がないものであること。\nイ    配管は、取り扱う危険物により容易に劣化するおそれのないものであること。\nウ    配管は、火災等による熱によって容易に変形するおそれのないものであること。ただし、当該配管が地下その他の火災等による熱により悪影響を受けるおそれのない場所に設置される場合にあっては、この限りでない。\nエ    配管には、外面の腐食を防止するための措置を講ずること。ただし、当該配管が設置される条件の下で腐食するおそれのないものである場合にあっては、この限りでない。\nオ    配管を地下に設置する場合には、配管の接合部分（溶接その他危険物の漏えいのおそれがないと認められる方法により接合されたものを除く。）\nについて当該接合部分からの危険物の漏えいを点検することができる措置を講ずること。\nカ    配管を地下に設置する場合には、その上部の地盤面にかかる重量が当該配管にかからないように保護すること。"}, {"d": "kayojo", "a": "第31条の３", "h": "", "t": "第31条の３ 指定数量の５分の１以上指定数量未満の危険物を屋外において架台で貯蔵する場合には、高さ６メートルを超えて危険物を収納した容器を貯蔵してはならない。\n２   指定数量の５分の１以上指定数量未満の危険物を屋外において貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準は、次のとおりとする。\n(1)    危険物を貯蔵し、又は取り扱う屋外の場所（移動タンクを除く。）の周囲には容器等の種類及び貯蔵し、又は取り扱う数量に応じ、次の表に掲げる幅の空地を保有するか、又は防火上有効な塀を設けること。ただし、開口部のない防火構造（建築基準法第２条第８号に規定する防火構造をいう。以下同じ。）の壁又は不燃材料で造った壁に面するときは、この限りではない。\n容器等の種類         貯蔵し、又は取り扱う数量     空地の幅タンク又は金属製容指定数量の2分の1以上指定数量未満 1メートル以上器その他の場合       指定数量の5分の1以上2分の1未満   1メートル以上指定数量の2分の1以上指定数量未満 2メートル以上\n(2)   液状の危険物を取り扱う設備（タンクを除く。）には、その直下の地盤面の周囲に囲いを設け、又は危険物の流出防止にこれと同等以上の効果があると認められる措置を講ずるとともに、当該地盤面は、コンクリートその他危険物が浸透しない材料で覆い、かつ、適当な傾斜及びためます又は油分離装置を設けること。\n(3)   危険物を収納した容器を架台で貯蔵する場合には、架台は不燃材料で堅固に造ること。"}, {"d": "kayojo", "a": "第31条の３の２", "h": "", "t": "第31条の３の２ 指定数量の５分の１以上指定数量未満の危険物を屋内において貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準は、次のとおりとする。\n(1)   壁、柱、床及び天井は、不燃材料で造られ、又は覆われたものであること。\n(2)   窓及び出入口には、防火戸を設けること。\n(3)   液状の危険物を貯蔵し、又は取り扱う床は、危険物が浸透しない構造とするとともに、適当な傾斜をつけ、かつ、ためますを設けること。\n(4)   架台を設ける場合は、架台は不燃材料で堅固に造ること。\n(5)   危険物を貯蔵し、又は取り扱うために必要な採光、照明及び換気の設備を設けること。\n(6)   可燃性の蒸気又は可燃性の微粉が滞留するおそれのある場合は、その蒸気又は微粉を屋外の高所に排出する設備を設けること。"}, {"d": "kayojo", "a": "第31条の４", "h": "", "t": "第31条の４ 指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱うタンク（地盤面下に埋設されているタンク（以下「地下タンク」という。）\n及び移動タンクを除く。以下この条において同じ。）に危険物を収納する場合は、当該タンクの容量を超えてはならない。\n２   指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱うタンクの位置、構造及び設備の技術上の基準は次のとおりとする。\n(1)   その容量に応じ、次の表に掲げる厚さの鋼板又はこれと同等以上の機械的性質を有する材料で機密に造るとともに、圧力タンクを除くタンクにあっては水張試験において、圧力タンクにあっては最大常用圧力の1.5倍の圧力で10分間行う水圧試験において、それぞれ漏れ、又は変形しないものであること。\nただし、固体の危険物を貯蔵し、又は取り扱うタンクにあっては、この限りでない。\nタンクの容量                       板厚40リットル以下                       1.0ミリメートル以上40リットルを超え100リットル以下             1.2ミリメートル以上100リットルを超え250リットル以下            1.6ミリメートル以上250リットルを超え500リットル以下            2.0ミリメートル以上500リットルを超え1,000リットル以下          2.3ミリメートル以上1,000リットルを超え2,000リットル以下        2.6ミリメートル以上2,000リットルを超えるもの                3.2ミリメートル以上\n(2)   地震等により容易に転倒又は落下しないように設けること。\n(3)   外面には、さび止めのための措置を講ずること。ただし、アルミニウム合金、ステンレス鋼その他さびにくい材質で造られたタンクにあっては、この限りでない。\n(4)   圧力タンクにあっては有効な安全装置を、圧力タンク以外のタンクにあっては有効な通気管又は通気口を設けること。\n(5)   引火点が40度未満の危険物を貯蔵し、又は取り扱う圧力タンク以外のタンクにあっては、通気管又は通気口に引火を防止するための措置を講ずること。\n(6)   見やすい位置に危険物の量を自動的に表示する装置（ガラス管等を用いるものを除く。）を設けること。\n(7)   注入口は、火災予防上支障のない場所に設けるとともに、当該注入口には弁又はふたを設けること。\n(8)    タンクの配管には、タンク直近の容易に操作できる位置に開閉弁を設けること。\n(9)    タンクの配管は、地震等により当該配管とタンクとの結合部分に損傷を与えないように設置すること。\n(10)   液体の危険物のタンクの周囲には、危険物が漏れた場合にその流出を防止するための有効な措置を講ずること。\n(11)   屋外に設置するもので、タンクの底板を地盤面に接して設けるものにあっては、底板の外面の腐食を防止するための措置を講ずること。"}, {"d": "kayojo", "a": "第31条の５", "h": "", "t": "第31条の５ 指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う地下タンクに危険物を収納する場合は、当該タンクの容量を超えてはならない。\n２   指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う地下タンクの位置、構造及び設備の技術上の基準は、前条第２項第３号から第５号まで及び第７号の規定の例によるほか、次のとおりとする。\n(1)    地盤面下に設けられたコンクリート造等のタンク室に設置し、又は危険物の漏れを防止することができる構造により地盤面下に設置すること。ただし、第４類の危険物のタンクで、その外面がエポキシ樹脂、ウレタンエラストマー樹脂、強化プラスチック又はこれらと同等以上の防食性を有する材料により有効に保護されている場合又は腐食し難い材質で造られている場合にあっては、この限りでない。\n(2)    自動車等による上部からの荷重を受けるおそれのあるタンクにあっては、当該タンクに直接荷重がかからないようにふたを設けること。\n(3)    タンクは、堅固な基礎の上に固定されていること。\n(4)    タンクは、厚さ3.2ミリメートル以上の鋼板又はこれと同等以上の強度を有する金属板若しくはこれと同等以上の性能を有するガラス繊維強化プラスチックで機密に造るとともに、圧力タンクを除くタンクにあっては70キロパスカルの圧力で、圧力タンクにあっては最大常用圧力の1.5倍の圧力で、それぞれ10分間行う水圧試験において、漏れ、又は変形しないものであること。\n(5)   危険物の量を自動的に表示する装置又は軽量口を設けること。この場合において、軽量口を設けるタンクについては、軽量口の直下のタンクの底板にその損傷を防止するための措置を講ずること。\n(6)   タンクの配管は、当該タンクの頂部に取り付けること。\n(7)   タンクの周囲に２箇所以上の管を設けること等により当該タンクからの液体の危険物の漏れを検知する設備を設けること。"}, {"d": "kayojo", "a": "第31条の６", "h": "", "t": "第31条の６ 指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う移動タンクの技術上の基準は、第31条の４第１項の規定の例によるほか、次のとおりとする。\n(1)   タンクから危険物を貯蔵し、又は取り扱う他のタンクに液体の危険物を注入するときは、当該他のタンクの注入口にタンクの注入ホースを緊結するか、又は注入ホースの先端部に手動開閉装置を備えた注入ノズル（手動開閉装置を開放の状態で固定する装置を備えたものを除く。）により注入すること。\n(2)   タンクから液体の危険物を容器に詰め替えないこと。ただし、安全な注油に支障がない範囲の注油速度で前号に定める注入ノズルにより引火点が40度以上の第４類の危険物を容器に詰め替える場合は、この限りでない。\n(3)   静電気による災害が発生するおそれのある液体の危険物をタンクに入れ、又はタンクから出すときは、当該タンクを有効に接地すること。\n(4)   静電気による災害が発生するおそれのある液体の危険物をタンクにその上部から注入するときは、注入管を用いるとともに、当該注入管の先端をタンクの底部に着けること。\n２   指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う移動タンクの位置、構造及び設備の技術上の基準は、第31条の４第２項第３号の規定の例によるほか、次のとおりとする。\n(1)   火災予防上安全な場所に常置すること。\n(2)   タンクは、厚さ3.2ミリメートル以上の鋼板又はこれと同等以上の機械的性質を有する材料で機密に造るとともに、圧力タンクを除くタンクにあっては70キロパスカルの圧力で、圧力タンクにあっては最大常用圧力の1.5倍の圧力で、それぞれ10分間行う水圧試験において、漏れ、又は変形しないものであること。\n(3)   タンクは、Uボルト等で車両のシャーシフレーム又はこれに相当する部分に強固に固定すること。\n(4)   常用圧力が20キロパスカル以下のタンクにあっては20キロパスカルを超え24キロパスカル以下の範囲の圧力で、常用圧力が20キロパスカルを超えるタンクにあっては常用圧力の1.1倍以下の圧力で作動する安全装置を設けること。\n(5)   タンクは、その内部に4,000リットル以下ごとに完全な間仕切を厚さ3.2ミリメートル以上の鋼板又はこれと同等以上の機械的性質を有する材料で設けること。\n(6)   前号の間仕切により仕切られた部分には、それぞれマンホール及び第４号に規定する安全装置を設けるとともに、当該間仕切により仕切られた部分の容量が2,000リットル以上のものにあっては、厚さ1.6ミリメートル以上の鋼板又はこれと同等以上の機械的性質を有する材料で造られた防波板を設けること。\n(7)   マンホール及び注入口のふたは、厚さ3.2ミリメートル以上の鋼板又はこれと同等以上の機械的性質を有する材料で造ること。\n(8)   マンホール、注入口、安全装置等の附属装置がその上部に突出しているタンクには、当該タンクの転倒等による当該附属装置の損傷を防止するための防護枠を設けること。\n(9)    タンクの下部に排出口を設ける場合は、当該タンクの排出口に、非常の場合に直ちに閉鎖することができる弁等を設けるとともに、その直近にその旨を表示し、かつ、外部からの衝撃による当該弁等の損傷を防止するための措置を講ずること。\n(10)   タンクの配管は、先端部に弁等を設けること。\n(11)   タンク及び附属装置の電気設備で、可燃性の蒸気が滞留するおそれのある場所に設けるものは、可燃性の蒸気に引火しない構造とすること。"}, {"d": "kayojo", "a": "第31条の７", "h": "", "t": "第31条の７ 指定数量の５分の１以上指定数量未満の危険物の貯蔵及び取扱いの危険物の類ごとに共通する技術上の基準は、次のとおりとする。\n(1)    第１類の危険物は、可燃物との接触若しくは混合、分解を促す物品との接近又は過熱、衝撃若しくは摩擦を避けるとともに、アルカリ金属の過酸化物及びこれを含有するものにあっては、水との接触を避けること。\n(2)    第２類の危険物は、酸化剤との接触若しくは混合、炎、火花若しくは高温体との接近又は過熱を避けるとともに、鉄粉、金属粉及びマグネシウム並びにこれらのいずれかを含有するものにあっては、水又は酸との接触を避け、引火性固体にあってはみだりに蒸気を発生させないこと。\n(3)    自然発火性物品（第３類の危険物のうち危険物の規制に関する政令第１条の５第２項の自然発火性試験において同条第３項に定める性状を示すもの並びにアルキルアルミニウム、アルキルリチウム及び黄りんをいう。）にあっては炎、火花若しくは高温体との接近、過熱又は空気との接触を避け、禁水性物品（第３類の危険物のうち同令第１条の５第５項の水との反応性試験において同条第６項に定める性状を示すもの（カリウム、ナトリウム、アルキルアルミニウム及びアルキルリチウムを含む。）をいう。）にあっては水との接触を避けること。\n(4)    第４類の危険物は、炎、火花若しくは高温体との接近又は過熱を避けるとともに、みだりに蒸気を発生させないこと。\n(5)   第５類の危険物は、炎、火花若しくは高温体との接近、過熱、衝撃又は摩擦を避けること。\n(6)   第６類の危険物は、可燃物との接触若しくは混合、分解を促す物品との接近又は過熱を避けること。\n２   前項の基準は、危険物を貯蔵し、又は取り扱うにあたって、同項の基準によらないことが通常である場合においては、適用しない。この場合において、当該貯蔵又は取扱いについては、災害の発生を防止するため十分な措置を講じなければならない。"}, {"d": "kayojo", "a": "第31条の８", "h": "", "t": "第31条の８ 指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱うタンク、配管その他の設備は、第31条の２から第31条の６までの位置、構造及び設備の技術上の基準に適合するよう適正に維持管理されたものでなければならない。"}, {"d": "kayojo", "a": "第31条の９", "h": "", "t": "第31条の９ 第30条から前条までの規定にかかわらず、指定数量未満の第４類の危険物のうち動植物油類を貯蔵し、又は取り扱う場合にあっては、当該各条の規定は、適用しない。"}, {"d": "kayojo", "a": "第32条", "h": "（品名又は指定数量を異にする危険物）", "t": "第32条 品名又は指定数量を異にする２以上の危険物を同一の場所で貯蔵し、又は取り扱う場合において、当該貯蔵又は取扱いに係る危険物の数量を当該危険物の指定数量の５分の１の数量で除し、その商の和が１以上となるときは、当該場所は指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱っているものとみなす。\n第２節 指定可燃物等の貯蔵及び取扱いの技術上の基準等"}, {"d": "kayojo", "a": "第33条", "h": "（可燃性液体類等の貯蔵及び取扱いの技術上の基準等）", "t": "第33条 別表第８の品名欄に掲げる物品で同表の数量欄に定める数量以上のもの（以下「指定可燃物」という。）のうち可燃性固体類（同表備考第６号に規定する可燃性固体類をいう。以下同じ。）及び可燃性液体類（同表備考第８号に規定する可燃性液体類をいう。以下同じ。）並びに指定数量の５分の１以上指定数量未満の第４類の危険物のうち動植物油類（以下「可燃性液体類等」という。）の貯蔵及び取扱いは、次の各号に掲げる技術上の基準によらなければならない。\n(1)   可燃性液体類等を容器に収納し、又は詰め替える場合は、次によること。\nア    可燃性固体類（別表第８備考第６号エに該当するものを除く。）にあっては危険物規則別表第３の危険物の類別及び危険等級の別の第２類のⅢの項において、可燃性液体類及び指定数量の５分の１以上指定数量未満の第４類の危険物のうち動植物油類にあっては危険物規則別表第３の２の危険物の類別及び危険等級の別の第４類のⅢの項において、それぞれ適応するものとされる内装容器（内装容器の容器の種類の項が空欄のものにあっては、外装容器）又はこれと同等以上であると認められる容器（以下この号において「内装容器等」という。）に適合する容器に収納し、又は詰め替えるとともに、温度変化等により可燃性液体類等が漏れないように容器を密封して収納すること。\nイ    アの内装容器等には、見やすい箇所に可燃性液体類等の化学名又は通称名及び数量の表示並びに「火気厳禁」その他これと同一の意味を有する他の表示をすること。ただし、化粧品の内装容器等で最大容量が300ミリリットル以下のものについては、この限りでない。\n(2)   可燃性液体類等（別表第８備考第６号エに該当するものを除く。）を収納した容器を積み重ねて貯蔵する場合には、高さ４メートルを超えて積み重ねないこと。\n(3)   可燃性液体類等は、炎、火花若しくは高温体との接近又は過熱を避けるとともに、みだりに蒸気を発生させないこと。\n(4)   前号の基準は、可燃性液体類等を貯蔵し、又は取り扱うにあたって、同号の基準によらないことが通常である場合においては、適用しない。この場合において、当該貯蔵又は取扱いについては、災害の発生を防止するため十分な措置を講ずること。\n２   可燃性液体類等を貯蔵し、又は取り扱う場所の位置、構造及び設備は、次の各号に掲げる技術上の基準によらなければならない。\n(1)   可燃性液体類等を貯蔵し、又は取り扱う屋外の場所の周囲には、可燃性固体類及び可燃性液体類（以下「可燃性固体類等」という。）にあっては容器等の種類及び可燃性固体類等の数量の倍数（貯蔵し、又は取り扱う可燃性固体類等の数量を別表第８に定める当該可燃性固体類等の数量で除して得た値をいう。以下この条において同じ。）に応じ次の表に掲げる幅の空地を、指定数量の５分の１以上指定数量未満の第４類の危険物のうち動植物油類にあっては１メートル以上の幅の空地をそれぞれ保有するか、又は防火上有効な塀を設けること。\n容器等の種類    可燃性固体類等の数量の倍数     空地の幅タンク又は金属製容器      1以上20未満          1メートル以上20以上200未満        2メートル以上200以上            3メートル以上その他の場合          1以上20未満          1メートル以上20以上200未満        3メートル以上200以上            5メートル以上\n(2)   別表第８で定める数量の20倍以上の可燃性固体類等を屋内において貯蔵し、又は取り扱う場合は、壁、柱、床及び天井を不燃材料で造った室内において行うこと。ただし、その周囲に幅１メートル（別表第８で定める数量の200倍以上の可燃性固体類等を貯蔵し、又は取り扱う場合は、３メートル）以上の空地を保有するか、又は防火上有効な隔壁を設けた建築物その他の工作物内にあっては、壁、柱、床及び天井を不燃材料で覆った室内において、貯蔵し、又は取り扱うことができる。\n３   前２項に規定するもののほか、可燃性液体類等の貯蔵及び取扱い並びに貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準については、第30条から第31条の８まで（第31条の２第１項第16号及び第17号、第31条の３第２項第１号並びに第31条の７を除く。）の規定を準用する。"}, {"d": "kayojo", "a": "第34条", "h": "（綿花類等の貯蔵及び取扱いの技術上の基準等）", "t": "第34条 指定可燃物のうち可燃性固体類等以外の指定可燃物（以下「綿花類等」という。）の貯蔵及び取扱いは、次の各号に掲げる技術上の基準によらなければならない。\n(1)    綿花類等を貯蔵し、又は取り扱う場所においては、みだりに火気を使用しないこと。\n(2)    綿花類等を貯蔵し、又は取り扱う場所においては、係員以外の者をみだりに出入りさせないこと。\n(3)    綿花類等を貯蔵し、又は取り扱う場所においては、常に整理及び清掃を行うこと。この場合において、危険物と区分して整理するとともに、綿花類等の性状等に応じ、地震等により容易に荷くずれ、落下、転倒又は飛散しないような措置を講ずること。\n(4)    綿花類等のくず、かす等は、当該綿花類等の性質に応じ、１日１回以上安全な場所において廃棄し、その他適当な措置を講ずること。\n(5)    再生資源燃料（別表第８備考第５号に規定する再生資源燃料をいう。以下同じ。）のうち、廃棄物固形化燃料その他の水分によって発熱又は可燃性ガスの発生のおそれがあるもの（以下「廃棄物固形化燃料等」という。）を貯蔵し、又は、取り扱う場合は、次によること。\nア    廃棄物固形化燃料等を貯蔵し、又は取り扱う場合は、適切な水分管理を行うこと。\nイ    廃棄物固形化燃料等を貯蔵する場合は、適切な温度に保持された廃棄物固形化燃料等に限り受け入れること。\nウ    ３日を超えて集積する場合においては、発火の危険性を減じ、発火時においても速やかな拡大防止の措置を講じることができるよう５メートル以下の適切な集積高さとすること。\nエ    廃棄物固形化燃料等を貯蔵する場合は、温度、可燃性ガス濃度の監視により廃棄物固形化燃料等の発熱の状況を常に監視すること。\n２     綿花類等を貯蔵し、又は取り扱う場所の位置、構造及び設備は、次の各号に掲げる技術上の基準によらなければならない。\n(1)     綿花類等を貯蔵し、又は取り扱う場所には、綿花類等を貯蔵し、又は取り扱っている旨を表示した標識並びに綿花類等の品名、最大数量及び防火に関し必要な事項を掲示した掲示板を設けること。\n(2)     綿花類等のうち廃棄物固形化燃料等及び合成樹脂類（別表第８備考第９号に規定する合成樹脂類をいう。以下同じ。）以外のものを集積する場合には、１集積単位の面積が200平方メートル以下になるように区分するとともに、集積単位相互間に次の表に掲げる距離を保つこと。ただし、廃棄物固定化燃料等以外の再生資源燃料及び石炭・木炭類（同表備考第７号に規定する石炭・木炭類をいう。）にあっては、温度計等により温度を監視するとともに、廃棄物固形化燃料等以外の再生資源燃料又は石炭・木炭類を適温に保つための散水設備等を設置した場合は、この限りでない。\n区分                   距離\n(1)        面積が50平方メートル以下の集積単位相互間   1メートル以上\n(2)        面積が50平方メートルを超え200平方メートル以 2メートル以上下の集積単位相互間\n(3)     綿花類等のうち合成樹脂類を貯蔵し、又は取り扱う場合は、次によること。\nア    集積する場合においては、１集積単位の面積が500平方メートル以下になるように区分するとともに、集積単位相互間に次の表に掲げる距離を保つこと。ただし、火災の拡大又は延焼を防止するため散水設備を設置する等必要な措置を講じた場合は、この限りでない。\n区分                  距離\n(1)        面積が100平方メートル以下の集積単位相互間   1メートル以上\n(2)        面積が100平方メートルを超え300平方メートル以 2メートル以上下の集積単位相互間\n(3)        面積が300平方メートルを超え500平方メートル以 3メートル以上下の集積単位相互間\nイ    合成樹脂類を貯蔵し、又は取り扱う屋外の場所の周囲には、１メートル（別表第８で定める数量の20倍以上の合成樹脂類を貯蔵し、又は取り扱う場合は、３メートル）以上の空地を保有するか、又は防火上有効な塀を設けること。ただし、開口部のない防火構造の壁又は不燃材料で造った壁に面するとき又は火災の延焼を防止するため水幕設備を設置する等必要な措置を講じた場合は、この限りでない。\nウ    屋内において貯蔵し、又は取り扱う場合は、貯蔵する場所と取り扱う場所の間及び異なる取扱いを行う場合の取り扱う場所相互の間を不燃性の材料を用いて区画すること。ただし、火災の延焼を防止するため水幕設備を設置する等必要な措置を講じた場合は、この限りでない。\nエ    別表第８に定める数量の100倍以上を屋内において貯蔵し、又は取り扱う場合は、壁及び天井を難燃材料（建築基準法施行令第１条第６号に規定する難燃材料をいう。）で仕上げた屋内において行うこと。\n(4)     廃棄物固形化燃料等を貯蔵し、又は取り扱う場所の位置、構造及び設備は、前号ア及びエの規定の例によるほか、次に掲げる技術上の基準によること。\nア    廃棄物固形化燃料等の発熱の状況を監視するための温度測定装置を設けること。\nイ    別表第８で定める数量の100倍以上の廃棄物固形化燃料等をタンクにおいて貯蔵する場合は、当該タンクは廃棄物固形化燃料等に発熱が生じた場合に廃棄物固形化燃料等を迅速に排出できる構造とすること。ただし、当該タンクに廃棄物固形化燃料等の発熱の拡大を防止するための散水設備又は不活性ガス封入設備を設置した場合はこの限りでない。"}, {"d": "kayojo", "a": "第34条の２", "h": "", "t": "第34条の２ 別表第８で定める数量の100倍以上の再生資源燃料（廃棄物固形化燃料等に限る。）、可燃性固体類、可燃性液体類又は合成樹脂類を貯蔵し、又は取り扱う場合は、当該貯蔵し、又は取り扱う場所における火災の危険要因を把握するとともに、前２条に定めるもののほか当該危険要因に応じた火災予防上有効な措置を講じなければならない。\n第３節 基準の特例"}, {"d": "kayojo", "a": "第34条の３", "h": "（基準の特例）", "t": "第34条の３ この章（第30条、第31条の７及び第32条を除く。以下同じ。）の規定は、指定数量未満の危険物及び指定可燃物の貯蔵及び取扱いについて、消防長（消防署長）が、その品名及び数量、貯蔵及び取扱いの方法並びに周囲の地形その他の状況等から判断して、この章の規定による貯蔵及び取扱い並びに貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準によらなくても、火災の発生及び延焼のおそれが著しく少なく、かつ、火災等の災害による被害を最少限度に止めることができると認めるとき、又は予想しない特殊の構造若しくは設備を用いることによりこの章の規定による貯蔵及び取扱い並びに貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準による場合と同等以上の効力があると認めるときにおいては、適用しない。\n第５章 避難管理"}, {"d": "kayojo", "a": "第35条", "h": "（劇場等の客席）", "t": "第35条 劇場等の屋内の客席は、次の各号に定めるところによらなければならない。\n(1)   いすは、床に固定すること。\n(2)   いす背（いす背のない場合にあっては、いす背に相当するいすの部分。以下この条及び次条において同じ。）の間隔は、80センチメートル以上とし、いす席の間隔（前席の最後部と後席の最前部の間の水平距離をいう。以下この条において同じ。）は、35センチメートル以上とし、座席の幅は、40センチメートル以上とすること。\n(3)   立見席の位置は、客席の後方とし、その奥行は、2.4メートル以下とすること。\n(4)   客席（最下階にあるものを除く。）の最前部及び立見席を設ける部分とその他の部分との間には、高さ75センチメートル以上の手すりを設けること。\n(5)   客席の避難通路は、次によること。\nア    いす席を設ける客席の部分には、横に並んだいす席の基準席数（８席にいす席の間隔が35センチメートルを超える１センチメートルごとに１席を加えた席数（20席を超える場合にあっては、20席とする。）をいう。以下この条において同じ。）以下ごとに、その両側に縦通路を保有すること。\nただし、基準席数に２分の１を乗じて得た席数（１席未満の端数がある場合は、その端数は切り捨てる。）以下ごとに縦通路を保有する場合にあっては、片側のみとすることができる。\nイ    アの縦通路の幅は、当該通路のうち避難の際に通過すると想定される人数が最大となる地点での当該通過人数に0.6センチメートルを乗じて得た幅員（以下「算定幅員」という。）以上とすること。ただし、当該通路の幅は、80センチメートル（片側のみがいす席に接する縦通路にあっては、60センチメートル）未満としてはならない。\nウ    いす席を設ける客席の部分には、縦に並んだいす席20席以下ごと及び当該客席の部分の最前部に算定幅員以上の幅員を有する横通路を保有すること。ただし、当該通路の幅は、１メートル未満としてはならない。\nエ    ます席を設ける客席の部分には、横に並んだます席２ます以下ごとに幅40センチメートル以上の縦通路を保有すること。\nオ    アからエまでの通路は、いずれも客席の避難口（出入口を含む。以下同じ。）に直通させること。"}, {"d": "kayojo", "a": "第36条", "h": "", "t": "第36条 劇場等の屋外の客席は、次の各号に定めるところによらなければならない。\n(1)   いすは、床に固定すること。\n(2)   いす背の間隔は、75センチメートル以上とし、座席の幅は、40センチメートル以上とすること。ただし、いす背がなく、かつ、いす座が固定している場合にあっては、いす背の間隔を70センチメートル以上とすることができる。\n(3)   立見席には、奥行３メートル以下ごとに、高さ1.1メートル以上の手すりを設けること。\n(4)   客席の避難通路は、次によること。\nア    いす席を設ける客席の部分には、横に並んだいす席10席（いす背がなく、かつ、いす座が固定している場合にあっては、20席）以下ごとに、その両側に幅80センチメートル以上の通路を保有すること。ただし、５席（いす背がなく、かつ、いす座が固定している場合にあっては、10席）以下ごとに通路を保有する場合にあっては、片側のみとすることができる。\nイ    いす席を設ける客席の部分には、幅１メートル以上の通路を、各座席から歩行距離15メートル以下でその一に達し、かつ、歩行距離40メートル以下で避難口に達するように保有すること。\nウ    ます席を設ける客席の部分には、幅50センチメートル以上の通路を、各ますがその一に接するように保有すること。\nエ    ます席を設ける客席の部分には、幅１メートル以上の通路を、各ますから歩行距離10メートル以内でその一に達するように保有すること。"}, {"d": "kayojo", "a": "第36条の２", "h": "（基準の特例）", "t": "第36条の２ 前２条の規定の全部又は一部は、消防長（消防署長）が劇場等の位置、収容人員、使用形態、避難口その他の避難施設の配置等により入場者の避難上支障がないと認めるときにおいては、適用しない。"}, {"d": "kayojo", "a": "第37条", "h": "（キヤバレー等の避難通路）", "t": "第37条 キヤバレー、カフエー、ナイトクラブその他これらに類するもの（以下「キヤバレー等」という。）及び飲食店の階のうち当該階における客席の床面積が150平方メートル以上の階の客席には、有効幅員1.6メートル（飲食店にあっては1.2メートル）以上の避難通路を、客席の各部分からいす席、テーブル席又はボツクス席７個以上を通過しないで、その一に達するように保有しなければならない。"}, {"d": "kayojo", "a": "第37条の２", "h": "（ディスコ等の避難管理）", "t": "第37条の２ ディスコ、ライブハウスその他これらに類するもの（以下「ディスコ等」という。）の関係者は、非常時において、すみやかに特殊照明及び音響を停止するものとともに、避難上有効な明るさを保たなければならない。"}, {"d": "kayojo", "a": "第38条", "h": "（百貨店等の避難通路等）", "t": "第38条 百貨店等の階のうち当該階における売場又は展示場の床面積が150平方メートル以上の階の売場又は展示場には、屋外へ通ずる避難口又は階段に直通する幅1.2メートル（売場又は展示場の床面積が300平方メートル以上のものにあっては、1.6メートル）以上の主要避難通路を１以上保有しなければならない。\n２   百貨店等の階のうち当該階における売場又は展示場の床面積が600平方メートル以上の売場又は展示場には、前項の主要避難通路のほか、有効幅員1.2メートル以上の補助避難通路を保有しなければならない。\n３   百貨店等に避難の用に供することができる屋上広場を設けた場合は、当該広場を避難上有効に維持しなければならない。"}, {"d": "kayojo", "a": "第39条", "h": "（劇場等の定員）", "t": "第39条 劇場等の関係者は、次の各号に定めるところにより、収容人員の適正化に努めなければならない。\n(1)   客席の部分ごとに、次のアからウまでによって算定した数の合計数（以下「定員」という。）を超えて客を入場させないこと。\nア    固定式のいす席を設ける部分については、当該部分にあるいす席の数に対応する数。この場合において、長いす式のいす席にあっては、当該いす席の正面幅を40センチメートルで除して得た数（１未満のはしたの数は、切り捨てるものとする。）とする。\nイ    立見席を設ける部分については、当該部分の床面積を0.2平方メートルで除して得た数\nウ    その他の部分については、当該部分の床面積を0.5平方メートルで除して得た数\n(2)   客席内の避難通路に客を収容しないこと。\n(3)   一のます席には、屋内の客席にあっては７人以上、屋外の客席にあっては10人以上の客を収容しないこと。\n(4)   出入口その他公衆の見やすい場所には、当該劇場等の定員を記載した表示板を設けるとともに、入場した客の数が定員に達したときは、直ちに満員札を掲げること。"}, {"d": "kayojo", "a": "第40条", "h": "（避難施設の管理）", "t": "第40条 令別表第１に掲げる防火対象物の避難口、廊下、階段、避難通路その他避難のために使用する施設は、次に定めるところにより、避難上有効に管理しなければならない。\n(1)   避難のために使用する施設の床面は、避難に際し、つまづき、すべり等を生じないように常に維持すること。\n(2)   避難口に設ける戸は、外開きとし、開放した場合において廊下、階段等の有効幅員を狭めないような構造とすること。ただし、劇場等以外の令別表第１に掲げる防火対象物について避難上支障がないと認められる場合においては、内開き以外の戸とすることができる。\n(3)   前号の戸には、施錠装置を設けてはならない。ただし、非常時に自動的に解錠できる機能を有するもの又は屋内からかぎ等を用いることなく容易に解錠できる構造であるものにあっては、この限りでない。"}, {"d": "kayojo", "a": "第41条", "h": "（防火設備の管理）", "t": "第41条 令別表第１に掲げる防火対象物の防火設備は、防火区画の防火設備に近接して延焼の媒介となる可燃物が存置されないよう防火上有効に管理しなければならない。"}, {"d": "kayojo", "a": "第42条", "h": "（準用）", "t": "第42条 第35条から第36条の２まで及び第37条の２から前条までの規定は、体育館、講堂その他の防火対象物を一時的に劇場等、展示場又はディスコ等の用途に供する場合について準用する。\n第５章の２   屋外催しに係る防火管理"}, {"d": "kayojo", "a": "第42条の２", "h": "（指定催しの指定）", "t": "第42条の２ 消防長（消防署長）は、祭礼、縁日、花火大会その他の多数の者の集合する屋外での催しのうち、大規模なものとして消防長が別に定める要件に該当するもので、対象火気器具等（令第５条の２第１項に規定する対象火気器具等をいう。以下同じ。）の周囲において火災が発生した場合に人命又は財産に特に重大な被害を与えるおそれがあると認めるものを、指定催しとして指定しなければならない。\n２   消防長（消防署長）は、前項の規定により指定催しを指定しようとするときは、あらかじめ、当該催しを主催する者の意見を聴かなければならない。ただし、当該催しを主催する者から指定の求めがあったときは、この限りでない。\n３   消防長（消防署長）は、第１項の規定により指定催しを指定したときは、遅滞なくその旨を当該指定催しを主催する者に通知するとともに、公示しなければならない。"}, {"d": "kayojo", "a": "第42条の３", "h": "（屋外催しに係る防火管理）", "t": "第42条の３ 前条第１項の指定催しを主催する者は、同項の指定を受けたときは、速やかに防火担当者を定め、当該指定催しを開催する日の14日前までに（当該指定催しを開催する日の14日前の日以後に同項の指定を受けた場合にあっては、防火担当者を定めた後遅滞なく）次の各号に掲げる火災予防上必要な業務に関する計画を作成させるとともに、当該計画に基づく業務を行わせなければならない。\n(1)   防火担当者その他火災予防に関する業務の実施体制の確保に関すること。\n(2)   対象火気器具等の使用及び危険物の取扱いの把握に関すること。\n(3)   対象火気器具等を使用し、又は危険物を取り扱う露店、屋台その他これらに類するもの（第45条第１項において「露店等」という。）及び客席の火災予防上安全な配置に関すること。\n(4)   対象火気器具等に対する消火準備に関すること。\n(5)   火災が発生した場合における消火活動、通報連絡及び避難誘導に関すること。\n(6)   前各号に掲げるもののほか、火災予防上必要な業務に関すること。\n２   前条第１項の指定催しを主催する者は、当該指定催しを開催する日の14日前までに（当該指定催しを開催する日の14日前の日以後に前条第１項の指定を受けた場合にあっては、消防長（消防署長）が定める日までに）、前項の規定による計画を消防長（消防署長）に提出しなければならない。\n第６章 雑則"}, {"d": "kayojo", "a": "第43条", "h": "（防火対象物の使用開始の届出等）", "t": "第43条 令別表第１に掲げる防火対象物（同表(19)項及び(20)項に掲げるものを除く。）をそれぞれの用途に使用しようとするものは、使用開始の日の７日前までに、その旨を消防長（消防署長）に届け出なければならない。"}, {"d": "kayojo", "a": "第44条", "h": "（火を使用する設備等の設置の届出）", "t": "第44条 火を使用する設備又はその使用に際し、火災の発生のおそれのある設備のうち、次の各号に掲げるものを設置しようとする者は、あらかじめ、その旨を消防長（消防署長）に届け出なければならない。\n(1)    熱風炉\n(2)    多量の可燃性ガス又は蒸気を発生する炉\n(3)    前号に掲げるもののほか、据付面積２平方メートル以上の炉（個人の住居に設けるものを除く。）\n(3の2) 当該厨房設備の入力と同一厨房室内に設ける他の厨房設備の入力の合計が350キロワット以上の厨房設備\n(4)    入力70キロワット以上の温風暖房機（風道を使用しないものにあっては、劇場等及びキヤバレー等に設けるものに限る。）\n(5)    ボイラー又は入力70キロワット以上の給湯湯沸設備（個人の住居に設けるもの又は労働安全衛生法施行令（昭和47年政令第318号）第１条第３号に定めるものを除く。）\n(6)    乾燥設備（個人の住居に設けるものを除く。）\n(6の2) 簡易サウナ設備（個人が設けるものを除く。）\n(7)    一般サウナ設備（個人の住居に設けるものを除く。）\n(7の2) 入力70キロワット以上の内燃機関によるヒートポンプ冷暖房機\n(8)    火花を生ずる設備\n(8の2) 放電加工機\n(9)    高圧又は特別高圧の変電設備（全出力50キロワット以下のものを除く。）\n(10)   急速充電設備（全出力50キロワット以下のものを除く。）\n(11)   燃料電池発電設備（第８条の３第２項又は第４項に定めるものを除く。）\n(12)   内燃機関を原動力とする発電設備のうち、固定して用いるもの（第12条第４項に定めるものを除く。）\n(13)   蓄電池設備（蓄電池容量が20キロワット時以下のものを除く。）\n(14)   設備容量２キロボルトアンペア以上のネオン管灯設備\n(15)   水素ガスを充填する気球"}, {"d": "kayojo", "a": "第45条", "h": "（火災とまぎらわしい煙等を発するおそれのある行為等の届出）", "t": "第45条 次の各号に掲げる行為をしようとする者は、あらかじめ、その旨を消防長（消防署長）に届け出なければならない。\n(1)    火災とまぎらわしい煙又は火炎を発するおそれのある行為（たき火を含む。）\n(2)    煙火（がん具用煙火を除く。）の打上げ又は仕掛け\n(3)    劇場等以外の建築物その他の工作物における演劇、映画その他の催物の開催\n(4)    水道の断水又は減水\n(5)    消防隊の通行その他消火活動に支障を及ぼすおそれのある道路工事\n(6)    祭礼、縁日、花火大会、展示会その他の多数の者の集合する催しに際して行う露店等の開設（対象火気器具等を使用する場合に限る。）\n２   消防長は、前項各号に掲げるそれぞれの行為について、届出の対象となる期間及び区域を指定することができる。\nとう"}, {"d": "kayojo", "a": "第45条の２", "h": "（指定洞道等の届出）", "t": "第45条の２ 通信ケーブル又は電力ケーブル（以下「通信ケーブル等」という。）\nとうの敷設を目的として設置された洞道、共同溝その他これらに類する地下の工作物（通信ケーブル等の維持管理等のため必要に応じ人が出入りする道に限る。）\nで、火災が発生した場合に消火活動に重大な支障を生ずるおそれのあるものととうして消防長（消防署長）が指定したもの（以下「指定洞道等」という。）に通信ケーブル等を敷設する者は、次に掲げる事項を消防長（消防署長）に届け出なければならない。\nとう\n(1)    指定洞道等の経路及び出入口、換気口等の位置とう\n(2)    指定洞道等の内部に敷設されている主要な物件とう\n(3)    指定洞道等の内部における火災に対する安全管理対策\n２   前項の規定は、同項各号に掲げる事項について重要な変更を行う場合について準用する。"}, {"d": "kayojo", "a": "第46条", "h": "（指定数量未満の危険物等の貯蔵及び取扱いの届出等）", "t": "第46条 指定数量の５分の１以上（個人の住居で貯蔵し、又は取り扱う場合にあっては、指定数量の２分の１以上）指定数量未満の危険物及び別表第８で定める数量の５倍以上（再生資源燃料、可燃性固体類等及び合成樹脂類にあっては、同表で定める数量以上）の指定可燃物を貯蔵し、又は取り扱おうとする者は、あらかじめ、その旨を消防長（消防署長）に届け出なければならない。\n２   前項の規定は、同項の貯蔵及び取扱いを廃止する場合について準用する。"}, {"d": "kayojo", "a": "第47条", "h": "（タンクの水張検査等）", "t": "第47条 消防長（消防署長）は、前条第１項の届出に係る指定数量未満の危険物又は指定可燃物を貯蔵し、又は取り扱うタンクを製造し、又は設置しようとする者の申出により、当該タンクの水張検査又は水圧検査を行うことができる。"}, {"d": "kayojo", "a": "第47条の２", "h": "（防火対象物の消防用設備等の状況の公表）", "t": "第47条の２ 消防長は、防火対象物を利用しようとする者の防火安全性の判断に資するため、当該防火対象物の消防用設備等の状況が、法、令若しくはこれに基づく命令又はこの条例の規定に違反する場合は、その旨を公表することができる。\n２   消防長は、前項の規定による公表をしようとするときは、当該防火対象物の関係者にその旨を通知するものとする。\n３   第１項の規定による公表の対象となる防火対象物及び違反の内容並びに公表の手続は、規則で定める。"}, {"d": "kayojo", "a": "第48条", "h": "（委任）", "t": "第48条 この条例の実施のための手続きその他その施行について必要な事項は、管理者が定める。\n第７章 罰則"}, {"d": "kayojo", "a": "第49条", "h": "（罰則）", "t": "第49条 次の各号に該当する者は、30万円以下の罰金に処する。\n(1)   第30条の規定に違反して指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱った者\n(2)   第31条の規定に違反した者\n(3)   第33条又は第34条の規定に違反した者\n(4)   第42条の３第２項の規定に違反して、同条第１項に規定する火災予防上必要な業務に関する計画を提出しなかった者"}, {"d": "kayojo", "a": "第50条", "h": "", "t": "第50条 法人（法人でない団体で代表者又は管理人の定めのあるものを含む。以下この項において同じ。）の代表者若しくは管理人又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関して前条の違反行為をしたときは、行為者を罰するほか、その法人又は人に対しても、同条の刑を科する。\n２   法人でない団体について前項の規定の適用がある場合には、その代表者又は管理人が、その訴訟行為につき法人でない団体を代表するほか、法人を被告人又は被疑者とする場合の刑事訴訟に関する法律の規定を準用する。"}, {"d": "kayojo", "a": "附   則", "h": "", "t": "附   則\n１   この条例は、公布の日から施行する。\n２   危険物の規制に関する政令の一部を改正する政令（平成23年政令第405号。\n第５項において「改正政令」という。）による危険物の規制に関する政令第１条第１項の規定の改正により、新たに指定数量の５分の１以上指定数量未満の危険物を貯蔵し、又は取り扱う場所となるもの（以下この項から第４項までにおいて「新規対象」という。）のうち、第31条の２第２項第９号に定める基準に適合しないものの位置、構造及び設備に係る技術上の基準については、同号の規定は、当該新規対象が次に掲げる基準の全てに適合している場合に限り、適用しない。\n(1)   当該新規対象の危険物を取り扱う配管は、その設置される条件及び使用される状況に照らして、十分な強度を有し、かつ、漏れない構造であること。\n(2)   当該新規対象に係る危険物の数量を当該危険物の指定数量でそれぞれ除した商の和が、平成24年７月１日において現に貯蔵し、又は取り扱っている危険物の数量を当該危険物の指定数量でそれぞれ除した商の和を超えないこと。\n３   新規対象のうち、第31条の２第１項第16号ロに定める基準に適合しないものの貯蔵及び取扱いに係る技術上の基準については、同号の規定は、平成25年12月31日までの間は、適用しない。\n４   新規対象のうち、第31条の２第２項第１号から第８号まで、第31条の３の２（第３号を除く。）又は第31条の４第２項（第１号、第10号及び第11号を除く。）\nに定める基準に適合しないものの位置、構造及び設備に係る技術上の基準については、これらの規定は、当該新規対象が第３項第２号に掲げる基準に適合している場合に限り、平成25年６月30日までの間は、適用しない。\n５   改正政令による危険物の規制に関する政令第１条第１項の規定の改正により新たに指定数量の５分の１以上（個人の住居で貯蔵し、又は取り扱う場合にあっては、指定数量の２分の１以上）指定数量未満の危険物を貯蔵し、又は取り扱うこととなる者は、平成24年12月31日までにその旨を消防長（消防署長）に届け出なければならない。"}, {"d": "kayojo", "a": "附   則（昭和48年３", "h": "", "t": "附   則（昭和48年３月17日条例第３号）\n（施行期日）\n１   この条例は、昭和48年６月１日から施行する。ただし、第49条の改正規定（同条第２項の規定に係る改正部分に限る。）は公布の日から、第３条第１項の改正規定（同項第17号リからワまでの規定に係る改正部分に限る。）、第４条第１項第２号の改正規定、第７条第１項に１号を加える改正規定、第７条の次に１条を加える改正規定及び第30条の次に１条を加える改正規定（第31条第31号イ、ト、リ及びヌ、第22号ロ、ニ及びホ並びに第23号の規定として加える部分に限る。）は昭和48年９月１日から、第８条の次に１条を加える改正規定（第８条の２第１項第３号の規定として加える部分に限る。）及び第30条の次に１条を加える改正規定（第31条第２号の規定として加える部分に限る。）は昭和49年６月１日から施行する。\n（経過措置）\n２   昭和48年６月１日において現に使用されている燃料タンク及び危険物を貯蔵し、又は取り扱うタンクに係る基準については、改正後の揖斐郡消防組合火災予防条例（以下「新条例」という。）第３条第１項第17号及び第31条第21号から第23号までの規定にかかわらず、なお従前の例による。\n３   昭和48年６月１日において現に使用されている液体燃料を使用する移動式のストーブについては、新条例第18条第２項の規定は、昭和52年６月１日までの間、適用しない。\n４   この条例の施行前にした行為に対する罰則の適用については、なお従前の例による。"}, {"d": "kayojo", "a": "附   則（昭和49年４", "h": "", "t": "附   則（昭和49年４月１日条例第17号）\nこの条例は、公布の日から施行する。"}, {"d": "kayojo", "a": "附   則（昭和55年２", "h": "", "t": "附   則（昭和55年２月19日条例第２号）\n１   この条例は、昭和55年４月１日から施行する。\n２   この条例施行の際、現に存する建築物のうち、現にその屋内において合成樹脂類（改正後の揖斐郡消防組合火災予防条例（以下「新条例」という。）別表第４の備考５に規定する合成樹脂類をいう。以下同じ。）を貯蔵し、又は取り扱っているものについては、新条例第34条第５号ハの規定は、この条例施行の日から起算して２年を経過するまでの間は、適用しない。\n３   この条例施行の際、現に合成樹脂類を貯蔵し又は取り扱っている者に対する新条例第46条の規定の適用については、同条中「あらかじめ」とあるのは、「昭和55年４月１日から30日以内に」とする。\n４   この条例の施行前にした行為に対する罰則の適用については、なお従前の例による。"}, {"d": "kayojo", "a": "附   則（昭和59年２", "h": "", "t": "附   則（昭和59年２月24日条例第１号）\n１   この条例は、昭和59年４月１日から施行する。\n２   改正後の揖斐郡消防組合火災予防条例（以下「新条例」という。）第３条の２第１項第１号ハの規定は、この条例の施行後に設置される別表第３から別表第６までに掲げる気体燃料又は液体燃料を使用するふろがまについて適用し、この条例の施行前に設置されている当該ふろがまについては、なお従前の例による。\n３   この条例施行の際、現に常圧下において可燃性ガスを大気中に滲出する
