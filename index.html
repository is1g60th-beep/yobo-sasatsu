るものを含む。）をいう。\nア    引火点が40度以上100度未満のもの\nイ    引火点が70度以上100度未満のもの\nウ    引火点が100度以上200度未満で、かつ、燃焼熱量が34キロジュール毎グラム以上であるもの\nエ    引火点が200度以上で、かつ、燃焼熱量が34キロジュール毎グラム以上であるもので、融点が100度未満のもの\n(7)   石炭・木炭類には、コークス、粉状の石炭が水に懸濁しているもの、豆炭、練炭、石油コークス、活性炭及びこれらに類するものを含む。\n(8)   可燃性液体類とは、法別表第１備考第14号の総務省令で定める物品で液体であるもの、同表備考第15号及び第16号の総務省令で定める物品で１気圧において温度20度で液状であるもの、同表備考第17号の総務省令で定めるところにより貯蔵保管されている動植物油で１気圧において温度20度で液状であるもの並びに引火性液体の性状を有する物品（１気圧において、温度20度で液状であるものに限る。）で１気圧において引火点が250度以上のものをいう。\n(9)   合成樹脂類とは、不燃性又は難燃性でない固体の合成樹脂製品、合成樹脂半製品、原料合成樹脂及び合成樹脂くず（不燃性又は難燃性でないゴム製品、ゴム半製品、原料ゴム及びゴムくずを含む。）をいい、合成樹脂の繊維、布、紙及び糸並びにこれらのぼろ及びくずを除く。"}, {"d": "kayoki", "a": "冒頭", "h": "", "t": "○揖斐郡消防組合火災予防規則昭和45年４月１日規則第４号改正昭和48年３月１日規則第１号昭和49年４月１日規則第４号昭和59年４月20日規則第１号昭和62年３月15日規則第１号平成４年６月１日規則第１号平成14年10月25日規則第３号平成17年10月24日規則第５号平成24年２月１日規則第２号平成24年２月14日規則第４号平成24年９月18日規則第５号平成26年２月17日規則第１号平成26年７月16日規則第２号平成28年８月15日規則第４号平成30年１月30日規則第１号令和元年９月２日規則第２号令和３年１月20日規則第１号令和３年３月17日規則第２号令和５年10月30日規則第10号"}, {"d": "kayoki", "a": "第１条", "h": "（目的）", "t": "第１条 この規則は、消防法（昭和23年法律第186号。以下「法」という。）消防法施行令（昭和36年政令第37号。以下「令」という。）及び消防法施行規則（昭和36年自治省令第６号。以下「規則」という。）並びに揖斐郡消防組合火災予防条例（昭和45年条例第16号。以下「条例」という。）\nの施行に関して必要な事項を定めることを目的とする。"}, {"d": "kayoki", "a": "第２条", "h": "（立入証票）", "t": "第２条 法第４条第２項（法第16条の３の２第３項、法第16条の５第３項及び法第34条第２項において準用される場合を含む。）に規定する立入のための証票は、別記第１の様式のとおりとする。"}, {"d": "kayoki", "a": "第２条の２", "h": "（措置命令等を発した場合の公示方法）", "t": "第２条の２ 法第５条第３項（法第５条の２第２項、法第５条の３第５項、法第８条第５項（法第36条第１項において準用する場合を含む。）、法第８条の２第７項（法第36条第１項において準用する場合を含む。）、法第８条の３の５第４項又は法第17条の４第３項において準用する場合を含む。）の規定により設置する標識の様式は、別記第１の２のとおりとする。\n２    規則第１条に規定する市町村長が定める方法は、揖斐郡消防組合 公告式条例(昭和45年条例第３号)に規定する告示の例による。"}, {"d": "kayoki", "a": "第２条の３", "h": "（防火対象物の点検基準）", "t": "第２条の３ 規則第４条の２の６第１項第９号の規定により管理者が定める基準は、次に掲げるものとする。\n（１）      火を使用する設備及びその使用に際し、火災の発生のおそれのある設備（以下「火を使用する設備等」という。）が条例第３条から第10条の２まで及び第17条の２の規定に従って設置され、及び適切に管理されていること。\n（２）      前号の規定にかかわらず、現に条例第17条の３の規定が適用されている火を使用する設備等にあっては、引き続き、消防長が同条の規定の適用を認めた状況で設置及び管理されていること。\n（３）    火を使用する器具及びその使用に際し、火災の発生のおそれのある器具（以下「火を使用する器具等」という。）が条例第18条から第22条までの規定に従って取扱いされていること。\n（４）    前号の規定にかかわらず、現に条例第22条の２の規定が適用されている火を使用する器具等にあっては、引き続き、消防長が同条の規定の適用を認めた状況で取扱いされていること。\n（５）       条例第23条及び第26条から第28条までの規定を遵守していること。\n（６）    条例第30条から第31条の８までの規定により指定数量未満の危険物が貯蔵及び取扱されていること。\n（７）       条例第33条及び第34条の規定により指定可燃物が貯蔵及び取扱されていること。\n（８）    前２号の規定にかかわらず、現に条例第34条の３の規定が適用されている指定数量未満の危険物及び指定可燃物にあっては、引き続き消防長が同条の規定の適用を認めた状況で貯蔵及び取扱されていること。"}, {"d": "kayoki", "a": "第３条", "h": "（火災警報）", "t": "第３条 法第22条第３項の火災に関する警報は、火災予防上、消防長が危険であると認め、かつ、気象の状況が次の各号のいずれかであるときに発令する。\n(１)   実効湿度55パーセント以下で、最低湿度30パーセント以下であるとき。\n(２)   実効湿度60パーセント以下で最低湿度35パーセント以下であって、かつ、現に風速10メートル以上であり、又は風速10メートル以上になると予想されるとき。\n(３)   現に、風速12メートル以上であるとき、又は風速12メートル以上になると予想されるとき。\n２   前項第３号の場合において、降雨若しくは降雪のとき、又は実効湿度70パーセント以上で、最低湿度50パーセント以上であるときは、前項の規定を適用しない。ただし台風時はこの限りでない。\n３   発令した火災に関する警報は、火災予防上、消防長がその必要がないと認めたときに解除する。"}, {"d": "kayoki", "a": "第４条", "h": "（火気制限）", "t": "第４条 法第23条に規定する火気使用の制限は、消防長が告示し、制札によりその旨を表示する。\n（劇場等における喫煙等の禁止場所の指定等)"}, {"d": "kayoki", "a": "第４条の２", "h": "", "t": "第４条の２ 条例第23条第１項に規定する喫煙、裸火の使用又は火災予防上危険な物品の持ち込みを禁止する場所の指定は、消防長が告示して行うものとする。\n２   条例第23条第1項に規定する火災予防上危険な物品は、次に掲げるものとする。ただし、通常携帯するもので軽易なものについては、この限りでない。\n（１）    法別表第１に掲げる危険物\n（２） 危険物の規則に関する政令（昭和34年政令第306号）別表第４に掲げる指定可燃物のうちぼろ及び紙くず（動植物油がしみ込んでいる布又は紙及びこれらの製品に限る。）、可燃性固体類並びに可燃性液体類\n（３）    一般高圧ガス保安規則（昭和41年通商産業省第53号）第２条第１号に定める可燃性ガス\n（４）    火薬類取締法（昭和25年法律第149号）第２条に定める火薬類\n３   条例第23条第１条ただし書の規定により、喫煙等について承認を受けようとする者は、禁止行為の解除承認申請書（別記第１号の３）を消防長に提出しなければならない。\n４   消防長は、前項の申請書を受けたときは、その内容を審査し、火災予防上支障がないと認めたときは、承認することができる。"}, {"d": "kayoki", "a": "第５条", "h": "（通報場所）", "t": "第５条 法第24条第１項の規定による火災の通報場所は、揖斐郡消防組合消防本部並びに消防署の分署とする。"}, {"d": "kayoki", "a": "第６条", "h": "（許可の証票）", "t": "第６条 法第28条第１項の規定に基づく規則第48条第１項第７号の立入許可の証票は、別記第２の\n様式のとおりとする。\n２   前項の証票は、次の各号に掲げるうち、特に必要があると認められる者に対して発行する。この場合において、証票の交付を受けようとする者は、別記第３の様式による交付願を消防長に提出しなければならない。\n(１)   官公署の職員\n(２)   火災保険の職員\n(３)   前２号のほか、災害に関係のある公益事業の従事者"}, {"d": "kayoki", "a": "第７条", "h": "（講習会の修了証及び資格証明）", "t": "第７条 令第３条第１項に規定する消防長の行う防火管理に関する講習会の課程を修了した者に交付する修了証書は、別記第４の様式のとおりとする。\n２   規則第４条第２項に規定する防火管理者の資格を証する書面の交付を受けようとする者は、別記第５の様式による防火管理者資格証明書交付願（２通）を消防長に提出しなければならない。"}, {"d": "kayoki", "a": "第７条の２", "h": "（火災予防上必要な業務に関する計画提出書の提出）", "t": "第７条の２ 条例第42条の３第２項に規定する火災予防上必要な業務に関する計画提出書の提出は、"}, {"d": "kayoki", "a": "別記第５の２の様式の提出", "h": "", "t": "別記第５の２の様式の提出書を、消防長（消防署長）に提出しなければならない。"}, {"d": "kayoki", "a": "第８条", "h": "（防火対象物の使用開始の届出）", "t": "第８条 条例第43条の規定による防火対象物の使用開始の届出は、別記第６の届出書に次の各号に掲げる書類を添えて、消防長（消防署長）に届け出なければならない。\n(１)   防火対象物の配置図\n(２)   各階平面図\n(３)   消防用設備等の設計図書（消火器具、避難器具等の配置図を含む。）\n(４)   防火対象物棟別概要追加書類別記第６の１（同一敷地内に２以上の棟がある場合）"}, {"d": "kayoki", "a": "第９条", "h": "（消防用設備等の工事計画の届出）", "t": "第９条 前条の届出をするものは、その届出に係る防火対象物の建築、大規模の改装又は用途変更の場合における消防用設備等の工事計画を、消防長に関係図面を添えて、別記第７の様式により届け出なければならない。\n２   消防長は前項の届出につき工事計画が、法、令、規則若しくは条例又はその他の消防に関する定めに適合しているかを審査する。\n３   第１項の届出は、工事の着手前に行わなければならない。"}, {"d": "kayoki", "a": "第10条", "h": "（火を使用する設備等の設置の届出）", "t": "第10条 条例第44条に規定する設備の設置の届出は、同条各号の設備に対応する次の各号の様式に当該設備の設計図書を添えて、消防長（消防署長）に届け出なければならない。ただし、同条第14号にあっては、設置場所附近の見取図、気球の見取図及び電飾の配電図（電飾を付設するものに限る。）を添付すること。\n(１)   第１号から第８号までの設備       別記第８\n(２)   第９号から第12号までの設備      別記第９\n(３)   第13号の設備   別記第10\n(４)   第14号の設備   別記第11"}, {"d": "kayoki", "a": "第11条", "h": "（火災とまぎらわしい煙等を発するおそれのある行為等の届出）", "t": "第11条 条例第45条に規定する行為の届出は、同条各号の行為に対応する次の各号の様式に、その区域及び場所の略図を添えて、消防長（消防署長）に届け出なければならない。ただし、条例第45条第１号から第５号までの行為について、緊急を要する場合及びその内容が軽易な事項である場合にあっては、口頭をもって届け出ることができる。\n(１)   第１号の行為    別記第12\n(２)   第２号の行為    別記第13\n(３)   第３号の行為    別記第14\n(４)   第４号の行為    別記第15\n(５)   第５号の行為    別記第16\n(６)   第６号の行為    別記第16の２"}, {"d": "kayoki", "a": "第12条", "h": "（指定数量未満の危険物等の貯蔵又は取扱いの届出）", "t": "第12条 条例第46条の規定による指定数量未満の危険物等の貯蔵又は取扱いの届出は、別記第17の\n様式に、貯蔵又は取扱いの場所の見取図を添えて、消防長（消防署長）に届け出なければならない。\n２   前項の規定は、同項の貯蔵及び取扱いを廃止する場合は、別記第18の様式により届けなければならない。"}, {"d": "kayoki", "a": "第13条", "h": "（指定洞道等の届出）", "t": "第13条 条例第45条の２第１項及び第２項の規定による指定洞道等の届出及びその変更の届出は、指定洞道等（新規・変更）届出書（別記第19号様式）によるものとする。\n２   前項の届出書には、次に掲げる図書を添付しなければならない。ただし、変更の届出にあっては、変更する事項以外の図書の添付を省略することができる。\n(１)    指定洞道等の経路、出入口及び換気口等の位置を記載した経路概略図\n(２)    指定洞道等の内部に敷設されている通信ケーブル等、消火設備、電気設備、換気設備、連絡電話設備、排水設備、防水設備、金物設備その他主要な設備の概要書\n(３)    指定洞道等の内部における火災に対する次の安全対策を記載した図書\nア   通信ケーブル等の難燃措置に関すること。\nイ   火気を使用する工事又は作業を行う場合の火気管理及び喫煙管理等の出火防止に関すること。\nウ   火災発生時における延焼拡大防止、早期発見、初期消火、通報連絡、避難及び消防隊への提供に関すること。\nエ   職員及び作業員の教育訓練に関すること。\nオ   その他安全管理に関すること。\n３   条例第45条の２第２項に規定する重要な変更とは、消防長が指定する洞道等の経路の変更、出入口又は換気口等の新設又は撤去、通信ケーブル等の難燃措置の実施その他安全管理対策等の大幅な変更とする。"}, {"d": "kayoki", "a": "第13条の２", "h": "（検査の申請）", "t": "第13条の２ 条例第47条の規定によるタンクの水張又は水圧検査を受けようとする者は、水張・水圧検査申請書（別記第20）に、当該検査を受けようとするタンクの構造図面を添えて消防長に申請しなければならない。\n２   消防長は、前項の規定による申請があったときは、タンクの水張又は水圧検査を行い、その結果が条例第31条の４から第31条の６まで及び第33条第３項に定める技術上の基準（水張又は水圧試験に関する部分に限る。）に適合すると認めたときは、当該検査の申請をした者に少量危険物等タンク検査済証（別記第21）を交付するものとする。"}, {"d": "kayoki", "a": "第13条の３", "h": "（検査済証の再交付）", "t": "第13条の３ 検査済証の交付を受けた者が、当該検査済証を亡失し、汚損し、又は破損したときは、再交付申請書（別記第22）により、理由書を添えて消防長に再交付の申請を行い、その再交付を受けることができるものとする。\n２   検査証の汚損又は破損により前項の申請をするときは、申請書に当該汚損又は破損した検査済証を添付しなければならない。\n３   検査済証を亡失してその再交付を受けた者は、亡失した検査済証を発見したときは、これを速やかに消防長に返納しなければならない。"}, {"d": "kayoki", "a": "第14条", "h": "（標識及び表示）", "t": "第14条 条例の規定により設ける標識及び表示は、別表によるものとする。"}, {"d": "kayoki", "a": "第15条", "h": "（公表の対象となる防火対象物及び違反の内容）", "t": "第15条 条例第47条の２第３項の規定による公表の対象となる防火対象物は、令別表第１（１）項から（４）項まで、（５）項イ、（６）項、（９）項イ、（16）項イ、（16の２）項及び（16の３）項に掲げる防火対象物で、法第17条第１項の政令で定める技術上の基準に従って屋内消火栓設備、スプリンクラー設備又は自動火災報知設備を設置しなければならないもののうち、法第４条第１項に規定する立入検査においてこれらの消防用設備等が設置されていないと認められたものとする。\n２   条例第47条の２第３項の規定による公表の対象となる違反の内容は、前項の防火対象物に屋内消火栓設備、スプリンクラー設備又は自動火災報知設備が設置されていないこととする。"}, {"d": "kayoki", "a": "第16条", "h": "（公表の手続）", "t": "第16条 条例第47条の２第１項の公表は、前条第１項の立入検査の結果を通知した日から14日を経過した日において、なお、当該立入検査の結果と同一の違反内容が認められる場合に、当該違反が是正されたことを確認できるまでの間、揖斐郡消防組合ホームページへの掲載により行う。\n（１）      前条第２項に規定する違反が認められた防火対象物の名称及び所在地\n（２）      前条第２項に規定する違反の内容（当該違反が認められた防火対象物の部分を含む。）\n（３）      その他消防長が必要と認める事項"}, {"d": "kayoki", "a": "附    則この規則は、", "h": "", "t": "附    則この規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附    則（昭和48年", "h": "", "t": "附    則（昭和48年３月１日規則第１号）\n（規則の廃止）\n１   揖斐郡消防組合消防職員立入検査証票規則（昭和45年規則第７号）は、廃止する。\n（施行期日）\n２   この規則は、昭和48年３月１日から施行する。"}, {"d": "kayoki", "a": "附    則（昭和49年", "h": "", "t": "附    則（昭和49年４月１日規則第４号）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附    則（昭和59年", "h": "", "t": "附    則（昭和59年４月20日規則第１号）\n１   この規則は、昭和59年５月10日から施行する。\n２   この規則の施行の際、現に設けられている標識及び表示で別表に違反していないものは、この規則の当該規定に基づいて設置されたものとみなす。"}, {"d": "kayoki", "a": "附   則（昭和62年３", "h": "", "t": "附   則（昭和62年３月15日規則第１号）\nこの規則は、昭和62年４月１日から施行する。"}, {"d": "kayoki", "a": "附   則（平成４年６月", "h": "", "t": "附   則（平成４年６月１日規則第１号）\nこの規則は、平成４年６月１日から施行する。"}, {"d": "kayoki", "a": "附   則（平成14年1", "h": "", "t": "附   則（平成14年10月25日規則第３号）\n（施行期日）\nこの規則は、平成14年10月25日から施行する。"}, {"d": "kayoki", "a": "附   則（平成17年1", "h": "", "t": "附   則（平成17年10月24日規則第５号）\nこの規則は、平成17年10月１日から施行する。"}, {"d": "kayoki", "a": "附   則（平成24年２", "h": "", "t": "附   則（平成24年２月１日規則第２号）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（平成24年２", "h": "", "t": "附   則（平成24年２月14日規則第４号）\n（施行期日）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（平成24年９", "h": "", "t": "附   則（平成24年９月18日規則第５号）\n（施行期日）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（平成26年２", "h": "", "t": "附   則（平成26年２月17日規則第１号）\n（施行期日）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（平成26年７", "h": "", "t": "附   則（平成26年７月16日規則第２号）\n（施行期日）\nこの規則は、平成26年８月１日から施行する。"}, {"d": "kayoki", "a": "附   則（平成28年８", "h": "", "t": "附   則（平成28年８月15日規則第４号）\n（施行期日）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（平成30年１", "h": "", "t": "附   則（平成30年１月30日規則第１号）\n（施行期日）\nこの規則は、平成31年４月１日から施行する。ただし、第14条及び別表の改正規定は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（令和元年９月", "h": "", "t": "附   則（令和元年９月２日規則第２号）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（令和３年１月", "h": "", "t": "附   則（令和３年１月20日規則第１号）\n（施行期日）\nこの規則は、令和３年４月１日から施行する。"}, {"d": "kayoki", "a": "附   則（令和３年３月", "h": "", "t": "附   則（令和３年３月17日規則第２号）\nこの規則は、公布の日から施行する。"}, {"d": "kayoki", "a": "附   則（令和５年10", "h": "", "t": "附   則（令和５年10月30日規則第10号）\nこの規則は、令和６年１月１日から施行する。"}, {"d": "kayoki", "a": "別表（第14条関係）", "h": "", "t": "別表（第14条関係）\n標識及び表示板の表示方法寸法              色根拠条文              表示文字幅 ㎝    長さ yoki", "a": "別記第６", "h": "", "t": "別記第６"}, {"d": "kayoki", "a": "別記第６の１", "h": "", "t": "別記第６の１"}, {"d": "kayoki", "a": "別記第７", "h": "", "t": "別記第７"}, {"d": "kayoki", "a": "別記第８", "h": "", "t": "別記第８"}, {"d": "kayoki", "a": "別記第９", "h": "", "t": "別記第９"}, {"d": "kayoki", "a": "別記第 10", "h": "", "t": "別記第 10"}, {"d": "kayoki", "a": "別記第 11", "h": "", "t": "別記第 11"}, {"d": "kayoki", "a": "別記第 12", "h": "", "t": "別記第 12"}, {"d": "kayoki", "a": "別記第 13", "h": "", "t": "別記第 13"}, {"d": "kayoki", "a": "別記第 14", "h": "", "t": "別記第 14"}, {"d": "kayoki", "a": "別記第 15", "h": "", "t": "別記第 15"}, {"d": "kayoki", "a": "別記第 16", "h": "", "t": "別記第 16"}, {"d": "kayoki", "a": "別記第 16 の２", "h": "", "t": "別記第 16 の２"}, {"d": "kayoki", "a": "別記第 17", "h": "", "t": "別記第 17"}, {"d": "kayoki", "a": "別記第 18", "h": "", "t": "別記第 18"}, {"d": "kayoki", "a": "別記第 19", "h": "", "t": "別記第 19"}, {"d": "kayoki", "a": "別記第 20", "h": "", "t": "別記第 20"}, {"d": "kayoki", "a": "別記第 21", "h": "", "t": "別記第 21"}, {"d": "kayoki", "a": "別記第 22", "h": "", "t": "別記第 22"}, {"d": "kayosaki", "a": "冒頭", "h": "", "t": "○揖斐郡消防組合火災予防査察規程平成６年11月25日消防長訓令第１号改正平成14年９月６日消防長訓令第２号平成21年３月19日消防長訓令第４号平成28年８月１日消防長訓令第３号"}, {"d": "kayosaki", "a": "第１条", "h": "（趣旨）", "t": "第１条 この規程は、別に定めがある場合のほか、消防法（昭和23年法律第186号。以下「法」という。）第４条第１項及び第16条の５第１項の規定に基づいて行う立入検査（以下「査察」という。）\nを執行するために必要な事項を定めるものとする。"}, {"d": "kayosaki", "a": "第２条", "h": "（防火対象物の区分）", "t": "第２条 防火対象物（以下「査察対象物」という。）を次のように区分する。\n(１)   第１種査察対象物\n(２)   第２種査察対象物\n(３)   第３種査察対象物\n(４)   第４種査察対象物\n(５)   第５種査察対象物\n２    前項各号の査察対象物の範囲は、別表第１のとおりとする。"}, {"d": "kayosaki", "a": "第３条", "h": "（査察の区分）", "t": "第３条 査察を分けて、定期査察、臨時査察及び特別査察とする。"}, {"d": "kayosaki", "a": "第４条", "h": "（定期査察）", "t": "第４条 定期査察は、第２条第１項各号に掲げる防火対象物について、計画的に行う査察とする。"}, {"d": "kayosaki", "a": "第５条", "h": "（臨時査察）", "t": "第５条 臨時査察は、個々の防火対象物の位置、構造、設備又は管理の状況等について、関係者から防火上又は防災上の要求があった場合、その他消防長が特に必要と認めた場合において行う査察とする。"}, {"d": "kayosaki", "a": "第６条", "h": "（特別査察）", "t": "第６条 特別査察は、特定の業態の査察対象物若しくは特定の区域内にある査察対象物について、消防長が、火災予防上必要があると認め、又は火災等が発生したならば人命に危険があると認めて、消防署長（消防本部職員が査察する場合にあっては予防課長をいう。以下同じ。）に査察の実施を命じた場合において行う査察とする。"}, {"d": "kayosaki", "a": "第７条", "h": "（査察の主体）", "t": "第７条 第２条に規定する対象物の査察の主体は、次の各号に定めるところによる。\n(１)   第１種査察対象物は、消防署予防係員（以下「予防係員」という。）が行う。\n(２)   第２種査察対象物は、消防署予防係以外のすべての消防署員（以下「消防係員」という。）\nが行う。\n(３)   第３種査察対象物は、消防係員が行う。\n(４)   第４種査察対象物は、消防係員が行う。\n(５)   第５種査察対象物は、予防係員及び消防係員が行う。\n２    前項の査察対象物の受持ち区分及び割振りは、消防署長が別に定めるものとする。\n３    消防本部予防課長は、新たに査察対象物ができ使用が開始された場合若しくは査察に係る許認可及び届出等の書類が受理された場合は、速やかにその旨を消防署長に通知するものとする。\n４    消防長は、査察対象物の位置、構造及び設備の状況等により、特に必要があると認める場合、第１項及び第２項の規定にかかわらず、当該査察を、消防本部予防課員に行わせることができる。"}, {"d": "kayosaki", "a": "第８条", "h": "（査察の回数）", "t": "第８条 第４条に規定する定期査察の回数は、別表第２のとおりとする。"}, {"d": "kayosaki", "a": "第９条", "h": "（査察計画）", "t": "第９条 消防署長は、第４条の定期査察を適正かつ円滑に実施するため、あらかじめ年間査察計画を様式第１号により樹立し、毎年12月15日までに消防長に報告しなければならない。"}, {"d": "kayosaki", "a": "第10条", "h": "（査察事項）", "t": "第10条 査察は、火災の予防又は災害の防止及び火災又は災害に関連する人命の安全を主眼とし、査察対象物の状況に応じ、次の各号に掲げるものの位置、構造、設備及び管理の状況等について行うものとする。\n(１)   建築物その他の工作物及び舟車\n(２)   火気使用設備及び器具\n(３)   電気関係施設及び器具\n(４)   消防用設備等\n(５)   危険物及び指定可燃物等\n(６)   ガス関係施設及び器具\n(７)   放射性物質関係施設等\n(８)    防火管理者、防災管理者、統括防火管理者、統括防災管理者、統括管理者、危険物取扱者、危険物保安監督者及び危険物施設保安員の業務遂行状況\n(９)    防火管理に係る消防計画、防災管理に係る消防計画、防火管理に係る全体についての消防計画、防災管理に係る全体についての消防計画、自衛消防組織及び予防規程並びに消防訓練実施の状況\n(10)   防炎物品の使用状況\n(11)   その他火災予防上又は災害防止上必要と認める事項"}, {"d": "kayosaki", "a": "第11条", "h": "（査察執行上の遵守事項）", "t": "第11条 査察に従事する消防職員（以下「査察員」という。）は、常に関係法令、その他査察に必要な知識の習得を図り、査察能力の向上に努めるとともに、査察にあたっては、法第４条及び法"}, {"d": "kayosaki", "a": "第16条の５", "h": "", "t": "第16条の５ の規定によるほか、次の各号を遵守しなければならない。\n(１)    査察対象物の関係者及び防火管理者等責任のある者の立ち会いを求めて行うこと。\n(２)    正当な理由がなく査察を拒み、妨げ、または忌避する者があるときは、その旨を上司に報告し、指示を受けること。\n(３)    査察終了時には、その結果及び改善事項等を関係者に対し、具体的に説明をし、指導すること。\n(４)    関係者等の民事的紛争には関与しないこと。"}, {"d": "kayosaki", "a": "第12条", "h": "（事前通告）", "t": "第12条 査察のため事前通告を必要と認めるときは、口頭によるもののほか、必要に応じ、事前通告書（様式第２号）により行うものとする。"}, {"d": "kayosaki", "a": "第13条", "h": "（査察結果通知書等）", "t": "第13条 査察員は査察の結果、査察対象物の位置、構造、設備及び管理の状況等に不備欠陥事項を認めたときは、関係者に対して立入検査結果通知書（様式第３号。ただし移動タンク貯蔵所にあっては様式第３号の２、危険物運搬車両にあっては様式第３号の３及び指定数量未満の危険物運搬車両等にあっては様式第３号の４による。以下同じ。）を交付するとともに、その写しにより消防長に報告しなければならない。\n２     前項の査察結果通知書を交付した場合において、必要があると認めるときは、提出期限を定めて、関係者から改修（計画）報告書（様式第４号）をそれぞれ提出させるものとする。"}, {"d": "kayosaki", "a": "第14条", "h": "（勧告書等）", "t": "第14条 消防長又は消防署長は、前条の不備欠陥事項が改善されない場合又は火災予防上若しくは災害防止上必要があると認める場合は、関係者に対して勧告書（様式第５号）を交付するとともに、その写しに関係者から受領印を徴し、保管するものとする。\n２    前項の勧告書を交付した場合には、関係者から再度前条による「改修（計画）報告書」を提出させるものとする。\n３    第１項の勧告書が交付されたとき、消防署長はその経過状況を確認するとともに、勧告事項が早期に改善されるよう、指導しなければならない。"}, {"d": "kayosaki", "a": "第15条", "h": "（違反の処理）", "t": "第15条 前条の場合において、関係者が勧告事項を無視し、その状態が継続する場合又は違反の事実が重大であると認める場合は、警告、命令、その他関係法令に規定する違反処理に従い処理するものとする。"}, {"d": "kayosaki", "a": "第16条", "h": "（資料提出等）", "t": "第16条 査察に際し、資料を提出させる必要がある場合は、関係者に対し任意に資料の提出を求めるものとする。\n２    消防長又は消防署長は、前項の任意の提出によりがたい場合は、法第４条第１項又は法第16条の５第１項の規定に基づき資料提出命令書（様式第６号）を交付して行う。なお、この場合にあっては、資料提出書（様式第６号の２）により提出させるものとする。\n３    前２項により資料の提出があった場合において、関係者から当該資料の返還を求められたときは、関係者に提出資料保管書（様式第６号の３）を交付するものとする。\n４    前項の規定により交付した保管書は、提出資料を返還の際返付させなければならない。"}, {"d": "kayosaki", "a": "第17条", "h": "", "t": "第17条 前条第２項の規定による資料の提出があったときは、提出資料経過簿（様式第６号の４）\nに必要事項を記載し、処理経過を明らかにしておかなければならない。"}, {"d": "kayosaki", "a": "第18条", "h": "（査察の結果報告等）", "t": "第18条 消防署長は、第４条、第５条及び第６条の規定による査察の実施結果を、毎年度４半期ごとに、査察実施結果表（様式第７号）により、それぞれの最終月の翌月10日までに取りまとめ、消防長に報告しなければならない。\n２    消防署長は、第６条の規定による特別査察を行ったときは、前項の規定による報告のほか、別に指定する様式により、速やかに、消防長に報告しなければならない。"}, {"d": "kayosaki", "a": "第19条", "h": "（特異事項等の報告）", "t": "第19条 消防署長は、査察事務に関し重要又は特異な事項があったときは、速やかに消防長に報告しなければならない。"}, {"d": "kayosaki", "a": "第20条", "h": "（防火対象物台帳等）", "t": "第20条 消防署長は、防火対象物台帳（様式第８号。危険物施設にあっては、様式第８号の２～様式第８号の10。）を作成し、備付しておかなければならない。\n２    査察員は、前項の台帳に必要事項を記載しておくとともに、記載内容に変更があったときは、速やかに訂正する等適切な管理をしなければならない。\n３    査察員は、査察を実施した場合、当該防火対象物台帳の末尾に添付の事務処理経過記録表（様式第９号）に必要事項を記載し、その経過状況を明らかにしておかなければならない。"}, {"d": "kayosaki", "a": "附 則この規程は、平成６", "h": "", "t": "附 則この規程は、平成６年12月１日から施行する。"}, {"d": "kayosaki", "a": "附 則（平成14年９月６", "h": "", "t": "附 則（平成14年９月６日消防長訓令第２号）\nこの規程は、平成14年９月６日から施行する。"}, {"d": "kayosaki", "a": "附 則（平成21年３月1", "h": "", "t": "附 則（平成21年３月19日消防長訓令第４号）\nこの規程は、平成21年４月１日から施行する。"}, {"d": "kayosaki", "a": "附 則（平成28年８月１", "h": "", "t": "附 則（平成28年８月１日消防長訓令第３号）\nこの規程は、平成28年８月１日から施行する。"}, {"d": "kayosaki", "a": "別表第１（第２条関係）", "h": "", "t": "別表第１（第２条関係）\n査察対象物の区分                         査察対象物の範囲\n第１ 第１種査察対象物 特定防火対象物で、次に掲げるもの\n１    消防法施行令（昭和36年政令第37号。以下「令」という。）第３条第１項第１号に規定する甲種防火対象物\n２       令第21条による自動火災報知設備の設置が必要とする規模以上の防火対象物\n第２ 第２種査察対象物 特定防火対象物以外の防火対象物で、次に掲げるもの\n１    令第３条第１項第１号に規定する甲種防火対象物\n２       令第21条による自動火災報知設備の設置が必要とする規模以上の防火対象物\n第３ 第３種査察対象物 前記第１及び第２に掲げる防火対象物以外の防火対象物で、次に掲げるもの\n１    危険物製造所等\n２   高圧ガス関係施設等\n第４ 第４種査察対象物 前記第１、第２及び第３に掲げる防火対象物以外の防火対象物で、次に掲げるもの\n１   令第３条第１項第２号に規定する乙種防火対象物\n２   令第10条により消火器具の設置を必要とする規模以上の防火対象物\n３   少量危険物取扱所等\n４   消防長が火災予防上危険と認めて特に指定した防火対象物\n第５ 第５種査察対象物 前記各欄に掲げる防火対象物以外のすべての防火対象物備考\n１    危険物製造所等とは、法第10条に規定する危険物の製造所、貯蔵所又は取扱所をいう。\n２    高圧ガス関係施設等とは、危険物の規制に関する政令（昭和34年政令第306号。以下「危険物政令」という。）第１条の10に規定する数量以上の圧縮アセチレンガス、無水硫酸、液化石油ガス、生石灰、毒物若しくは劇物を貯蔵し、又は取り扱う場所をいう。\n３    少量危険物取扱所等とは、条例（昭和45年条例第16号。以下同じ。）第46条に規定する少量危険物取扱所又は条例別表第８に掲げる数量以上の指定可燃物等を貯蔵し又は取り扱う場所をいう。\n４    同一敷地内に同一の管理権原にかかる複数の査察対象物が存する場合にあっては、それらの査察対象物は、法第８条第１項の規定の適用については、一の査察対象物とみなして取り扱うものとする。"}, {"d": "kayosaki", "a": "別表第２（第８条関係）", "h": "", "t": "別表第２（第８条関係）\n査察対象物の区分                       査察回数第１種査察対象物第２種査察対象物 １年に１回以上。\n第３種査察対象物第４種査察対象物 ２年に１回以上。\n第５種査察対象物 消防長が別に定める。\n備考\n１    第３条に基づく査察の結果が、良好なものでありかつ、消防長が火災予防上支障がないと認める第１種及び第２種査察対象物については、以後の査察回数を２年に１回以上に変更することができるものとする。\n２   第５条又は第６条に基づき査察を実施したときは、当該査察を定期査察とみなして取り扱うことができるものとする。\n様式第１号（第９条関係）\n様式第２号（第12条関係）\n様式第３号（第13条関係）\n様式第３号（その２）\n様式第３号の２（第13条関係）\n様式第３号の３（第13条関係）\n様式第３号の４（第13条関係）\n様式第４号（第13条関係）\n削除\n様式第５号（第14条関係）\n様式第６号（第16条関係）\n様式第６号の２（第16条関係）\n様式第６号の３（第16条関係）\n様式第６号の４（第17条関係）\n様式第７号（第18条関係）（全種共用）\n様式第７号（その２）（第１種～第３種査察対象物共用・危険物製造所等がある場合に併せて報告）\n様式第８号（第20条関係）\n様式第８号（その２）\n様式第８号（その３）\n様式第８号（その４）＝（様式第８号～第８号の10まで共通）\n様式第８号の２（第20条関係）\n様式第８号の２（その２）＝（様式第８号の２～第８号の10まで共通）\n様式第８号の３（第20条関係）\n様式第８号の４（第20条関係）\n様式第８号の５（第20条関係）\n様式第８号の６（第20条関係）\n様式第８号の７（第20条関係）\n様式第８号の８（第20条関係）\n様式第８号の９（第20条関係）\n様式第８号の10（第20条関係）\n様式第９号（第20条関係）"}, {"d": "kiseki", "a": "冒頭", "h": "", "t": "揖斐郡消防組合危険物規制規則平成 28 年８月 15 日規則第５号改正  令和元年９月２日規則第１号令和３年３月 15 日規則第３号令和６年 10 月１日規則第１号揖斐郡消防組合危険物取締規則（昭和 45 年規則第５号）の全部を改正する。"}, {"d": "kiseki", "a": "第１条", "h": "（趣旨）", "t": "第１条 この規則は、消防法（昭和 23 年法律第 186 号。以下「法」という。）第３章、危険物の規制に関する政令（昭和 34 年政令第 306 号。以下「政令」という。 ）及び危険物の規制に関する規則（昭和 34 年総理府令第 55 号。以下「省令」という。）の施行について必要な事項を定めるものとする。"}, {"d": "kiseki", "a": "第２条", "h": "（仮貯蔵等の承認）", "t": "第２条 法第 10 条第１項ただし書の規定により、危険物を仮に貯蔵し、又は取り扱おうとする者は、省令第１条の６に規定する申請書を消防長に提出し、承認を受けなければならない。\n２ 消防長は、前項の申請を受けたときは、内容を審査し、危険物の貯蔵又は取扱いが火災予防上安全であり支障がないと認めたときは、様式第１号による承認書に申請書の１部を添えて、申請者に交付するものとする。"}, {"d": "kiseki", "a": "第３条", "h": "（製造所等の設置又は変更の許可）", "t": "第３条 消防組合管理者は、法第 11 条第 1 項の規定による製造所、貯蔵所又は取扱所（以下「製造所等」という。）の設置又は変更の許可をするときは、様式第２号による許可書に申請書の 1 部を添えて、申請者に交付するものとする。"}, {"d": "kiseki", "a": "第４条", "h": "（仮使用の承認）", "t": "第４条 法第 11 条第５項ただし書に規定する製造所等の仮使用の承認を受けようとする者は、申請書に火災予防上の措置について記載した書類を添えて、消防組合管理者に提出し、承認を受けなければならない。\n２ 消防組合管理者は、前項の申請を承認したときは、様式第３号による承認書に申請書の１部を添えて、申請者に交付するものとする。"}, {"d": "kiseki", "a": "第５条", "h": "（製造所等の設置又は変更の中止の届出）", "t": "第５条 法第 11 条第２項に規定する許可を受けた者が、当該製造所等の設置又は変更の工事をしないとき又は工事を完成しないで中止をしたときは、危険物製造所等設置・変更取止め届（様式第４号）に第３条の許可書を添えて、消防組合管理者に提出しなければならない。"}, {"d": "kiseki", "a": "第６条", "h": "（措置命令等を発した場合の公示）", "t": "第６条 法第 11 条の５第４項（法第 12 条第３項、法第 12 条の２第３項、法第\n12 条の３第３項、法第 13 条の 24 第２項、法第 14 条の２第５項、法第 16 条の３第６項及び法第 16 条の６第２項において準用する場合を含む。）の規定により設置する標識の様式は、様式第５号のとおりとする。\n２ 省令第７条の５に規定する市町村長が定める方法は、揖斐郡消防組合公告式条例(昭和 45 年条例第３号)に規定する告示の例による。"}, {"d": "kiseki", "a": "第７条", "h": "（製造所等の用途廃止の届出）", "t": "第７条 法第 12 条の６の規定による製造所等の用途の廃止の届出をするときは、"}, {"d": "kiseki", "a": "第３条", "h": "", "t": "第３条 の許可書及び政令第８条第３項の規定する完成検査済証を添え、消防組合管理者に提出しなければならない。"}, {"d": "kiseki", "a": "第８条", "h": "（危険物取扱者免状の提示）", "t": "第８条 法第 13 条第２項に規定する危険物保安監督者の選任の届出をするときは、危険物取扱者免状を提示し、又はその写しを添付しなければならない。"}, {"d": "kiseki", "a": "第９条", "h": "（予防規程の認可）", "t": "第９条 法第 14 条の２第 1 項の規定による予防規程を認可するときは、様式第６号による認可書に申請書の一部を添えて、申請者に交付するものとする。\n（製造所等の変更の届出）\n第 10 条 製造所等の設置者、管理者又は占有者（以下「関係者」という。）は、製造所等において次の各号に掲げる事項に変更があったときは、変更しようとする７日前までに危険物製造所等の変更届出書（様式第７号）により消防組合管理者に届け出なければならない。\n（１） 設置者の氏名及び住所（法人にあっては、その名称、代表者の氏名及び主たる事業所の所在地）\n（２） 管理者の氏名及び住所（法人にあっては、その名称、代表者の氏名及び主たる事業所の所在地）\n（３） 危険物の貯蔵又は取扱いの方法\n（製造所等の休止又は再開の届出）\n第 11 条 製造所等の関係者は、製造所等の使用を３月以上にわたって休止しようとするときは、休止しようとする日の７日前までに危険物製造所等の休止再開届出書（様式第８号）により消防組合管理者に届け出なければならない。休止している製造所等を再開するときも、また同様とする。\n（製造所等の事故発生の通報場所）\n第 12 条 法第 16 条の３第２項に規定する市町村長の指定する通報場所は、消防本部とする。\n（製造所等の事故発生の届出）\n第 13 条 製造所等の関係者は、当該製造所等において爆発、火災その他の災害又は危険物の漏えい、飛散、流出等の事故が発生したときは、速やかに危険物事故発生届出書（様式第９号）を消防長に提出しなければならない。\n（製造所等における火気使用工事の届出）\n第 14 条 製造所等の関係者は、当該製造所等において溶接、溶断等火花を発する器具等を使用し、安全対策上仮設防火塀を設置して工事をしようとするときは、事前に火気使用工事届出書（様式第 10 号）を消防長に提出しなければならない。ただし、第４条の仮使用の承認に係る工事及び第 19 条第１号により資料提出がなされているものについては、この限りでない。\n（危険物取扱者の選任の届出）\n第 15 条 政令第 31 条の２（第３号を除く。  ）に規定する製造所等以外の関係者は、危険物取扱者（危険物取扱者免状の交付を受けているものをいう。）を定め、危険物取扱者選任・解任届出書（様式第 11 号）を消防組合管理者に届け出なければならない。\n（休止中の地下貯蔵タンク又は二重殻タンクの漏れの点検期間延長の承認）\n第 16 条 省令第 62 条の５の２第２項ただし書の規定による休止中の地下貯蔵タンク又は二重殻タンクの漏れの点検期間延長の承認を受けようとする者は、申請書にその理由書その他参考となるべき事項を記載した書類を添えて消防組合管理者に提出し、承認を受けなければならない。\n２ 消防組合管理者は、前項の申請を承認したときは、様式第 12 号による承認書に申請書の１部を添えて、申請者に交付するものとする。\n（休止中の地下埋設配管の漏れの点検期間延長の承認）\n第 17 条 省令第 62 条の５の３第２項ただし書の規定による休止中の地下埋設配管の漏れの点検期間延長の承認を受けようとする者は、申請書に理由書その他参考となるべき事項を記載した書類を添えて消防組合管理者に提出し、承認を受けなければならない。\n２ 消防組合管理者は、前項の申請を承認したときは、様式第 13 号による承認書に申請書の１部を添えて、申請者に交付するものとする。\n（危険物等の収去）\n第 18 条 法第 16 条の５第１項の規定により危険物又は危険物であることの疑いのあるものを収去したときは、当該収去物の関係者に収去書（様式第 14 号）\nを交付するものとする。\n（資料の提出）\n第 19 条 次の各号に該当するときは、資料提出書（様式第 15 号）を消防組合管理者に提出しなければならない。\n（１） 法第 11 条第１項の規定による変更許可の手続きを要しない製造所等の軽微な変更で「製造所等において行われる変更工事に係る取扱いについて」（平成 14 年３月 29 日消防危第 49 号）において規定するものに該当するとき。\n（２） 予防規程に規定する事項のうち危険物の品名、数量又は指定数量の倍数、関係者及び保安の役割分担の氏名を変更しようとするとき。\n（３） その他消防組合管理者が特に必要と認めるもの。\n（届出書の交付）\n第 20 条 法第 11 条第６項、同第 11 条の４第１項、同第 12 条の６及び同第 13条第２項並びに第５条、第 10 条、第 11 条、第 15 条及び第 19 条に規定する届出を受理したときは届出済印（様式第 16 号）を、第 13 条及び第 14 条に規定する届出を受理したときは届出済印（様式第 17 号）を、それぞれ押印し、その 1 部を届出者に交付するものとする。\n（代理人による申請）\n第 21 条 法第 11 条第１項の規定により、製造所等を設置し、又は変更しようとする者が代理人を申請者として許可申請書を提出するときは、当該申請に係る権限を委任する旨を証する書面を添えなければならない。\n（委任）\n第 22 条 この規則の施行に関し、必要な事項は消防長が定める。"}, {"d": "kiseki", "a": "附 則", "h": "", "t": "附 則\n（施行期日）\n１ この規則は、公布の日から施行する。\n（経過措置）\n２ この規則の施行の日前に、改正前の揖斐郡消防組合危険物取締規則（昭和 45年規則第５号）の規定に基づいてなされた申請、届出その他の手続並びに許可、認可その他の行為は、改正後の規則の相当規定に基づいてなされたものとみなす。\n３ この規則の施行の際現に作成されている用紙は、この規則の規定にかかわらず、当分の間、使用することができる。"}, {"d": "kiseki", "a": "附 則（令和元年９月２日", "h": "", "t": "附 則（令和元年９月２日規則第第１号）\nこの規則は、公布の日から施行する。"}, {"d": "kiseki", "a": "附 則（令和３年３月 1", "h": "", "t": "附 則（令和３年３月 15 日規則第３号）\nこの規則は、公布の日から施行する。"}, {"d": "kiseki", "a": "附 則（令和６年 10 ", "h": "", "t": "附 則（令和６年 10 月１日規則第１号）\nこの規則は、公布の日から施行する。\n様式第 1 号（第２条関係）\n様式第２号（第３条関係）\n様式第３号（第４条関係）\n様式第４号（第５条関係）\n様式第５号（第６条関係）\n様式第６号（第９条関係）\n様式第７号（第 10 条関係）\n様式第８号（第 11 条関係）\n様式第９号（第 13 条関係）\n様式第 10 号（第 14 条関係）\n様式第 11 号（第 15 条関係）\n様式第 12 号（第 16 条関係）\n様式第 13 号（第 17 条関係）\n様式第 14 号（第 18 条関係）\n様式第 15 号（第 19 条関係）\n様式第 16 号（第 20 条関係）\n様式第 17 号（第 20 条関係）"}, {"d": "sotsuyo", "a": "冒頭", "h": "", "t": "○遠隔移報システム等による火災通報の取扱要綱平成元年５月１日消防長訓令第１号改正平成４年２月27日消防長訓令第１号\n第１   趣旨この要綱は、夜間、休日等において無人状態となる防火対象物の火災を早期に覚知する観点から、遠隔移報システム等による火災通報を一定の条件を満たす場合に限って承認するとともに、当該通報があった場合の消防活動の対応等について必要な事項を定めるものとする。\n第２   対象とする通報形態\n１   即時通報消防法（昭和23年法律第186号。以下「法」という。）第17条に規定する自動火災報知設備（以下「自火報」という。）の火災情報を、まず、警備業者、第三セクター等の第三者機関（以下「業者等」という。）に移報し、業者等の火災対応の一環として、火災確認を経ることなく消防機関に通報されるものをいう。\n２   直接通報自火報と非常通報装置（「消防機関へ通報する非常通報装置の取扱いについて」（昭和62年７月14日付け消防予第118号消防庁予防課長通知）別添２の基準に適合するものをいう。以下同じ。）とを接続し、自火報が作動した旨を、人の手を経ず自動的に119番に通報されるものをいう。\n第３   対象物の範囲\n１   即時通報及び直接通報（以下「即時通報等」という。）を認める対象物は、夜間、休日等において無人状態となる防火対象物のうち、次に掲げるいずれの条件にも適合するものとする。\n(１) 法第17条の規定に基づき自火報が防火対象物全体に設置された防火対象物であること。\nただし、消防法施行令（昭和36年政令第37号）第８条の適用を受ける防火対象物にあってはこの限りでない。\n(２) 防火対象物の全体にわたって承認申請がなされる防火対象物であること。\n２   前１に定めるもののほか、消防長が必要と認めたものは、即時通報等の対象物とすることができる。\n第４   承認条件１及び２に掲げる条件を満たす場合には即時通報を、１及び３に掲げる条件を満たす場合には直接通報を、それぞれ認めるものとする。\n１   共通の条件\n(１) 自火報が消防法令に定める技術上の基準に従って設置及び維持管理されていること。\n(２) 自火報の非火災報対策が蓄積式受信機、蓄積式中継器又は蓄積付加装置によりなされていること。\n(３) 消防機関へ通報後25分以内に、当該防火対象物の関係者及び業者等（直接通報の場合は業者等を除く。以下「現場派遣者」という。）が現場に到着し、非火災である場合、真火災である場合、いずれにおいても適切な対応ができる体制がとられていること。\n(４) 事前の破壊消防への同意、自火報連動開錠、又は現場派遣者による消防機関よりも早い現場到着等、消防隊が到着後速やかに自火報の受信機に到達し、対応できる手段が確保されていること。\n２   即時通報に係る付加条件\n(１) 業者等は、登録されていること。\n(２) 即時通報に用いる機器等の、設置及び維持管理が適正であること。\n３   直接通報に係る付加条件\n(１) 非常通報装置は、「消防機関へ通報する非常通報装置の取扱いについて」による構造及び性能を有し、かつ、機器等の設置及び維持管理が適正であること。\n(２) 非常通報装置は、前１共通条件(３)の対応が適切に行えるよう、当該防火対象物の関係者の所在地へも、同時に移報（常時受信できる場所をあらかじめ２か所以上指定）するものであること。\n第５   承認に係る審査等\n１   承認申請即時通報等の承認を受けようとする防火対象物の管理権原者は、次に掲げる区分に応じ、それぞれに定める申請書等により消防長又は消防署長（以下「消防長等」という。）に申請するものとする。なお、防火対象物に複数の管理権原者が存する場合は、申請者以外の管理権原者の同意書を添付すること。\n(１) 即時通報\nア 即時通報承認申請書（様式第１号）\nイ 即時通報等対象物現況表（様式第１号の２）\n(２) 直接通報\nア 直接通報承認申請書（様式第２号）\nイ 即時通報等対象物現況表\nウ 直接通報対応の状況（様式第２号の２）\n２   審査及び承認\n(１) 消防長等は、前１の申請を受けた場合は、申請内容を審査し、第４に定める承認条件に適合していると認めたときは「即時通報承認整理簿」（様式第３号）又は「直接通報承認整理簿」（様式第４号）に記載するとともに「即時通報等承認通知書」（様式第５号）により申請があった管理権原者に通知するものとする。\n(２) 消防長等は審査の結果第４に定める承認条件に適合しないと認めたときは、「即時通報等不承認通知書」（様式第６号）により申請のあった管理権原者に通知するものとする。\n３   承認に際し指導する事項消防長等は審査の結果、承認した防火対象物（以下「承認対象物」という。）の管理権原者及び業者等に対し、次の事項を遵守するよう指導するものとする。\n(１) 当該防火対象物が無人状態にある場合にのみ即時通報等を行うものであること。\n(２) 即時通報等を行った場合は、現場派遣者は必ず所定の時間内に当該防火対象物に到着するものであること。\n(３) 現場派遣者は現場到着後、消防隊と速やかに連絡をとるとともに、その指示に従うものであること。\n(４) 誤操作による出場を防止するため、従業員等に対し、自火報及び移報するための装置・機器の取扱いについて習熟させること。\n４   承認内容の変更等\n(１) 即時通報等の承認を受けた防火対象物の管理権原者は次のアからキに掲げる事項に変更が生じた場合には、速やかに「即時通報等承認内容変更届出書」（様式第７号）にその内容に係る図書等を添付し、消防長等に届け出るものとする。\nア 防火対象物の名称\nイ 防火対象物の所在地\nウ 防火対象物の構造・用途等\nエ 防火対象物の管理権原者の職・氏名の変更\nオ 消防隊の進入経路\nカ 自動火災報知設備の受信機の位置\nキ その他必要と認められるもの\n(２) 防火対象物の管理権原者は、即時通報等に係る通報を取り止める場合は「即時通報等取止届出書」（様式第８号）により消防長等に届け出るものとする。\n(３) 変更・取止めの手続きは、第５・２に準じて行うものとする。\n５   承認の取消し\n(１) 消防長等は、承認対象物が、次に掲げる事項のいずれかに該当し、指導によっても速やかに改善されないときは、当該承認を取り消すことができるものとする。\nア 第４の承認条件に適合しないと認められる場合\nイ 即時通報承認対象物において委託している業者等が登録を抹消された場合\nウ 現場派遣者が所定の時間内に現場到着しなかった場合\nエ 有人時に通報がされた場合\nオ その他承認の継続が不適当であると認められる場合\n(２) 消防長等は、前(１)により承認の取り消しを行ったときは、「即時通報等承認取消通知書」（様式第９号）により防火対象物の管理権原者に通知するものとする。\n第６   審査委員会即時通報に係る業者等の登録等に関する審査事務を行うため、審査委員会を消防本部に設置するものとする。\n第７   業者等の登録等\n１   登録の申請即時通報に関して登録する業者等は「即時通報業務登録申請書」（様式第10号）に次に掲げる図書等を添付して、消防長に申請するものとする。\n(１) 定款等会社の概要及び業務概要\n(２) 基地局、待機所等の所在及びそれぞれごとの警備員数、責任者氏名\n(３) 待機所ごとの配置車両\n(４) 移報受信後の基地局及び待機所等の対応状況\n(５) 基地局、営業所ごとの教育担当者の状況及び教育計画\n(６) 即時通報に用いる機器等の概要及び機器ごとの仕様図書\n(７) 即時通報に用いる機器等の保守管理の方法及びその状況\n(８) その他、消防長が必要と認めるもの\n２   審査及び登録\n(１) 消防長は、前１の申請を受けた場合は、次に掲げる事項（以下「登録条件」という。）\nについて審査委員会に対し調査させるものとする。\nア 営業所又は基地局ごとに、「消防法施行規則の一部を改正する省令について」（昭和58年12月２日付け消防予第227号消防庁次長通知）に基づく防火管理教育担当者資格講習を修了した者のうちから教育担当者が指定されていること。\nイ 防火防災教育が、当該教育担当者により、組織的、計画的に実施されていること。\nウ 当該教育担当者は、講習修了後概ね３年ごとに岐阜県消防長会が実施する再講習を受講していること。\nエ 即時通報に適切に対応できる体制を有していること。\nオ 即時通報に用いる機器等の設置及び維持管理が適正であること。\nカ その他、消防長が必要と認めること。\n(２) 消防長は、審査委員会の調査に基づき、前(１)の登録条件を満たしていると認めるときは、「即時通報業務登録整理簿」（様式第11号）に登載するとともに、「即時通報業務登録通知書」（様式第12号）により申請者に通知するものとする。\n(３) 消防長は、消防署長に登録をした業者等を通知するものとする。\n(４) 消防長は、前(１)の登録条件に適合していないことにより登録を行わない場合は、「即時通報業務登録抹消等通知書」（様式第13号）により申請者に通知するものとする。\n３   登録内容変更の届出等\n(１) 登録した業者等は、登録の内容に変更が生じた場合には、「即時通報業務登録変更（取止）届出書」（様式第14号）にその内容に係る図書等を添付して、消防長に速やかに届け出るものとする。\n(２) 登録した業者等は当該業務の取止め等により登録の必要がなくなった場合には、「即時通報業務登録変更（取止）届出書」により、消防長に速やかに届け出るものとする。\n(３) 変更の事務は第７・２に準じて行うものとする。\n４   登録の抹消\n(１) 消防長は、登録された業者等が次に掲げる事項のいずれかに該当すると認めたときは、登録有効期限内であっても当該登録を抹消することができるものとする。\nア 第７・２(１)に掲げる登録条件に適合しないと認められる場合\nイ 現場派遣者の現場への到着が繰返し遅延したと認められる場合\nウ 即時通報時における通報担当者の通報内容又は現場派遣者の措置等が著しく不適当と認められる場合\nエ その他、登録の継続が不適当であると認められる場合\n(２) 消防長は、前(１)による登録の抹消をする場合には、「即時通報業務登録抹消等通知書」により申請者に通知するものとする。\n(３) 消防長は、消防署長に登録を抹消した業者等を通知するものとする。\n５    登録の更新\n(１) 業者等の登録有効期間は、登録の日から３年間とし、３年ごとに「即時通報業務登録更新申請書」（様式第15号）に第７・１に定める関係書類を添付して、更新の申請をするものとする。\n(２) 更新の事務は第７・２に準じて行うものとする。\n(３) 消防長は審査の結果、支障がないと認めたときは、「即時通報業務登録更新通知書（様式第16号）によりその旨を申請者に通知するものとする。\n第８       消防活動等\n１    出場体制即時通報等に係る消防隊の出場は、別に定めるものとする。\n２    出場に係る報告消防署長は、即時通報等により消防隊が出場した場合は、「即時通報等に係る対応報告書」（様式第17号）により消防長に報告するものとする。\n第９       事後報告\n１    消防長等は、承認対象物の管理権原者又は、業者等が即時通報等を行った場合は、通報を行った日から10日以内に「消防機関への通報に係る実態報告書」（様式第18号）を提出させるものとする。\n２    消防長等は、即時通報等による通報が非火災報であった場合は、当該防火対象物の管理権原者に非火災報対策の改善計画を提出させるものとする。\n第10      委任この要綱に定めるもののほか、必要な事項は、消防長が別に定めるものとする。"}, {"d": "sotsuyo", "a": "附 則", "h": "", "t": "附 則\n１       この要綱は、平成元年５月１日から施行する。\n２       この要綱施行の際、現に即時通報等により運用しているもののうち、本要綱第３に規定する防火対象物にあっては、平成元年10月31日までに消防長等に申請し、消防長等が承認した場合にあっては、平成４年３月31日までは、本要綱による承認等を受けたものとみなす。"}, {"d": "sotsuyo", "a": "附 則（平成４年２月27", "h": "", "t": "附 則（平成４年２月27日消防長訓令第１号）\n１    この要綱は、平成４年４月１日から施行する。\n２    この要綱の施行の際、現に改正前の遠隔移報システム等による火災通報の取扱要綱の規定により承認している即時通報等のうち、改正後の遠隔移報システム等による火災通報の取扱要綱（以下「新要綱」という。）に定める承認条件に適合するものについては、新要綱の規定に基づき承認したものとみなす。\n３    前項の適用を受けない旧即時通報等の承認については、この要綱の規定にかかわらず、当分の間これを有効なものとし、新要綱に定める承認条件に適合させるようにしなければならない。\n４    この要綱の施行の際、現に改正前の様式により作成されている書類は改正後の様式の規定により作成されたものとみなす。\n様式第１号（第５関係）\n様式第１号の２（第５関係）\n様式第２号（第５関係）\n様式第２号の２（第５関係）\n様式第３号（第５関係）\n様式第４号（第５関係）\n様式第５号（第５関係）\n様式第６号（第５関係）\n様式第７号（第５関係）\n様式第８号（第５関係）\n様式第９号（第５関係）\n様式第10号（第７関係）\n様式第11号（第７関係）\n様式第12号（第７関係）\n様式第13号（第７関係）\n様式第14号（第７関係）\n様式第15号（第７関係）\n様式第16号（第７関係）\n様式第17号（第８関係）\n様式第18号（第９関係）\n様式１"}, {"d": "boukahyouji", "a": "冒頭", "h": "", "t": "防火対象物に係る表示制度要綱平成２６年   ３月２５日消防長訓令第３号\n１ 表示の目的ホテル・旅館等不特定多数の者を収容する防火対象物の防火安全対策の重要性に鑑み、防火対象物の関係者の防火に対する認識を高め、防火管理業務の適正化及び消防用設備等の設置、維持管理等を促進するとともに、重要な建築構造等への適合性も含めた防火・防災管理上の一定の基準に適合している防火対象物について、その情報を利用者等に提供し、防火安全体制の確立を図るため「表示」を行うものとする。\n２ 表示対象物防火・防災管理上の表示基準に適合している旨の表示（以下「表示」という。）をする対象物は、ホテル・旅館等（消防法施行令別表第一(5)項イ並びに同表(16)項イに掲げる防火対象物のうち同表(5)項イの用途に供する部分が存するもの。以下同じ。）\nで、次の(1)及び(2)に該当するものとする。\n(1) 消防法第８条の適用があるもの\n(2) 防火対象物の地階を除く階数が３以上のもの\n３ 表示基準及び審査\n(1) 表示基準は別記のとおりとする。\n(2) 表示基準の審査においては、消防法に定める防火対象物（防災管理）定期点検報告、消防用設備等点検報告、製造所等定期点検記録表、建築基準法に定める定期調査報告等の現行の制度を活用するものとする。\n(3) 表示基準の審査は、必要に応じて現地確認を実施するものとする。\n４ 表示マークの交付\n(1) 消防長又は消防署長は、ホテル・旅館等の関係者（以下「関係者」という。）からの申請により、別記表示基準に基づく審査により、その申請に係る防火対象物が表示基準に適合していると認める場合（(2)に定める場合を除く。）には、関係者に対して、ホテル・旅館等が表示基準に適合している旨を通知するとともに、別図に定める「表示マーク（銀）」を交付する。ただし、表示マーク（銀）を継続する場合は、適合している旨の通知のみを行うものとする。\n(2）消防長又は消防署長は、関係者からの申請により、その申請に係る防火対象物について次に掲げる事項に該当すると認められる場合には、関係者に対して、ホテル・旅館等が表示基準に適合している旨を通知するとともに、別図に定める ｢表示マーク（金）｣を交付する。ただし、表示マーク（金）を継     else if (is(u,'1') && (+o.stage || 0) >= 500) r = '(1)項の舞台部で床面積500㎡以上';

    if (r) add('消火活動上必要な施設','排煙設備','req', r, '令28条1項');
  }
  // --- 連結散水設備 令28の2 ---
  if ((+o.basementArea || 0) >= 700 && !is(u,'16_3','17','18')) add('消火活動上必要な施設','連結散水設備','req', `地階の床面積合計 ${o.basementArea}㎡ ≧ 700㎡`, '令28条の2第1項', 'SP等の有効範囲は省略可');
  // --- 連結送水管 令29 ---
  {
    let r = null;
    if (nAbove >= 7) r = '地階を除く階数7以上';
    else if (nAbove >= 5 && A >= 6000) r = '地階を除く階数5以上で延べ6,000㎡以上';
    else if (u === '16_2' && A >= 1000) r = '地下街で延べ1,000㎡以上';
    else if (u === '18') r = '延長50m以上のアーケード';
    if (r) add('消火活動上必要な施設','連結送水管','req', r, '令29条1項');
  }
  // --- 非常コンセント設備 令29の2 ---
  if (nAbove >= 11) add('消火活動上必要な施設','非常コンセント設備','req','地階を除く階数11以上（11階以上の階）','令29条の2第1項');
  else if (u === '16_2' && A >= 1000) add('消火活動上必要な施設','非常コンセント設備','req','地下街で延べ1,000㎡以上','令29条の2第1項');
  // --- 無線通信補助設備 令29の3 ---
  if (u === '16_2' && A >= 1000) add('消火活動上必要な施設','無線通信補助設備','req','地下街で延べ1,000㎡以上','令29条の3第1項');

  return R;
}

// 防火管理等（建物全体で判定）
function judgeManagement(o){
  const u = o.use, A = +o.area || 0, C = +o.cap || 0, nAbove = +o.floorsAbove || 0;
  const R = [];
  const add = (name, status, reason, basis, note) => R.push({cat:'防火管理等', name, status, reason, basis, note: note || ''});
  const comps = (o.comps || []).map(c => c.use);
  const has6ro = is(u,'6-ro') || comps.some(c => is(c,'6-ro'));
  const tok = USE[u] && USE[u].tok;
  const tokFM = is(u,'1','2','3','4','5-i','6','9-i','16-i','16_2','16_3');
  if (u !== '18') {
    let need = false, kind = '';
    if (has6ro && (is(u,'6-ro','16-i','16_2'))) { need = C >= 10; kind = '甲種'; }
    else if (tokFM) { need = C >= 30; kind = A >= 300 ? '甲種' : '乙種'; }
    else { need = C >= 50; kind = A >= 500 ? '甲種' : '乙種'; }
    if (need) add(`防火管理者の選任・消防計画（${kind}防火対象物）`,'req', `収容人員 ${C}人`, '消防法8条、令1条の2・3条', '特定は30人以上（(6)項ロ関係は10人以上）、非特定は50人以上。管理的・監督的地位にある者を選任');
    else add('防火管理者の選任','no', `収容人員 ${C}人（基準未満）`, '令1条の2第3項');
    if (o.multiOwner) {
      let r = null;
      if (o.h31) r = '高さ31m超';
      else if (has6ro && nAbove >= 3 && C >= 10) r = '(6)項ロ等を含み地上3階以上・収容10人以上';
      else if ((tok || u === '16-i') && nAbove >= 3 && C >= 30) r = '特定用途を含み地上3階以上・収容30人以上';
      else if (u === '16-ro' && nAbove >= 5 && C >= 50) r = '(16)項ロで地上5階以上・収容50人以上';
      else if (is(u,'16_2','16_3')) r = '地下街・準地下街（指定されたもの）';
      if (r) add('統括防火管理者の選任・全体についての消防計画','req', r + '（管理権原が分かれている）', '消防法8条の2、令3条の3');
    }
  }
  if (tok && C >= 300) add('防火対象物定期点検報告（1年ごと）','req', `特定用途で収容人員 ${C}人 ≧ 300人`, '消防法8条の2の2、令4条の2の2', '3年間優良な場合は特例認定（法8条の2の3）');
  else if (tok && o.oneStair && C >= 30) add('防火対象物定期点検報告（1年ごと）','req','特定一階段等防火対象物で防火管理者選任が必要','消防法8条の2の2、令4条の2の2');
  {
    const bosaiUse = is(u,'1','2','3','4','5-i','6','7','8','9','10','11','12','13-i','15','16','17');
    let r = null;
    if (u === '16_2' && A >= 1000) r = '地下街で延べ1,000㎡以上';
    else if (bosaiUse && ((nAbove >= 11 && A >= 10000) || (nAbove >= 5 && A >= 20000) || A >= 50000)) r = `階数${nAbove}・延べ${A}㎡（防災管理対象物）`;
    if (r) add('防災管理者・自衛消防組織・防災管理点検','req', r, '消防法36条・8条の2の5、令46条');
  }
  if (tok || o.h31 || u === '12-ro' || is(u,'16_2')) add('防炎物品（カーテン・じゅうたん等）の使用','req', o.h31 ? '高層建築物（高さ31m超）' : '防炎防火対象物', '消防法8条の3、令4条の3');
  if (u !== '18') {
    const qual = (tok && A >= 1000) || o.oneStair;
    add(`消防用設備等の点検・報告（${tok ? '1年' : '3年'}ごと）`, 'req', qual ? (o.oneStair ? '特定一階段等：消防設備士等による点検' : '特定・延べ1,000㎡以上：消防設備士等による点検') : (A >= 1000 ? '非特定・延べ1,000㎡以上：消防長等の指定により有資格者点検' : '関係者による点検も可'), '消防法17条の3の3、令36条、規則31条の6', '機器点検6か月・総合点検1年');
  }
  if (is(u,'5-ro') || comps.some(c => is(c,'5-ro'))) add('住宅用火災警報器（住戸部分）','chk','住宅部分（自火報等で代替される部分を除く）','消防法9条の2、条例29条の2〜29条の5');
  return R;
}

function judge(o){
  let R = [];
  if (is(o.use,'16-i','16-ro') && (o.comps || []).length) {
    // 令9：用途部分ごとに判定（一部の規定を除く）
    const tokArea = o.comps.filter(c => USE[c.use] && USE[c.use].tok).reduce((s, c) => s + (+c.area || 0), 0);
    for (const c of o.comps) {
      const part = judgeSingle({ ...o, use: c.use, area: +c.area || 0 });
      for (const r of part) { r.part = USE[c.use] ? USE[c.use].label : c.use; }
      R = R.concat(part);
    }
    // 建物全体で判定する規定
    const whole = judgeSingle({ ...o, tokArea });
    for (const r of whole) r.part = '建物全体';
    R = R.concat(whole.filter(r => r.status !== 'no'));
    if (o.use === '16-i') {
      if (+o.area >= 3000 && tokArea >= 3000) R.push({cat:'消火設備', name:'スプリンクラー設備', status:'req', reason:`(16)項イで延べ ${o.area}㎡ ≧ 3,000㎡ かつ特定用途部分 ${tokArea}㎡ ≧ 3,000㎡（特定用途部分が存する階）`, basis:'令12条1項10号', note:'', part:'建物全体'});
    }
    // 同名設備はより厳しい判定を残す
    const rank = { req: 3, chk: 2, no: 1 };
    const map = new Map();
    for (const r of R) {
      const k = r.name;
      if (!map.has(k)) map.set(k, { ...r, parts: [] });
      const m = map.get(k);
      if (r.status !== 'no') m.parts.push(`${r.part}：${r.reason}`);
      if (rank[r.status] > rank[m.status]) Object.assign(m, { status: r.status, reason: r.reason, basis: r.basis, note: r.note });
    }
    R = [...map.values()].map(m => ({ ...m, reason: m.parts.length ? m.parts.join(' ／ ') : m.reason }));
  } else {
    R = judgeSingle(o);
  }
  return R.concat(judgeManagement(o));
}

    if (r.status === 'no' || r.cat === '防火管理等') continue;
    const id = 'e:' + r.name;
    out.push({id: id + ':set', cat:'消防用設備等（個別）', text:`${r.name} が基準どおり設置されているか`, basis:`消防法17条1項、${r.basis}`, cond: r.status === 'chk' ? '要確認の設備' : '', fix:`${r.name}を技術上の基準に従って設置すること`});
    const hint = EQUIP_HINT[r.name] || Object.entries(EQUIP_HINT).find(([k]) => r.name.startsWith(k))?.[1] || '外観・機能';
    out.push({id: id + ':keep', cat:'消防用設備等（個別）', text:`${r.name} の維持管理は良好か（${hint}）`, basis:'消防法17条1項', fix:`${r.name}の不良箇所を改修し、技術上の基準に従って維持すること`});
  }
  return out;
}

function buildChecklist(o){
  const j = judge(o);
  const st = CHECKS.filter(c => !c.when || c.when(j, o));
  const order = ['防火管理','避難施設等の管理','消防用設備等（共通）'];
  const a = st.filter(c => order.includes(c.cat)), b = st.filter(c => !order.includes(c.cat));
  return a.concat(equipChecks(j), b);
}

// ===== 揖斐郡消防組合火災予防査察規程 別表第1・第2 =====
function sasatsuClass(o, j){
  j = j || judge(o);
  const fm = j.find(r => r.name.startsWith('防火管理者の選任・消防計画'));
  const kou = fm && fm.name.includes('甲種'), otsu = fm && fm.name.includes('乙種');
  const jk = j.some(r => r.name === '自動火災報知設備' && r.status === 'req');
  const ext = j.some(r => r.name === '消火器具' && r.status === 'req');
  const tok = USE[o.use] && USE[o.use].tok;
  if (tok && (kou || jk)) return {k:1, label:'第1種査察対象物', freq:'1年に1回以上', by:'予防係員'};
  if (!tok && (kou || jk)) return {k:2, label:'第2種査察対象物', freq:'1年に1回以上', by:'消防係員'};
  if (o.hazFacility) return {k:3, label:'第3種査察対象物', freq:'1年に1回以上', by:'消防係員'};
  if (otsu || ext || o.danger) return {k:4, label:'第4種査察対象物', freq:'2年に1回以上', by:'消防係員'};
  return {k:5, label:'第5種査察対象物', freq:'消防長が別に定める', by:'予防係員及び消防係員'};
}
// 規則15条：公表対象（特定用途で屋内消火栓・SP・自火報の設置義務があるもの）
function publicationTargets(o, j){
  j = j || judge(o);
  const pubUse = is(o.use,'1','2','3','4','5-i','6','9-i','16-i','16_2','16_3');
  if (!pubUse) return [];
  return j.filter(r => r.status === 'req' && ['屋内消火栓設備','スプリンクラー設備','自動火災報知設備'].includes(r.name)).map(r => r.name);
}

function lawResults(q, filt){
  const nq = z2h(q).replace(/\s+/g, ' ').trim();
  const terms = nq ? nq.split(' ') : [];
  const out = [];
  const hit = s => { const t = z2h(s); return terms.every(w => t.includes(w)); };
  if (filt === 'all' || filt === 'nat') for (const n of NATIONAL) {
    const txt = `${n[0]} ${n[1]} ${n[2]} ${n[3]}`;
    if (!terms.length || hit(txt) || hit(`${n[0] === '消防法施行令' ? '令' : n[0] === '消防法施行規則' ? '規則' : '消防法'}${n[1]}`)) out.push({ kind: 'nat', title: /^別表/.test(n[1]) ? `${n[0]} ${n[1]}` : `${n[0]} 第${n[1].replace('〜', '〜第')}`, head: n[2], text: n[3], url: EGOV[n[0]], law: n[0], art: n[1] });
  }
  if (filt === 'all' || filt === 'loc') for (const a of LT.arts) {
    const doc = LT.docs.find(d => d.key === a.d);
    const short = { kayojo: '条例', kayoki: '規則', kayosaki: '査察規程', kiseki: '危険物規制規則', sotsuyo: '遠隔移報要綱', boukahyouji: '表示制度要綱' }[a.d];
    const txt = `${doc.title} ${short}${a.a.replace(/^第/, '')} ${a.h} ${a.t}`;
    if (!terms.length ? a.d === 'kayosaki' : hit(txt)) out.push({ kind: 'loc', title: `${doc.title} ${a.a}`, head: a.h, text: a.t, url: doc.url });
  }
  if (filt === 'all' || filt === 'kok') for (const k of KOKUJI) if (!terms.length || hit(k[0])) out.push({ kind: 'kok', title: '告示', head: k[0], text: '', url: k[1] });
  return out;
}

// ===== e-Gov 法令API から条文の正文を取得 =====
const EGOV_ID = { '消防法': '323AC1000000186', '消防法施行令': '336CO0000000037', '消防法施行規則': '336M50000008006' };
const EGOV_NUM = { '消防法': '昭和二十三年法律第百八十六号', '消防法施行令': '昭和三十六年政令第三十七号', '消防法施行規則': '昭和三十六年自治省令第六号' };
const artCache = {};
// '8条の2の4' → '8_2_4'（範囲や別表は対象外）
function artNo(a){ const m = String(a || '').match(/^(\d+)条((?:の\d+)*)$/); return m ? m[1] + m[2].replace(/の/g, '_') : null; }
function kanjiNum(n){
  n = +n; const d = '〇一二三四五六七八九';
  if (n < 10) return d[n];
  let out = '';
  const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  if (h) out += (h > 1 ? d[h] : '') + '百';
  if (t) out += (t > 1 ? d[t] : '') + '十';
  if (o) out += d[o];
  return out;
}
// '8条の2の4' → '第八条の二の四'
function artKanji(a){ const m = String(a || '').match(/^(\d+)条((?:の\d+)*)$/); return m ? '第' + kanjiNum(m[1]) + '条' + m[2].replace(/\d+/g, kanjiNum) : null; }
function xmlArticleText(art){
  const out = [];
  const txt = el => el ? el.textContent.replace(/\s+/g, '') : '';
  const cap = art.querySelector(':scope > ArticleCaption'), tit = art.querySelector(':scope > ArticleTitle');
  if (cap) out.push(txt(cap));
  art.querySelectorAll(':scope > Paragraph').forEach((p, i) => {
    const num = txt(p.querySelector(':scope > ParagraphNum'));
    const sen = txt(p.querySelector(':scope > ParagraphSentence'));
    out.push(i === 0 ? `${txt(tit)}　${sen}` : `${num}　${sen}`);
    p.querySelectorAll('Item, Subitem1, Subitem2, Subitem3').forEach(it => {
      const depth = { Item: 1, Subitem1: 2, Subitem2: 3, Subitem3: 4 }[it.tagName] || 1;
      const t = it.querySelector(':scope > ItemTitle, :scope > Subitem1Title, :scope > Subitem2Title, :scope > Subitem3Title');
      const ss = it.querySelector(':scope > ItemSentence, :scope > Subitem1Sentence, :scope > Subitem2Sentence, :scope > Subitem3Sentence');
      out.push('　'.repeat(depth) + `${txt(t)}　${txt(ss)}`);
    });
  });
  return out.join('\n');
}
async function fetchArticle(law, art){
  const key = law + art; if (artCache[key]) return artCache[key];
  // 仕様書の例は「第十一条」形式。算用数字形式も順に試す
  // 法令は法令番号（確実）→法令ID、条は「第十一条」形式→算用数字形式の順に試す
  const arts = [artKanji(art), artNo(art)].filter(Boolean);
  const cands = [];
  for (const a of arts) cands.push(`lawNum=${encodeURIComponent(EGOV_NUM[law])};article=${encodeURIComponent(a)}`);
  cands.push(`lawId=${EGOV_ID[law]};article=${encodeURIComponent(arts[0])}`);
  let last;
  for (const c of cands) {
    let res;
    try { res = await fetch(`https://laws.e-gov.go.jp/api/1/articles;${c}`); }
    catch (e) { e.net = true; throw e; } // 通信自体ができない場合は他の形式も無駄なので中止
    try {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
      const code = xml.querySelector('Result > Code');
      if (code && code.textContent.trim() !== '0') throw new Error(xml.querySelector('Result > Message')?.textContent || 'not found');
      // ApplData 内にはリクエストの条番号が <Article>第八条</Article> として入っているので、本文側（LawContents 内）を読む
      const lc = xml.querySelector('LawContents');
      const a = (lc && lc.querySelector('Article')) || [...xml.getElementsByTagName('Article')].find(el => el.children.length);
      let text = a ? xmlArticleText(a) : '';
      if (!text.replace(/\s/g, '') && lc) text = lc.textContent.replace(/[ \t]+/g, '').replace(/\n{2,}/g, '\n').trim();
      if (!text.replace(/\s/g, '')) throw new Error('条文が空でした');
      return (artCache[key] = text);
    } catch (e) { last = e; }
  }
  throw last;
}
function showArticle(b){
  const box = b.nextElementSibling, law = b.dataset.law, art = b.dataset.art;
  box.innerHTML = '<div class="s">e-Gov から取得中…</div>';
  fetchArticle(law, art).then(t => {
    box.innerHTML = `<div class="lt egov-t">${esc(t)}</div><div class="note">出典：e-Gov 法令検索（法令API）・現行の条文</div>`;
    b.remove();
  }).catch(e => {
    box.innerHTML = `<div class="warn">正文を取得できませんでした。${e && e.net ? '通信できませんでした（電波状況、または Claude 上で開いている場合は外部通信が制限されています）。' : 'e-Gov から条文が返りませんでした。'}上の「e-Gov 法令検索で正文を見る」から「第${esc(art)}」を探してください。<br><small>詳細：${esc(e && e.message || '')}</small></div>`;
  });
}

// ===== 違反処理の流れ =====
function vGuide(){
  const steps = [
    ['立入検査（査察）', '関係者・防火管理者等の立会いを求めて実施し、終了時に結果と改善事項を具体的に説明・指導する。', '消防法4条、査察規程10条・11条'],
    ['立入検査結果通知書の交付', '不備欠陥事項を認めたときは様式第3号を交付し、写しで消防長に報告。必要に応じて提出期限を定めて改修（計画）報告書（様式第4号）を提出させる。', '査察規程13条'],
    ['公表（該当する場合）', '特定用途で屋内消火栓・SP・自火報の設置義務があるのに未設置の場合、通知日から14日経過後も同一違反があれば是正確認まで組合ホームページで公表。事前に関係者へ通知。', '条例47条の2、規則15条・16条'],
    ['勧告書の交付', '不備欠陥事項が改善されない場合等に様式第5号を交付し、写しに受領印を徴して保管。再度改修（計画）報告書を提出させ、経過を確認・指導する。', '査察規程14条'],
    ['違反処理（警告・命令等）', '勧告を無視し状態が継続する場合や違反が重大な場合は、警告、命令その他関係法令に規定する違反処理へ移行する。', '査察規程15条'],
    ['命令の例', '改修等命令（法5条）、使用禁止等命令（法5条の2）、物件除去等命令（法5条の3）、防火管理者選任命令・措置命令（法8条3項・4項）、統括防火管理（法8条の2第5項・6項）、消防用設備等の設置維持命令（法17条の4）。命令時は標識の設置等により公示（法5条3項、規則2条の2、平成14年総務省告示568号）。', '消防法'],
  ];
  return `<div class="bar"><h1>査察と違反処理の流れ</h1></div>
  <section class="card"><h2>査察区分と回数（査察規程 別表第1・第2）</h2>
  <table class="mini"><tr><th>区分</th><th>範囲</th><th>回数</th></tr>
  <tr><td>第1種</td><td>特定防火対象物で甲種防火対象物又は自火報の設置義務規模以上</td><td>1年に1回以上</td></tr>
  <tr><td>第2種</td><td>非特定で甲種防火対象物又は自火報の設置義務規模以上</td><td>1年に1回以上</td></tr>
  <tr><td>第3種</td><td>危険物製造所等、高圧ガス関係施設等</td><td>1年に1回以上</td></tr>
  <tr><td>第4種</td><td>乙種防火対象物、消火器具の設置義務規模以上、少量危険物取扱所等、消防長指定</td><td>2年に1回以上</td></tr>
  <tr><td>第5種</td><td>その他すべて</td><td>消防長が別に定める</td></tr></table>
  <p class="note">第1・2種で結果良好かつ支障がないと認めるものは2年に1回以上に変更可。臨時・特別査察は定期査察とみなすことができる。</p></section>
  <section class="card"><h2>不備から違反処理まで</h2>${steps.map((s, k) => `<div class="step"><b>${k + 1}</b><div><div class="t">${s[0]}</div><div class="s">${s[1]}</div><button class="law" data-act="lawq" data-q="${esc(s[2])}">${s[2]}</button></div></div>`).join('')}</section>`;
}

// ===== 設定 =====

  const st = S.settings;
  return `<div class="bar"><h1>設定</h1></div>
  <section class="card"><h2>通知書の発出者</h2>
    <label class="f"><span>組織名</span><input data-set="org" value="${esc(st.org)}"></label>

  </section>
  <section class="card"><h2>バックアップ</h2>
    <p class="note">記録はこの端末のブラウザ内だけに保存されます。ブラウザのデータ消去で消えるため、定期的に書き出してください。</p>
    <div class="row wrap">${DL ? '<button class="btn pri" data-act="export">ファイルに書き出す</button>' : ''}<button class="btn" data-act="copyjson">データをコピー</button>
    <label class="btn">ファイルから読み込む<input type="file" accept=".json,application/json" data-act="import" hidden></label></div>
    <textarea rows="3" placeholder="コピーしたデータを貼り付けて「貼り付けから復元」" id="pasteJson"></textarea>
    <button class="btn" data-act="pasteimport">貼り付けから復元</button>
    <div id="setmsg" class="s"></div>

  </section>
  <section class="card"><h2>出典</h2>
    <p class="s">揖斐郡消防組合 火災予防条例・火災予防規則・火災予防査察規程・危険物規制規則・遠隔移報要綱・表示制度要綱（fd-ibi.jp 掲載PDF）、消防法・同施行令・同施行規則（e-Gov 法令検索）、消防庁告示一覧（fdma.go.jp）。</p>
    <p class="note">設置義務の判定は主要な基準を簡略化した目安です。最終判断は必ず条文・運用基準で行ってください。</p>
    <p class="note">アプリの版：${APP_VER}</p>

}

// ===== ダイアログ =====
function confirmBox(msg, ok){
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="box"><p>${esc(msg)}</p><div class="row"><button class="btn" data-x="no">キャンセル</button><button class="btn danger" data-x="yes">削除する</button></div></div>`;
  d.addEventListener('click', e => { const x = e.target.dataset.x; if (x) { d.remove(); if (x === 'yes') ok(); } });
  document.body.appendChild(d);
}
function msg(sel, t){ const el = $(sel); if (el) el.textContent = t; }

// ===== イベント =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-go]'); if (!b) return;
  if (b.dataset.go) { go(b.dataset.go); return; }
  const a = b.dataset.act, id = b.dataset.id;
  if (b.tagName === 'INPUT' && b.type === 'checkbox' && a !== 'toggleNo') return;
  switch (a) {
    case 'home': go('list'); break;
    case 'new': go('edit', { id: null }); break;
    case 'edit': go('edit', { id }); break;
    case 'open': go('detail', { id }); break;
    case 'toggleNo': V.showNo = b.checked; render(); break;
    case 'addcomp': readForm(); V.draft.comps.push({ use: '3-ro', area: '' }); $('#complist').insertAdjacentHTML('beforeend', compRow(V.draft.comps.at(-1), V.draft.comps.length - 1)); break;
    case 'delcomp': b.closest('.comp').remove(); break;
    case 'saveobj': {
      readForm(); const d = V.draft; d.updated = Date.now();
      if (!d.id) { d.id = uid(); S.objects.push(d); } else S.objects[S.objects.findIndex(x => x.id === d.id)] = d;
      save(); go('detail', { id: d.id }); break;
    }
    case 'delobj': confirmBox('この対象物と査察記録を削除します。', () => { S.objects = S.objects.filter(o => o.id !== id); S.inspections = S.inspections.filter(i => i.objId !== id); save(); go('list'); }); break;
    case 'newinsp': {
      const i = { id: uid(), objId: id, date: today(), kind: '定期査察', inspectors: S.settings.inspector || '', witness: '', results: {}, findings: [], memo: '' };
      S.inspections.push(i); const o = S.objects.find(x => x.id === id); if (o) o.updated = Date.now(); save(); go('inspect', { insp: i.id }); break;
    }
    case 'openinsp': go('inspect', { insp: id }); break;
    case 'backinsp': go('inspect'); break;
    case 'res': setResult(b.dataset.c, b.dataset.v); V.justStamped = b.dataset.c; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'addfd': { const i = S.inspections.find(x => x.id === V.insp); i.findings.push({ text: '', basis: '', deadline: '', status: 'open' }); save(); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'delfd': { const i = S.inspections.find(x => x.id === V.insp); const f = i.findings.splice(+b.dataset.k, 1)[0]; if (f && f.from) delete i.results[f.from]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
    case 'delinsp': confirmBox('この査察記録を削除します。', () => { const i = S.inspections.find(x => x.id === V.insp); S.inspections = S.inspections.filter(x => x.id !== V.insp); save(); go('detail', { id: i.objId }); }); break;
    case 'doc': go('doc', { docKind: b.dataset.k }); break;
    case 'copydoc': navigator.clipboard.writeText(docText(V.docKind)).then(() => msg('#docmsg', 'コピーしました'), () => msg('#docmsg', 'コピーできませんでした')); break;
    case 'dldoc': {
      const { o, i } = docData();
      const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>様式第${V.docKind}号</title><style>${PAPER_CSS}</style></head><body>${docHTML(V.docKind)}</body></html>`;
      DL.save({ filename: `様式第${V.docKind}号_${(o.name || '対象物').replace(/[\\/:*?"<>|]/g, '')}_${i.date}.html`, data: html }).then(() => msg('#docmsg', '保存しました。ブラウザで開いて印刷できます。'), () => msg('#docmsg', '保存されませんでした'));
      break;
    }
    case 'lawq': {
      go('laws', { lawQ: lawQuery(b.dataset.q), lawF: 'all', autoOpen: true });
      // 根拠条文が消防法令なら、その条の正文をすぐ取得して表示
      const eb = document.querySelector('details[open] [data-act=egov]'); if (eb) showArticle(eb);
      break;
    }
    case 'egov': showArticle(b); break;
    case 'lawf': V.lawF = b.dataset.k; render(); break;
    case 'export': DL.save({ filename: `査察記録バックアップ_${today()}.json`, data: JSON.stringify(S, null, 1) }).then(() => msg('#setmsg', '書き出しました'), () => msg('#setmsg', '書き出されませんでした')); break;
    case 'copyjson': navigator.clipboard.writeText(JSON.stringify(S)).then(() => msg('#setmsg', 'コピーしました'), () => msg('#setmsg', 'コピーできませんでした')); break;
    case 'pasteimport': importJSON($('#pasteJson').value); break;
  }
});
function lawQuery(basis){
  // 「消防法8条の2の4、条例40条」→ 最初の参照をキーワードに
  const first = basis.split(/[、,]/)[0].trim();
  let m;
  if ((m = first.match(/^条例(\d+条(?:の\d+)*)/))) return '条例' + m[1];
  if ((m = first.match(/^(?:消防法)?令(\d+条(?:の\d+)*)/))) return '令' + m[1];
  if ((m = first.match(/^規則(\d+条(?:の\d+)*)/))) return '規則' + m[1];
  if ((m = first.match(/^消防法(\d+条(?:の\d+)*)/))) return '消防法' + m[1];
  if ((m = first.match(/^査察規程(\d+条)/))) return '査察規程' + m[1];
  return first.replace(/[（(].*$/, '');
}
function importJSON(txt){
  try { const d = JSON.parse(txt); if (!Array.isArray(d.objects)) throw 0; S = Object.assign({ objects: [], inspections: [], settings: S.settings }, d); save(); msg('#setmsg', `復元しました（対象物 ${S.objects.length}件）`); }
  catch (e) { msg('#setmsg', '読み込めませんでした。バックアップのデータか確認してください。'); }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'import' && t.files[0]) { t.files[0].text().then(importJSON); return; }
  if (t.dataset.ins !== undefined) { const i = S.inspections.find(x => x.id === V.insp); i[t.dataset.ins] = t.value; save(); if (t.dataset.ins === 'date') render(); }
  if (t.dataset.fd !== undefined) { const i = S.inspections.find(x => x.id === V.insp); i.findings[+t.dataset.k][t.dataset.fd] = t.value; save(); if (t.dataset.fd === 'status') render(); }
  if (t.dataset.set !== undefined) { S.settings[t.dataset.set] = t.value; save(); }
});
let qt, composing = false;
// 日本語入力（IME）の変換中は検索しない。確定したら結果だけを書き換える
function searchUpdate(t){
  V[t.dataset.input] = t.value; V.autoOpen = false;
  clearTimeout(qt);
  qt = setTimeout(() => {
    const box = document.getElementById('res-' + t.dataset.input);
    if (box) box.innerHTML = t.dataset.input === 'q' ? listResults() : lawResultsHTML();
  }, 300);
}
document.addEventListener('compositionstart', e => { if (e.target.dataset && e.target.dataset.input) composing = true; });
document.addEventListener('compositionend', e => { if (e.target.dataset && e.target.dataset.input) { composing = false; searchUpdate(e.target); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input) { if (e.isComposing || composing) return; searchUpdate(t); }
  if (t.dataset.ins === 'inspectors' || t.dataset.ins === 'witness' || t.dataset.ins === 'memo') { const i = S.inspections.find(x => x.id === V.insp); i[t.dataset.ins] = t.value; save(); }
  if (t.dataset.fd === 'text' || t.dataset.fd === 'basis') { const i = S.inspections.find(x => x.id === V.insp); i.findings[+t.dataset.k][t.dataset.fd] = t.value; save(); }
});

let DL = null;
render();
// 通常のWebページ（GitHub Pages 等）ではブラウザのダウンロードを使う
if (!window.claude) DL = { save: ({ filename, data }) => new Promise(res => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/html' }));
  a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); res();
}) };
if (window.claude && claude.use) claude.use('downloads').then(d => { if (d) { DL = d; if (['settings', 'doc'].includes(V.view)) render(); } }).catch(() => {});

</script>
