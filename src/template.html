<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予防査察アプリ（揖斐郡 条例・規程対応）</title>
<style>
:root{--bg:#f4f3f0;--card:#fff;--ink:#1d1f22;--sub:#5f646b;--line:#e2e0db;--red:#b3261e;--red2:#fbe9e7;--amb:#8a5a00;--amb2:#fff3d6;--grn:#1e6b3a;--grn2:#e3f3e8;--blue:#1f4f8f;--blue2:#e6eef9}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1e2023;--ink:#ecebe8;--sub:#a3a7ad;--line:#33363b;--red:#ff8a80;--red2:#3a1f1d;--amb:#ffcf70;--amb2:#382c12;--grn:#7fd99b;--grn2:#16301f;--blue:#9cc2ff;--blue2:#1a2638}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
#view{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:19px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;text-align:left;color:inherit;font:inherit}
button.card{cursor:pointer}
.obj .t{font-weight:700;font-size:17px}
.s{color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:12.5px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips.f{margin:8px 0}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--ink);font-family:inherit}
button.chip{cursor:pointer;padding:7px 12px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.ng{background:var(--red2);color:var(--red);border-color:transparent;font-weight:700}
.chip.k1,.chip.k2{background:var(--red2);color:var(--red);border-color:transparent}
.chip.k3{background:var(--amb2);color:var(--amb);border-color:transparent}
.chip.k4{background:var(--blue2);color:var(--blue);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;gap:4px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.btn.pri{color:#1a0000}}
.btn.ghost{border-color:transparent;background:transparent;padding:8px 6px;color:var(--blue)}
.btn.danger{color:var(--red);border-color:var(--red2)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.btn.wide{width:100%;margin:6px 0 10px}
.row{display:flex;gap:8px;margin-top:10px}.row.wrap{flex-wrap:wrap}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.empty{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.9}
.f{display:block;margin:0 0 10px}.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
.f input,.f select,textarea,.comp select,.comp input{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.f small,.cb small{display:block;color:var(--sub);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
.cb{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.cb input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--red)}
.cb.inline{border:0;padding:0 0 6px}
.hide{display:none}
.comp{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-bottom:6px;align-items:center}
.sticky{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:2}
.cls{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.cls b{display:block;font-size:17px}.cls span{display:block;font-size:14px}.cls small{color:var(--sub);font-size:11.5px}
.cls.k1,.cls.k2{background:var(--red2)}.cls.k1 b,.cls.k2 b{color:var(--red)}
.cls.k3{background:var(--amb2)}.cls.k4{background:var(--blue2)}
.warn{background:var(--amb2);color:var(--amb);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.li{display:flex;justify-content:space-between;gap:8px;width:100%;padding:12px 2px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.ng{color:var(--red)}
.jr{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.jr .t{font-weight:700}.jr.no{opacity:.6}
.st{flex:none;font-size:12px;border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap}
.st.req{background:var(--red2);color:var(--red)}.st.chk{background:var(--amb2);color:var(--amb)}.st.no{background:var(--bg);color:var(--sub)}
.law{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;padding:2px 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.prog{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0 4px}.prog div{height:100%;background:var(--grn)}
.ck{padding:12px 0;border-top:1px solid var(--line)}
.ck .t{font-size:15px}.ck .t small{color:var(--amb)}
.ck.ng{background:linear-gradient(90deg,var(--red2),transparent 70%);margin:0 -14px;padding:12px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.seg button{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.seg .on.ok{background:var(--grn);border-color:var(--grn);color:#fff}
.seg .on.ng{background:var(--red);border-color:var(--red);color:#fff}
.seg .on.na{background:var(--sub);border-color:var(--sub);color:#fff}
@media (prefers-color-scheme:dark){.seg .on.ok,.seg .on.ng,.seg .on.na{color:#111}}
.fd{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.fdh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.fdh b{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.fdh select{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.step>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:13px}.step .t{font-weight:700}
table.mini{width:100%;border-collapse:collapse;font-size:13px}.mini th,.mini td{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}.mini td:first-child{white-space:nowrap;font-weight:700}
details.law-r summary{cursor:pointer;list-style:none;font-size:14.5px}details.law-r summary::-webkit-details-marker{display:none}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--blue2);color:var(--blue);vertical-align:2px}
.loc .tag{background:var(--red2);color:var(--red)}.kok .tag{background:var(--amb2);color:var(--amb)}
.lt{white-space:pre-wrap;font-size:14px;line-height:1.75;margin:10px 0;padding-top:10px;border-top:1px solid var(--line)}
.egov{margin-top:8px}.egov-t{border-left:3px solid var(--blue);padding-left:10px;border-top:0}
.law-r a{color:var(--blue);font-size:13.5px;display:inline-block;margin-top:4px}
mark{background:#ffe08a;color:#000;border-radius:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:11.5px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--red);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9;padding:20px}.modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%}
/* 書類プレビュー */
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:18px 16px;margin:10px 0 20px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:14px;line-height:1.75;overflow-x:auto}
.paper .c{text-align:center}.paper .r{text-align:right}.paper .frm,.paper .small{font-size:12px}.paper h2{letter-spacing:.3em;font-size:18px;margin:10px 0}
.dt{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:13px}.dt th,.dt td{border:1px solid #000;padding:4px 6px;vertical-align:top;text-align:left}.dt th{background:#f2f2f2;white-space:nowrap}.list td:first-child{text-align:center;width:2.5em}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-go="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>対象物</button>
  <button data-go="laws"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>条文検索</button>
  <button data-go="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>違反処理</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
</nav>
<script type="application/json" id="localtexts">__LOCALTEXTS__</script>
<script>

__NATIONAL__

</script>
</body>
</html>
